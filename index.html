  /* ---- Kind (Henry / Hannah) ---- */
  function dashKid(pid){
    const k=S.date, db=Store.get(), day=Store.dayRead(k), p=P(pid);
    const st = Engine.dayStats(pid,k);
    const basics = st.basics.map(b=> taskRow({ id:b.id, action:"toggleBasic", done:!!day.basics[b.id], title:b.title, icon:b.icon,
      right: b.unlocksMedia? '<span class="chip gold" title="Schaltet Medienzeit frei">'+Art.icon("unlock")+'</span>':'' })).join("") || empty("Heute keine Basics.","star");
    const chores = st.chores.length? st.chores.map(c=> taskRow({ id:c.id, action:"toggleChore", done:!!day.chores[c.id], title:c.title, sub:c.room, icon:"broom" })).join("")
                                   : empty("Heute keine Haushaltsaufgabe für dich.","broom");
    const mine = Engine.missionsOf(pid);
    const missions = mine.length? mine.map(m=>{
      if(m.status==="claimed") return '<div class="task" data-a="completeMission" data-id="'+m.id+'" role="button" tabindex="0">'
        + '<span class="check">'+Art.checkPath+'</span><span class="t-ico">'+Art.illu(m.icon)+'</span>'
        + '<span class="t-body"><span class="t-title">'+esc(m.title)+'</span><span class="t-sub">offen · '+m.coins+' Coins bei Erledigung</span></span>'
        + '<button class="btn ghost sm" data-a="returnMission" data-id="'+m.id+'" data-stopclick="1">Zurückgeben</button></div>';
      return '<div class="task done"><span class="check">'+Art.checkPath+'</span><span class="t-body"><span class="t-title">'+esc(m.title)+'</span><span class="t-sub">erledigt · +'+m.coins+' Coins</span></span></div>';
    }).join("") : empty("Noch keine Mission übernommen. Schau in die Jobbörse.","sparkle");

    const redeemed = db.state.redemptions.filter(r=>r.person===pid).slice(0,4);
    const rew = redeemed.length? redeemed.map(r=>'<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2)"><span style="width:30px;flex:none">'+Art.illu(Store.get().rewards.find(x=>x.id===r.reward)?.icon||"star")+'</span><div style="flex:1"><b class="small">'+esc(r.title)+'</b><div class="xs muted">'+r.date+(r.used?" · eingelöst":"")+'</div></div><button class="btn ghost sm" data-a="useRedemption" data-id="'+r.id+'">'+(r.used?"zurück":"benutzt")+'</button></div>').join("")
      : '<p class="small muted">Noch nichts eingelöst. Im Bereich Jobs findest du den Belohnungs-Shop.</p>';

    const pct = st.total? Math.round(st.done/st.total*100):100;
    let hint = '';
    if(pid==="hannah"){
      const lv = Engine.hannahLeave(k);
      hint = '<div class="card accent" style="--acc:'+pcol(pid)+'"><div class="row" style="align-items:flex-start;gap:12px">'
        + '<span style="width:36px;flex:none">'+Art.illu("bike")+'</span>'
        + '<div><b class="small">Betreuung verlassen um '+lv.time+'</b><p class="xs muted">'+esc(lv.reason)+'</p></div></div></div>';
    }

    return '<div class="stack lg" style="padding-top:14px">'
      + whoBar()
      + heroPerson(pid, st.open? st.open+" Sachen warten noch auf dich — "+st.done+" hast du schon."
                              : "Alles erledigt. Stark.",
          '<div style="margin-top:16px">'+bar(pct)+'</div>'
        + '<div class="row" style="margin-top:14px;gap:10px;flex-wrap:wrap">'
        + '<span class="coin-badge">'+Art.illu("coin")+(db.state.coins[pid]||0)+' Coins</span>'
        + '<span class="chip">'+esc(Art.companionName(p.companion))+' ist dabei</span></div>')
      + morningPanel(pid)
      + hint
      + '<div class="two-col"><div class="stack">'
      + '<div><div class="section-h"><h2>Dein Tag</h2></div><div class="card">'+scheduleList(pid)+'</div></div>'
      + '<div><div class="section-h"><h2>Daily Basics</h2><span class="hint">antippen zum Abhaken</span></div><div class="card">'+basics+'</div></div>'
      + '<div><div class="section-h"><h2>Haushalt</h2></div><div class="card">'+chores+'</div></div>'
      + '</div><div class="stack">'
      + mediaCard(pid)
      + '<div><div class="section-h"><h2>Deine Missionen</h2></div><div class="card">'+missions+'</div></div>'
      + '<div><div class="section-h"><h2>Deine Belohnungen</h2></div><div class="card">'+rew+'</div></div>'
      + '</div></div>'
      + capBoard(pid)
      + '<div>'+missionBoard(pid)+'</div>'
      + '</div>';
  }

  /* ==========================  JOBS  ========================== */
  function viewJobs(){
    const db=Store.get(), kid=S.jobKid, coins=db.state.coins[kid]||0, age=P(kid).age;
    const kidTabs = '<div class="tabs" data-ks="tabs">'+db.people.filter(p=>p.role==="child").map(p=>
      '<button data-a="setJobKid" data-id="'+p.id+'" aria-pressed="'+(kid===p.id)+'">'+esc(p.name)+'</button>').join("")+'</div>';

    const open = Engine.openMissions();
    const forKid = open.filter(m=> Engine.canDo(kid,m));
    const tooOld = open.filter(m=> !Engine.canDo(kid,m));
    const board = forKid.length? forKid.map(m=>
      '<div class="mission"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body">'
      + '<b>'+esc(m.title)+'</b><p class="small muted">'+esc(m.desc)+'</p>'
      + '<div class="row" style="gap:8px;margin-top:9px;flex-wrap:wrap"><span class="chip gold">'+Art.icon("coinI")+m.coins+'</span>'
      + '<span class="chip">ab '+m.minAge+' Jahren</span>'
      + '<button class="btn sm" data-a="claimMission" data-id="'+m.id+'">Übernehmen</button></div></div></div>').join("")
      : empty("Gerade sind keine passenden Missionen frei.","sparkle");

    const mine = Engine.missionsOf(kid);
    const mineBox = mine.length? mine.map(m=> m.status==="claimed"
      ? '<div class="mission claimed"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body"><b>'+esc(m.title)+'</b>'
        + '<p class="small muted">Noch offen — Haken setzt du in deinem Dashboard oder hier.</p>'
        + '<div class="row" style="gap:8px;margin-top:9px"><button class="btn sm" data-a="completeMission" data-id="'+m.id+'">Erledigt — '+m.coins+' Coins</button>'
        + '<button class="btn ghost sm" data-a="returnMission" data-id="'+m.id+'">Zurückgeben</button></div></div></div>'
      : '<div class="mission" style="opacity:.72"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body"><b>'+esc(m.title)+'</b><p class="small muted">Erledigt · +'+m.coins+' Coins</p></div></div>').join("")
      : empty("Noch nichts übernommen.","box");

    const rewards = db.rewards.filter(r=> age>=(r.minAge||0)).map(r=>{
      const can = coins>=r.cost;
      return '<div class="reward"><span class="r-ico">'+Art.illu(r.icon)+'</span><div style="flex:1;min-width:0">'
        + '<b class="small">'+esc(r.title)+'</b><p class="xs muted">'+esc(r.desc)+'</p>'
        + (!can? '<div style="margin-top:7px;max-width:160px">'+bar(coins/r.cost*100,"gold")+'<span class="xs muted">noch '+(r.cost-coins)+' Coins</span></div>':'')
        + '</div><button class="btn '+(can?"gold":"ghost")+' sm" data-a="redeem" data-id="'+r.id+'" '+(can?"":"disabled")+'>'+r.cost+'</button></div>';
    }).join("");

    const red = db.state.redemptions.filter(r=>r.person===kid);
    const redBox = red.length? red.map(r=>'<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2)"><div style="flex:1"><b class="small">'+esc(r.title)+'</b><div class="xs muted">'+r.date+' · '+r.cost+' Coins'+(r.used?" · benutzt":"")+'</div></div><button class="btn ghost sm" data-a="useRedemption" data-id="'+r.id+'">'+(r.used?"zurück":"benutzt")+'</button></div>').join("")
      : '<p class="small muted">Noch nichts eingelöst.</p>';

    const tg = db.teamGoal;
    const team = '<div class="card"><div class="row" style="gap:14px"><span style="width:48px;flex:none">'+Art.illu(tg.icon)+'</span>'
      + '<div style="flex:1"><b>'+esc(tg.title)+'</b><p class="xs muted">Gemeinsam für alle — kein Wettbewerb.</p></div></div>'
      + '<div style="margin-top:12px">'+bar(tg.progress/tg.target*100)+'</div>'
      + '<p class="xs muted" style="margin-top:6px">'+tg.progress+' von '+tg.target+' Punkten. Jede erledigte Extra-Mission zählt für die ganze Familie mit.</p></div>';

    return '<div class="stack lg" style="padding-top:18px">'

      + '<p class="small muted" style="margin-top:6px">Übernehmen heißt noch nicht erledigt. Coins gibt es erst mit dem Haken.</p></div>'
      + kidTabs
      + '<div class="row" style="gap:10px"><span class="coin-badge">'+Art.illu("coin")+coins+' Coins</span>'+personPill(kid)+'</div>'

      + '</div><div class="stack">'

      + '<div><div class="section-h"><h2>Familienziel</h2></div>'+team+'</div>'
      + '</div></div></div>';

  /* ==========================  HAUS  ========================== */
  function condMeter(pct){
    return '<div class="meter"><i style="width:'+clamp(pct,2,100)+'%"></i></div>';
  }
  function condRow(c, k, assign, day){
    const z = Engine.condition(c,k), who = assign[c.id];
    const done = !!day.chores[c.id];
    return '<div class="chore-row'+(done?" is-done":"")+'" data-lvl="'+(z.pct>=70?"ok":z.pct>=40?"mid":z.pct>=15?"low":"crit")+'">'
      + '<div class="cr-main">'
      + '<div class="row" style="gap:8px;align-items:baseline">'
      + '<b class="small" style="flex:1">'+esc(c.title)+'</b>'
      + '<span class="cr-pct">'+(done? "frisch" : z.pct+" %")+'</span></div>'
      + condMeter(done?100:z.pct)
      + '<div class="xs muted" style="margin-top:5px">'+esc(c.room)+' · '+z.minutes+' Min · '
      + (done? "gerade erledigt" : z.label+", zuletzt vor "+z.since+(z.since===1?" Tag":" Tagen"))+'</div>'
      + '</div>'
      + (who==="*" ? '<span class="chip">Familie</span>'
         : who ? '<span class="pill-person" style="background:'+P(who).soft+'">'+Art.avatar(who)+esc(P(who).name)+'</span>'
         : '<span class="chip warn" title="Niemand hat die passende Stufe oder ist verfügbar">niemand frei</span>')
      + '<button class="btn '+(done?"soft":"ghost")+' sm" data-a="toggleChore" data-id="'+c.id+'">'+(done?"erledigt":"Erledigt")+'</button>'
      + '</div>';
  }
  function viewHouse(){
    const k=S.date, db=Store.get(), day=Store.dayRead(k), assign=Engine.assignmentsFor(k);
    const health = Engine.houseHealth(k);
    const budget = S.timeBudget;

    const rooms = ["alle"].concat([...new Set(db.chores.map(c=>c.room))]);
    const tabs = '<div class="tabs" data-ks="tabs">'+rooms.map(r=>'<button data-a="setHouseFilter" data-id="'+r+'" aria-pressed="'+(S.houseFilter===r||(S.houseFilter==="all"&&r==="alle"))+'">'+esc(r)+'</button>').join("")+'</div>';
    const inFilter = c => (S.houseFilter==="all"||S.houseFilter==="alle") ? true : c.room===S.houseFilter;

    /* Zustandsaufgaben, schlechteste zuerst */
    const list = Engine.stateChores().filter(inFilter)
      .map(c=>({c, z:Engine.condition(c,k)}))
      .sort((a,b)=> (day.chores[a.c.id]?1:0)-(day.chores[b.c.id]?1:0) || a.z.raw-b.z.raw)
      .map(x=> condRow(x.c,k,assign,day)).join("") || empty("In diesem Bereich gibt es nichts.","broom");

    /* Termine */
    const dates = Engine.dateChores().filter(inFilter).map(c=>{
      const st = Engine.choreStatus(c,k), who = assign[c.id];
      return '<div class="chore-row"><div class="cr-main">'
        + '<b class="small">'+esc(c.title)+'</b>'
        + '<div class="xs muted" style="margin-top:3px">'+["montags","dienstags","mittwochs","donnerstags","freitags","samstags","sonntags"][c.fixedDay-1]
        + ' · '+(st.days<0? (-st.days)+" Tage überfällig" : st.days===0? "heute" : "in "+st.days+" Tagen")+'</div></div>'
        + (who && who!=="*" ? '<span class="pill-person" style="background:'+P(who).soft+'">'+Art.avatar(who)+'</span>' : '')
        + '<button class="btn '+(day.chores[c.id]?"soft":"ghost")+' sm" data-a="toggleChore" data-id="'+c.id+'">'+(day.chores[c.id]?"erledigt":"Erledigt")+'</button></div>';
    }).join("");

    /* Tägliche Routinen */
    const routine = Engine.routineChores().filter(inFilter).map(c=>{
      const who = assign[c.id];
      return taskRow({ id:c.id, action:"toggleChore", done:!!day.chores[c.id], title:c.title,
        sub:(who && who!=="*" ? P(who).name+" · " : "")+"täglich", icon:"broom" });
    }).join("");

    /* Zeitbudget */
    const sug = budget ? Engine.suggest(k, budget) : null;
    const budgetBox = '<div class="card"><div class="row" style="gap:10px;flex-wrap:wrap">'
      + '<b class="small" style="flex:1 1 100%">Wie viel Zeit hast du gerade?</b>'
      + [10,20,30,60].map(n=>'<button class="btn '+(budget===n?"":"ghost")+' sm" data-a="setBudget" data-n="'+n+'">'+n+' Min</button>').join("")
      + (budget? '<button class="btn ghost sm" data-a="setBudget" data-n="0">zurück</button>':'')
      + '</div>'
      + (sug ? (sug.picks.length
          ? '<div class="stack" style="gap:10px;margin-top:14px">'
            + sug.picks.map(x=>'<div class="row" style="gap:10px"><span style="width:30px;flex:none">'+Art.illu("broom")+'</span>'
              + '<div style="flex:1;min-width:0"><b class="small">'+esc(x.c.title)+'</b>'
              + '<div class="xs muted">'+x.cond.pct+' % · '+x.cond.minutes+' Min</div></div>'
              + '<button class="btn sm" data-a="toggleChore" data-id="'+x.c.id+'">Erledigt</button></div>').join("")
            + '<p class="xs muted">Zusammen '+(budget-sug.rest)+' von '+budget+' Minuten. Das bringt den Hauszustand am weitesten nach oben.</p></div>'
          : '<p class="small muted" style="margin-top:12px">In der Zeit passt gerade nichts — alles Kleine ist frisch.</p>') : '')
      + '</div>';

    const load = db.people.map(p=>{
      const n = db.state.choreHistory[p.id]||0;
      const max = Math.max(1, ...db.people.map(x=>db.state.choreHistory[x.id]||0));
      return '<div style="margin-bottom:12px"><div class="row"><b class="small">'+esc(p.name)+'</b><span class="spacer"></span><span class="xs muted">'+n+' Punkte</span></div>'
        + '<div style="margin-top:5px">'+bar(n/max*100)+'</div></div>';
    }).join("");

    const sh = db.settings.shopping;
    return '<div class="stack lg" style="padding-top:18px">'
      + '<div><span class="eyebrow">Haushaltsgedächtnis</span><h1 style="margin-top:4px">Haus</h1></div>'
      + '<div class="card health" data-lvl="'+(health>=70?"ok":health>=40?"mid":health>=15?"low":"crit")+'">'
      + '<div class="row" style="gap:14px"><span style="width:44px;flex:none">'+Art.illu("broom")+'</span>'
      + '<div style="flex:1"><div class="row" style="align-items:baseline;gap:8px">'
      + '<b style="font-family:var(--font-display);font-size:28px">'+health+' %</b>'
      + '<span class="small muted">Hauszustand</span></div>'
      + '<div style="margin-top:8px">'+condMeter(health)+'</div></div></div>'
      + '<p class="xs muted" style="margin-top:10px">Jede Aufgabe startet nach dem Erledigen bei 100 % und wird langsam weniger. Nichts ist „überfällig" — es wird nur wieder Zeit.</p></div>'
      + budgetBox
      + tabs
      + '<div class="two-col"><div class="stack">'
      + '<div><div class="section-h"><h2>Zustand</h2><span class="hint">schlechteste zuerst</span></div><div class="card">'+list+'</div></div>'
      + (routine? '<div><div class="section-h"><h2>Täglich</h2></div><div class="card">'+routine+'</div></div>':'')
      + (dates? '<div><div class="section-h"><h2>Feste Termine</h2></div><div class="card">'+dates+'</div></div>':'')
      + '</div><div class="stack">'
      + '<div><div class="section-h"><h2>Lastverteilung</h2><span class="hint">damit es nicht immer dieselbe Person trifft</span></div><div class="card">'+load+'</div></div>'
      + '<div class="card"><div class="row" style="gap:12px"><span style="width:42px;flex:none">'+Art.illu("box")+'</span>'
      + '<div style="flex:1"><b class="small">Einkaufsslot</b><p class="xs muted">'+["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"][sh.day-1]+', '+sh.start+' — '+sh.minutes+' Minuten.</p></div></div></div>'
      + '<div class="card"><div class="row" style="gap:12px"><span style="width:42px;flex:none">'+Art.illu("broom")+'</span>'
      + '<div style="flex:1"><b class="small">Freitags-Reset</b><p class="xs muted">Donnerstagabend räumen alle 10 Minuten gemeinsam auf.</p></div></div></div>'
      + '</div></div></div>';
  }

  /* ==========================  ADMIN  ========================== */

             {k:"travel.min",l:"Fahrzeit in Minuten",t:"number"} ]

  const getV=(o,k)=> k.split(".").reduce((a,p)=> a==null?undefined:a[p], o);
  function setV(o,k,v){ const ps=k.split("."); let cur=o; ps.slice(0,-1).forEach(p=>{ if(typeof cur[p]!=="object"||!cur[p]) cur[p]={}; cur=cur[p]; }); cur[ps[ps.length-1]]=v; }

  function fieldHTML(f, obj){
    const v = getV(obj,f.k);
    const n = 'data-f="'+f.k+'"';
    if(f.t==="days"){
      return '<label class="f">'+esc(f.l)+'</label><div class="row" style="gap:6px;flex-wrap:wrap" '+n+' data-type="days">'
        + DAYS.map((d,i)=>'<button type="button" class="btn '+((v||[]).includes(i+1)?"soft":"ghost")+' sm"'
            + ' data-a="tglOpt" data-day="'+(i+1)+'" aria-pressed="'+((v||[]).includes(i+1))+'">'+d+'</button>').join("")+'</div>';
    }
    if(f.t==="multi"){
      const opts = f.o();
      return '<label class="f">'+esc(f.l)+'</label><div class="row" style="gap:6px;flex-wrap:wrap" '+n+' data-type="multi">'
        + opts.map(o=>'<button type="button" class="btn '+((v||[]).includes(o.v)?"soft":"ghost")+' sm"'
            + ' data-a="tglOpt" data-val="'+esc(o.v)+'" aria-pressed="'+((v||[]).includes(o.v))+'">'+esc(o.l)+'</button>').join("")+'</div>';
    }
    if(f.t==="check") return '<label class="row" style="gap:10px"><input type="checkbox" '+n+' data-type="check" '+(v?"checked":"")+' style="width:22px;height:22px"><span class="small">'+esc(f.l)+'</span></label>';

  function normTime(raw){
    const t = String(raw||"").trim();
    if(!t) return null;
    const d = t.replace(/\D/g, "");
    let h, m;
    if(/[:.\s]/.test(t)){
      const parts = t.split(/[:.\s]+/);
      h = parseInt(parts[0],10); m = parseInt(parts[1]||"0",10);
    } else if(d.length <= 2){ h = parseInt(d,10); m = 0; }
    else if(d.length === 3){ h = parseInt(d.slice(0,1),10); m = parseInt(d.slice(1),10); }
    else { h = parseInt(d.slice(0,2),10); m = parseInt(d.slice(2,4),10); }
    if(!isFinite(h) || !isFinite(m) || h<0 || h>23 || m<0 || m>59) return null;
    return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  }
  function readForm(){
    const form = el("editForm"); const coll = form.dataset.coll;

      if(!node) return;
      const type = node.dataset.type;
      let val;
      if(type==="days") val = [...node.querySelectorAll("button")].filter(b=>b.classList.contains("soft")).map(b=>+b.dataset.day);
      else if(type==="multi") val = [...node.querySelectorAll("button")].filter(b=>b.classList.contains("soft")).map(b=>b.dataset.val);
      else if(type==="check") val = node.checked;
      else if(type==="number") val = node.value===""? null : Number(node.value);
      else val = node.value;
      if(f.k==="travel.mode" && !val){ obj.travel = null; return; }
      setV(obj, f.k, val);
    });
    if(obj.travel && !obj.travel.min) obj.travel.min = 10;
    return { coll, obj };
  }

  /* ==========================  RENDER + EVENTS  ========================== */
  const TABS = [["today","Heute","today"],["me","Ich","me"],["jobs","Jobs","jobs"],["house","Haus","house"],["admin","Admin","admin"]];
  function renderNav(){
    const list = TABS.filter(t=> t[0]!=="admin" || Device.adminVisible());
    el("nav").innerHTML = list.map(t=>'<button data-a="tab" data-id="'+t[0]+'" '+(S.tab===t[0]?'aria-current="page"':'')+'>'+Art.icon(t[2])+'<span>'+t[1]+'</span></button>').join("");
    el("nav").style.gridTemplateColumns = window.innerWidth < 900 ? "repeat("+list.length+",1fr)" : "";
  }
  function applyTheme(){
    const t = (Store.get().settings||{}).navTheme || "dark";
    if(document.documentElement && document.documentElement.setAttribute){
      document.documentElement.setAttribute("data-nav", t);
      document.documentElement.setAttribute("data-wall", Device.isWall() ? "1" : "0");
    }
  }
  let pendingBg = false;
  function isEditing(){
    const a = document.activeElement;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||""));
  }
  /* Merkt sich, wo innerhalb scrollbarer Bereiche gerade gescrollt wurde */
  function grabScroll(){
    const m = {};
    (document.querySelectorAll ? document.querySelectorAll("[data-ks]") : []).forEach(n=>{
      m[n.getAttribute("data-ks")] = { x:n.scrollLeft, y:n.scrollTop };
    });
    return m;
  }
  function putScroll(m){
    (document.querySelectorAll ? document.querySelectorAll("[data-ks]") : []).forEach(n=>{
      const v = m[n.getAttribute("data-ks")];
      if(v){ n.scrollLeft = v.x; n.scrollTop = v.y; }
    });
  }
  function grabFocus(){
    const a = document.activeElement;
    if(!a || !a.getAttribute || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||"")) return null;
    const sel = ["data-a","data-f","data-k","data-p","data-w","data-d","data-n","data-id"]
      .filter(k=>a.getAttribute(k)!=null).map(k=>'['+k+'="'+a.getAttribute(k)+'"]').join("");
    if(!sel) return null;
    return { sel, start:a.selectionStart, end:a.selectionEnd };
  }
  function putFocus(f){
    if(!f || !document.querySelector) return;
    const n = document.querySelector(f.sel);
    if(!n || !n.focus) return;
    n.focus();
    try{ if(f.start!=null && n.setSelectionRange) n.setSelectionRange(f.start, f.end); }catch(e){}
  }
  function paintStatusDot(){
    const sy = Sync.state(), dot = el("syncDot");
    if(!dot) return;
    dot.style.display = sy.configured ? "inline-flex" : "none";
    dot.className = "sync-dot s-"+sy.status;
    dot.title = sy.status==="ok" ? "Synchronisiert" : sy.status==="error" ? ("Sync-Problem: "+sy.detail) : "Gleicht ab …";
  }
  /* Nur die Anzeigen in der Kopfzeile auffrischen */
  function paintStatus(){
    paintStatusDot();
    if(S.tab==="admin" && S.adminTab==="data" && !isEditing()) render();
  }
  function render(src){
    if(src === "bg" && isEditing()){ pendingBg = true; return; }   /* nicht beim Tippen umbauen */
    applyTheme();
    const y = window.scrollY, ks = grabScroll(), fc = grabFocus();
    el("mark").innerHTML = Art.mark();
    el("dateB").textContent = T.dayShort(S.date)+", "+T.long(S.date);
    el("dateS").textContent = "Woche "+Engine.weekType(S.date);
    const w = Weather.get(), wb = el("wxBox");
    if(wb){
      const today = w && w.days ? w.days.find(x=>x.date===T.key(new Date())) : null;
      if(w && w.now){
        wb.style.display = "inline-flex";
        wb.className = "wx" + (w.err? " stale":"");
        wb.innerHTML = Art.wx(w.now.code) + '<span>' + w.now.t + '°</span>'
          + (today? '<span class="wx-max">bis ' + today.max + '°</span>'
                  + '<span class="wx-range">Tief ' + today.min + '°'
                  + (today.rain!=null && today.rain>=20 ? ' · ' + today.rain + ' % Regen' : '') + '</span>' : '');
        wb.title = w.name + " · " + Weather.text(w.now.code) + (w.err? " · zuletzt aktualisiert, Verbindung fehlt" : "");
      }else if(w && w.err){
        wb.style.display = "inline-flex";
        wb.className = "wx stale";
        wb.innerHTML = Art.icon("refresh") + '<span>Wetter</span>';
        wb.title = w.err;
      }else{
        wb.style.display = "none";
      }
    }
    paintStatusDot();
    renderNav();
    const v = el("view");
    try{
      v.innerHTML = S.tab==="today"? viewToday() : S.tab==="me"? viewMe() : S.tab==="jobs"? viewJobs() : S.tab==="house"? viewHouse() : viewAdmin();
    }catch(err){
      console.error(err);
      v.innerHTML = '<div class="card" style="margin-top:24px"><h2>Diese Ansicht lässt sich gerade nicht aufbauen</h2>'
        + '<p class="small muted" style="margin-top:8px">'+esc(err.message)+'</p>'
        + '<button class="btn ghost" style="margin-top:14px" data-a="tab" data-id="today">Zurück zu Heute</button></div>';
    }
    window.scrollTo(0,y);
    putScroll(ks);
    putFocus(fc);
  }

  function pop(id){ const n = document.querySelector('[data-id="'+id+'"]'); if(n) { n.classList.add("pop"); setTimeout(()=>n.classList.remove("pop"),420); } }

  function handle(e){
    const node = e.target.closest("[data-a]");
    if(!node) return;
    if(node.classList.contains("modal-bg") && e.target!==node) return;
    const a = node.dataset.a, id = node.dataset.id, k = S.date;
    switch(a){
      case "tab": S.tab=id; render(); window.scrollTo(0,0); break;
      case "setPerson": S.person=id; render(); break;
      case "openPerson": S.person=id; S.tab="me"; render(); window.scrollTo(0,0); break;
      case "setJobKid": S.jobKid=id; render(); break;
      case "setBandMode": S.bandMode = id; render(); break;
      case "setTtKid": S.ttKid = id; render(); break;
      case "setTtWeek": S.ttWeek = id; render(); break;
      case "evDetail": {
        const evs = Engine.eventsFor(id, k), ev0 = evs[+node.dataset.n];
        if(!ev0) break;
        const tv = evs.find(x=> x.travelOf === (ev0.ref||ev0.id));
        const c = EV_COLOR[ev0.kind] || EV_COLOR.family;
        modal(ev0.title,
          '<div class="row" style="gap:12px;margin-bottom:14px">'
          + '<span style="width:46px;flex:none">'+Art.avatar(id)+'</span>'
          + '<div><b>'+esc(P(id).name)+'</b><div class="small muted">'+T.dayName(k)+', '+T.long(k)+'</div></div></div>'
          + '<div class="card flat"><div class="row" style="gap:10px"><span style="width:20px;color:'+c[1]+'">'+Art.icon("clock")+'</span>'
          + '<b>'+ev0.start+' – '+ev0.end+'</b><span class="spacer"></span>'
          + '<span class="chip">'+Math.round(T.min(ev0.end)-T.min(ev0.start))+' Min</span></div>'
          + (tv? '<p class="small" style="margin-top:10px">Aufbruch um <b>'+tv.start+'</b> — '+esc(tv.title)+'</p>':'')
          + (ev0.note? '<p class="small muted" style="margin-top:10px">'+esc(ev0.note)+'</p>':'')
          + (ev0.subjects? '<p class="small muted" style="margin-top:10px">'+esc(ev0.subjects.map(x=>x.block.label+" "+x.subject).join(" · "))+'</p>':'')
          + '</div>',
          '<button class="btn ghost block" data-a="closeModal">Schließen</button>');
        break; }
      case "morningStep": {
        const cur = ((Store.dayRead(k).morning||{})[id]||{})[node.dataset.k];
        Actions.morningStep(id, node.dataset.k, !cur, k);
        if(!cur){
          confetti(e, 12);
          const m = Engine.morningState(id,k);
          if(m.allDone){ confetti(e,26); celebrate(); toast(P(id).name+" ist startklar."); }
        }
        break; }
      case "unlockCap": {
        const cap = Engine.capById(node.dataset.k);
        Actions.capSet(id, node.dataset.k, true);
        confetti(e, 26); celebrate();
        toast(P(id).name+" kann jetzt: "+(cap? cap.title : "eine neue Aufgabe"), "gold");
        break; }
      case "toggleCap": Actions.capSet(node.dataset.p, node.dataset.k, node.dataset.on!=="1"); break;
      case "setBudget": S.timeBudget = (+node.dataset.n)||null; render(); break;
      case "setHouseFilter": S.houseFilter = id==="alle"?"all":id; render(); break;
      case "setAdminTab": S.adminTab=id; render(); break;
      case "dateShift": S.date = T.addDays(S.date, +node.dataset.n); Actions.ensureDay(S.date); render(); break;
      case "dateToday": S.date = T.key(new Date()); render(); break;
      case "toggleBasic": {
        Actions.toggleBasic(id,k); pop(id);
        if(Store.dayRead(k).basics[id]){
          confetti(e, 14);
          const b0 = Store.get().basics.find(x=>x.id===id);
          if(b0){
            const all = Engine.basicsFor(b0.person,k);
            if(all.length && all.every(x=>Store.dayRead(k).basics[x.id])){
              confetti(e, 26); celebrate();
              toast(P(b0.person).name+": alle Basics für heute geschafft.", "gold");
            }
          }
        }
        break; }
      case "toggleChore": {
        Actions.toggleChore(id,k,e); pop(id);
        if(Store.dayRead(k).chores[id]) confetti(e, 16);
        break; }
      case "claimMission": {
        const who = S.tab==="jobs" ? S.jobKid : S.person;
        Actions.claimMission(id, who);
        if(S.tab==="me") confetti(e, 12);
        break; }
      case "returnMission": e.stopPropagation(); Actions.returnMission(id); break;
      case "completeMission": Actions.completeMission(id,k,e); break;
      case "redeem": Actions.redeem(id, S.jobKid, e); break;
      case "useRedemption": Actions.markRedemptionUsed(id); break;
      case "logMedia": Actions.logMedia(id, +node.dataset.n, k); break;
      case "undoMedia": Actions.undoMedia(id, +node.dataset.n, k); break;
      case "swapEvening": Actions.swapEvening(k); break;
      case "edit": openEdit(node.dataset.coll, id); break;
      case "del": if(confirm("Wirklich löschen?")) Actions.remove(node.dataset.coll, id); break;
      case "saveEdit": {
        const {coll,obj} = readForm();
        if(!obj.title || !String(obj.title).trim()){ toast("Bitte einen Titel eintragen."); break; }
        if(coll==="morningSteps" && !obj.by){ toast("Bitte eine Uhrzeit angeben."); break; }
        if(coll==="absences"){
          if(!obj.from || !obj.to){ toast("Bitte Zeitraum von und bis angeben."); break; }
          if(obj.to < obj.from){ toast("Das Ende liegt vor dem Anfang."); break; }
          if(!obj.kind) obj.kind = "schulfrei";
        }
        if(coll==="events" && (!obj.start || !obj.end)){ toast("Termine brauchen Beginn und Ende."); break; }
        if(coll==="events" && T.min(obj.end) <= T.min(obj.start)){ toast("Das Ende muss nach dem Beginn liegen."); break; }
        if(coll==="chores" && (!obj.interval || obj.interval<1)){ toast("Das Intervall muss mindestens 1 Tag sein."); break; }
        if(coll==="chores" && (!obj.pool || !obj.pool.length)){ toast("Bitte mindestens eine Person auswählen."); break; }
        if(coll==="basics" && (!obj.days || !obj.days.length)){ toast("Bitte mindestens einen Wochentag wählen."); break; }
        if(coll==="chores" && !obj.room) obj.room = "Haus";
        if(coll==="chores" && !obj.lastDone) obj.lastDone = T.addDays(S.date, -(obj.interval||1));
        if(coll==="chores" && !obj.effort) obj.effort = 1;
        if((coll==="missions"||coll==="rewards") && !obj.icon) obj.icon = "sparkle";
        Actions.upsert(coll,obj); closeModal(); toast("Gespeichert."); break; }
      case "deleteEdit": { const form=el("editForm"); Actions.remove(form.dataset.coll, form.dataset.id); closeModal(); break; }
      case "tglOpt": {                       /* Wochentage und Personenauswahl im Formular */
        const on = !node.classList.contains("soft");
        node.classList.toggle("soft", on);
        node.classList.toggle("ghost", !on);
        node.setAttribute("aria-pressed", String(on));
        return;                               /* nicht weiterreichen, Dialog bleibt offen */
      }
      case "closeModal": closeModal(); break;
      case "export": doExport(); break;
      case "importOpen": doImportOpen(); break;
      case "resetAll": if(confirm("Alle Daten löschen und neu starten?")){ Store.reset(); toast("Zurückgesetzt."); } break;
      case "logoTap":
        if(Device.isWall() && Device.logoTap()){ toast("Admin-Bereich freigegeben."); render(); }
        break;
      case "wallSet": {
        const v = node.dataset.k, on = node.dataset.on !== "1";
        if(v==="wall") Device.set({ wall:on });
        if(v==="awake") Device.set({ keepAwake:on });
        if(v==="shift") Device.set({ shift:on });
        if(v==="night") Device.set({ night:on });
        render();
        break; }
      case "wallIdle": Device.set({ idleMinutes:+node.dataset.n }); render(); break;
      case "wallRotate": Device.set({ rotate:+node.dataset.n }); render(); break;
      case "wxRefresh":
        Weather.refresh(true).then(()=>{
          const err = Weather.status();
          toast(err ? err : "Wetter aktualisiert.");
        });
        break;
      case "pwaInstall": PWA.install().then(okd=>{ if(!okd) toast("Installation abgebrochen."); render(); }); break;
      case "pwaUpdate": PWA.applyUpdate(); break;
      case "syncOpen": syncModal(); break;
      case "syncOff": if(confirm("Verbindung trennen? Die Daten bleiben auf diesem Gerät, werden aber nicht mehr abgeglichen.")){ Sync.disconnect(); render(); } break;
      case "syncNow": Sync.cycle().then(()=>toast("Abgeglichen.")); break;
      case "syncSnapshot":
        if(confirm("Der Stand dieses Geräts wird zum gültigen Familienstand. Andere Geräte übernehmen ihn beim nächsten Abgleich. Fortfahren?"))
          Sync.publishSnapshot().then(()=>{ toast("Familienstand gesetzt."); render(); })
                                .catch(err=> toast("Fehlgeschlagen: "+err.message));
        break;
      case "syncSave": {
        const next = { url:el("syUrl").value.trim(), key:el("syKey").value.trim(),
                       family:el("syFam").value.trim(), name:el("syName").value.trim()||"Gerät" };
        if(!next.url || !next.key || !next.family){ toast("Bitte URL, Key und Familienname ausfüllen."); break; }
        toast("Verbinde …");
        Sync.connect(next, ()=> Promise.resolve(confirm(
            "Auf dem Server liegt bereits ein Familienstand.\n\nOK = diesen übernehmen (lokale Daten dieses Geräts werden ersetzt).\nAbbrechen = die lokalen Daten dieses Geräts zum Familienstand machen.")))
          .then(()=>{ closeModal(); toast("Verbunden."); render(); })
          .catch(err=> toast("Verbindung fehlgeschlagen: "+err.message));
        break; }
    }

  }
  function handleChange(e){
    const node = e.target.closest("[data-a]"); if(!node) return;
    const a = node.dataset.a;
    if(a==="setS") Actions.patchSettings({[node.dataset.k]: node.value});
    else if(a==="setShop"){ const s=Object.assign({},Store.get().settings.shopping); s[node.dataset.k]= node.dataset.k==="day"? +node.value : node.value; Actions.patchSettings({shopping:s}); }
    else if(a==="setKey") Actions.patchSettings({hannahHasKey:node.checked});
    else if(a==="setWx"){
      const w = Object.assign({name:"Rödermark",lat:49.9833,lon:8.8333}, Store.get().settings.weather||{});
      w[node.dataset.k] = node.dataset.k==="name" ? node.value : parseFloat(node.value);
      Actions.patchSettings({weather:w}); Weather.refresh(true);
    }
    else if(a==="setMeta") Actions.patchMeta({[node.dataset.k]: node.value});
    else if(a==="setCoins") Actions.setCoins(node.dataset.id, +node.value);
    else if(a==="setMorning"){
      const mo = Object.assign({from:"06:30",to:"08:15",leave:"07:30"}, Store.get().settings.morning||{});
      mo[node.dataset.k] = node.value; Actions.patchSettings({morning:mo});
    }
    else if(a==="wallNight"){
      const v = normTime(node.value);
      if(!v){ toast("Uhrzeit bitte als 2130 oder 21:30 eingeben."); render(); return; }
      Device.set({ [node.dataset.k]: v }); render();
    }
    else if(a==="setMorningLeave") Actions.patchPerson(node.dataset.id, {morningLeave:node.value});
    else if(a==="setNavTheme"){ Actions.patchSettings({navTheme:node.value}); applyTheme(); }
    else if(a==="setTtMode") Actions.ttMode(node.dataset.id, node.checked);
    else if(a==="ttSet") Actions.ttSubject(node.dataset.p, node.dataset.w, +node.dataset.d, +node.dataset.n, node.value.trim());
    else if(a==="ttTime"){
      const pid = node.dataset.p, v = normTime(node.value);
      if(!v){ toast("Uhrzeit bitte als 0745 oder 7:45 eingeben."); render(); return; }
      const bl = JSON.parse(JSON.stringify(Engine.blocksOf(pid)));
      if(bl[+node.dataset.n]){ bl[+node.dataset.n][node.dataset.k] = v; Actions.ttBlocks(pid, bl); }
    }
  }
  function doExport(){
    const blob = new Blob([Store.exportJSON()], {type:"application/json"});
    const u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href=u; a.download="nestwerk-sicherung-"+T.key(new Date())+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1500); toast("Sicherung heruntergeladen.");
  }
  function doImportOpen(){
    modal("Sicherung einspielen",
      '<p class="small muted" style="margin-bottom:12px">Datei auswählen oder JSON einfügen. Die aktuellen Daten werden ersetzt.</p>'
      + '<input type="file" accept="application/json" id="impFile" class="f" style="padding:9px">'
      + '<textarea class="f" id="impText" rows="7" style="margin-top:12px" placeholder="{ ... }"></textarea>',
      '<button class="btn" id="impGo">Einspielen</button><span class="spacer"></span><button class="btn ghost" data-a="closeModal">Abbrechen</button>');
    el("impFile").addEventListener("change", ev=>{
      const f = ev.target.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = ()=>{ el("impText").value = r.result; }; r.readAsText(f);
    });
    el("impGo").addEventListener("click", ()=>{
      try{ Store.importJSON(el("impText").value); closeModal(); toast("Daten eingespielt."); }
      catch(err){ toast("Datei nicht lesbar: "+err.message); }
    });
  }

  function safely(name, fn){
    try{ fn(); }catch(e){ console.warn(name+" konnte nicht starten:", e && e.message); }
  }
  function init(){
    Store.load();
    Store.subscribe(render);
    /* Erst die Bedienung verdrahten. Scheitert danach ein Nebensystem,
       bleibt die App trotzdem benutzbar. */
    document.addEventListener("click", handle);
    document.addEventListener("change", handleChange);
    safely("Synchronisation", ()=> Sync.init());
    safely("Installation",    ()=> PWA.init());
    safely("Wetter",          ()=> { Weather.load(); Weather.refresh(); });
    safely("Wandmodus",       ()=> Device.init());
    setInterval(()=>{ if(document.visibilityState !== "hidden") Weather.refresh(); }, 20*60*1000);
    Actions.ensureDay(S.date);
    let wasNarrow = isNarrow(), rz = null;
    window.addEventListener("resize", ()=>{
      clearTimeout(rz);
      rz = setTimeout(()=>{ if(isNarrow() !== wasNarrow){ wasNarrow = isNarrow(); render(); } }, 200);
    });
    document.addEventListener("focusout", ()=>{
      setTimeout(()=>{ if(pendingBg && !isEditing()){ pendingBg = false; render(); } }, 150);
    });
    document.addEventListener("keydown", e=>{
      if((e.key==="Enter"||e.key===" ") && e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.click(); }
      if(e.key==="Escape") closeModal();
      if(e.key==="Enter" && e.target && e.target.classList && e.target.classList.contains("tt-in")){
        e.preventDefault();
        const t = e.target, next = document.querySelector(
          '[data-a="ttSet"][data-p="'+t.getAttribute("data-p")+'"][data-w="'+t.getAttribute("data-w")+'"]'
          + '[data-d="'+t.getAttribute("data-d")+'"][data-n="'+(+t.getAttribute("data-n")+1)+'"]');
        if(next && next.focus){ next.focus(); if(next.select) next.select(); }
        else t.blur();
      }
    });
    /* Tageswechsel um Mitternacht abfangen */
    /* Der Countdown läuft eigenständig weiter, ohne Neuaufbau der Seite */
    setInterval(()=>{
      if(document.visibilityState === "hidden") return;
      if(!document.querySelector || !document.querySelector("[data-mo-clock]")) return;
      if(isEditing()) return;
      render();
    }, 30000);
    /* Nur die Jetzt-Linie im Tagesband aktualisieren — nie beim Tippen neu rendern */
    setInterval(()=>{
      if(S.tab!=="today") return;
      if(el("modalRoot").innerHTML) return;
      if(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      render();
    }, 60000);
    render();
  }

  return { init, render, paintStatus, toast, coinFly, confetti, celebrate, modal, closeModal, S };
})();

document.addEventListener("DOMContentLoaded", UI.init);
</script>
</body>
</html>
