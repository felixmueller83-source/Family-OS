/* ==========================================================================
   4) ENGINE — reine Funktionen. Kein Zustand, keine Seiteneffekte.
      Hier entscheidet die App, damit niemand sonst entscheiden muss.
   ========================================================================== */
const Engine = (function(){

  /* ---- A/B-Woche ---------------------------------------------------- */
  function mondayOf(k){ return T.addDays(k, -(T.dow(k)-1)); }
  function weekType(k){
    const db = Store.get();
    const weeks = Math.floor(T.diffDays(mondayOf(k), mondayOf(db.meta.abAnchor))/7);
    const even = ((weeks % 2)+2)%2 === 0;
    return even ? db.meta.abAnchorWeek : (db.meta.abAnchorWeek==="A"?"B":"A");
  }

  /* ---- Abwesenheiten -------------------------------------------------- */
  function absencesFor(pid, k){
    return (Store.get().absences||[]).filter(a=>
      (a.person==="all" || a.person===pid) && a.from && a.to && a.from<=k && k<=a.to);
  }
  function absKind(pid, k, kind){ return absencesFor(pid,k).some(a=> a.kind===kind); }
  const isAway  = (pid,k)=> absKind(pid,k,"abwesend");
  const isSick  = (pid,k)=> absKind(pid,k,"krank");
  const isOut   = (pid,k)=> isAway(pid,k) || isSick(pid,k);          /* fällt für Planung aus */
  function isSchoolFree(pid,k){
    return absencesFor(pid,k).some(a=> a.kind==="schulfrei") || isOut(pid,k);
  }
  function hobbiesPause(pid,k){
    if(isOut(pid,k)) return true;
    return absencesFor(pid,k).some(a=> a.kind==="schulfrei" && !a.hobbies);
  }
  function absenceLabel(pid,k){
    const a = absencesFor(pid,k)[0];
    if(!a) return null;
    const t = a.kind==="krank" ? "Krank" : a.kind==="abwesend" ? "Nicht da" : "Schulfrei";
    return { text:t, note:a.title||"", kind:a.kind };
  }

  /* ---- Arbeitszeit eines Elternteils --------------------------------- */
  function workBlocks(pid, k){
    const db = Store.get(), w = db.work[pid]; if(!w) return [];
    const plan = w[T.dow(k)]; if(!plan || plan.mode==="off") return [];
    const office = plan.mode==="office";
    const start = office ? w.officeStart : w.homeStart;
    const end   = office ? w.officeEnd   : w.homeEnd;
    const main  = T.min(end)-T.min(start);
    const out = [{ start, end, title:"Arbeit ("+(office?"Büro":"Homeoffice")+")", kind:"work", home:!office }];
    const need = (w.targetDaily||0) - main;
    if(need >= 15){
      out.unshift({ start:w.earlyStart, end:T.hhmm(T.min(w.earlyStart)+need),
                    title:"Frühblock Arbeit", kind:"work", soft:true });
    }
    if(office){
      out.unshift({ start:T.hhmm(T.min(start)-(w.commute||0)), end:start, title:"Fahrt ins Büro", kind:"travel" });
      out.push({ start:end, end:T.hhmm(T.min(end)+(w.commute||0)), title:"Fahrt nach Hause", kind:"travel" });
    }
    return out;
  }
  function workSummary(pid, k){
    const db = Store.get(), w = db.work[pid]; if(!w) return null;
    const plan = w[T.dow(k)];
    if(!plan || plan.mode==="off") return { mode:"off", label:"arbeitsfrei" };
    return { mode:plan.mode, label: plan.mode==="office"?"Bürotag":"Homeoffice" };
  }
  function isHome(pid, k, minute){
    if(isOut(pid,k)) return false;
    const db = Store.get(), w = db.work[pid]; if(!w) return true;
    const plan = w[T.dow(k)];
    if(!plan || plan.mode==="off" || plan.mode==="home") return true;   // im Haus
    const end = T.min(w.officeEnd) + (w.commute||0);
    return minute >= end;
  }

  /* ---- Henrys Stundenplan -------------------------------------------- */
  function blocksOf(pid){
    const tt = (Store.get().timetables||{})[pid];
    return (tt && tt.blocks && tt.blocks.length) ? tt.blocks : Store.get().schoolBlocks;
  }
  function usesAB(pid){ const tt = (Store.get().timetables||{})[pid]; return !!(tt && tt.ab); }
  function weekOf(pid, k){ return usesAB(pid) ? weekType(k) : "A"; }
  /* Stundenplan eines Kindes an einem Tag. null = kein gepflegter Plan. */
  function school(pid, k){
    const tt = (Store.get().timetables||{})[pid], d = T.dow(k);
    if(!tt || d>5 || isSchoolFree(pid,k)) return null;
    const row = (tt[weekOf(pid,k)]||{})[d] || [];
    const bl = blocksOf(pid), subs = [];
    row.forEach((sub,i)=>{ if(sub && bl[i]) subs.push({ block:bl[i], subject:sub }); });
    if(!subs.length) return null;
    return { start:subs[0].block.start, end:subs[subs.length-1].block.end,
             subjects:subs, week:weekOf(pid,k), ab:usesAB(pid) };
  }
  function henrySchool(k){ return school("henry", k); }

  /* ---- Termine einer Person an einem Tag ------------------------------ */
  function eventsFor(pid, k){
    const db = Store.get(), d = T.dow(k), wt = weekType(k), out = [];
    const abs = absenceLabel(pid,k);
    if(isOut(pid,k))
      return [{ id:"abs", title:abs.text+(abs.note? " — "+abs.note:""), kind:"care",
                start:"08:00", end:"18:00", note:abs.note }];

    db.events.forEach(e=>{
      if(e.person!==pid) return;
      if(!e.days.includes(d)) return;
      if(e.fallbackOnly && school(pid,k)) return;          /* echter Stundenplan schlägt Platzhalter */
      if(isSchoolFree(pid,k) && (e.kind==="school" || e.kind==="care")) return;
      if(hobbiesPause(pid,k) && e.kind==="hobby") return;
      if(e.week && e.week!=="*" && e.week!==wt) return;
      if(e.id==="e_han_care"){                                   // Betreuung: Beginn = Schulende, Ende dynamisch
        const leave = hannahLeave(k);
        const sc = school("hannah",k);
        out.push(Object.assign({}, e, { start: sc? sc.end : e.start, end:leave.time, note:leave.reason, ref:e.id }));
        return;
      }
      if(e.travel && e.travel.min){
        out.push({ id:e.id+"_t", person:pid, title:travelLabel(e.travel)+" → "+e.title, kind:"travel",
                   start:T.hhmm(T.min(e.start)-e.travel.min-10), end:e.start, travelOf:e.id });
      }
      out.push(Object.assign({}, e, { ref:e.id }));
    });

    const sch = school(pid,k);
    if(sch) out.push({ id:pid+"_school", title:"Schule", kind:"school", start:sch.start, end:sch.end, subjects:sch.subjects });
    if(pid==="emma" && !isSchoolFree("emma",k)){
      const st = Store.get().settings;
      out.push({ id:"emma_pick", title:"Emma abholen", kind:"logistics", start:st.emmaPickupTarget, end:T.hhmm(T.min(st.emmaPickupTarget)+st.emmaKitaTravel) });
    }
    if(P(pid).role==="adult") workBlocks(pid,k).forEach((b,i)=> out.push(Object.assign({id:pid+"_w"+i, person:pid}, b)));

    const ev = eveningPlan(k);
    if(ev.bedtime===pid) out.push({ id:"ev_bed", title:"Emma ins Bett bringen", kind:"family", start:Store.get().settings.emmaBedStart, end:T.hhmm(T.min(Store.get().settings.emmaBedStart)+45) });
    if(ev.kitchen===pid) out.push({ id:"ev_kitchen", title:"Küchenabschluss", kind:"family", start:Store.get().settings.kitchenStart, end:T.hhmm(T.min(Store.get().settings.kitchenStart)+30) });

    drives(k).forEach(dr=>{ if(dr.driver===pid) out.push({ id:"drv_"+dr.id, title:"Fahrdienst: "+dr.who+" → "+dr.title, kind:"logistics", start:dr.leave, end:dr.start }); });

    return out.sort((a,b)=> T.min(a.start)-T.min(b.start));
  }
  function travelLabel(t){ return t.mode==="car"?"Auto": t.mode==="bike"?"Fahrrad": t.mode==="scooter"?"Roller":"Zu Fuß"; }

  /* ---- Wann geht Hannah aus der Betreuung? ---------------------------- */
  function hannahLeave(k){
    const db = Store.get(), st = db.settings, d = T.dow(k);
    const early = T.min(st.hannahCareEarliest), latest = T.min(st.hannahCareLatest);
    const hobby = db.events.find(e=> e.person==="hannah" && e.kind==="hobby" && e.days.includes(d));
    if(hobby && hobby.travel){
      const need = T.min(hobby.start) - hobby.travel.min - 10;      /* 10 Min Umziehen/Puffer */
      if(need < latest){
        return { time:T.hhmm(clamp(need, early, latest)),
                 reason:"Los um "+T.hhmm(need)+" — "+travelLabel(hobby.travel)+" "+hobby.travel.min+" Min, damit du um "+hobby.start+" beim "+hobby.title+" bist." };
      }
    }
    if(!st.hannahHasKey){
      const adultHome = ["mama","papa"].some(a=> isHome(a,k,early));
      if(adultHome) return { time:st.hannahCareEarliest, reason:"Du darfst schon um "+st.hannahCareEarliest+" — zu Hause ist jemand da." };
      const homeAt = ["mama","papa"].map(a=>{
        const w = Store.get().work[a], plan = w[d];
        if(!plan || plan.mode!=="office") return early;
        return T.min(w.officeEnd)+(w.commute||0);
      }).sort((x,y)=>x-y)[0];
      return { time:T.hhmm(clamp(homeAt, early, latest)),
               reason:"Ohne eigenen Schlüssel: erst los, wenn jemand zu Hause ist (ca. "+T.hhmm(homeAt)+")." };
    }
    return { time:st.hannahCareLatest, reason:"Kein Termin heute — Betreuung bis "+st.hannahCareLatest+"." };
  }

  /* ---- Fahrdienste (Auto, Kinder) ------------------------------------- */
  function drives(k){
    const db = Store.get(), d = T.dow(k), out = [];
    const seen = {};
    if(d<=5 && !isSchoolFree("emma",k)){              /* Kita-Abholung ist auch ein Fahrdienst */
      const st = db.settings;
      const leave = T.hhmm(T.min(st.emmaPickupTarget) - st.emmaKitaTravel);
      out.push({ id:"emma_pickup", title:"Kita", who:"Emma", leave, start:st.emmaPickupTarget,
                 driver: pickDriver(k, T.min(leave), T.min(st.emmaPickupTarget)+st.emmaKitaTravel),
                 note:"spätestens "+st.emmaPickupLatest });
    }
    db.events.forEach(e=>{
      if(!e.days.includes(d) || !e.travel || e.travel.mode!=="car") return;
      const per = P(e.person); if(per.role!=="child") return;
      if(hobbiesPause(e.person,k)) return;
      const sig = e.title+"|"+e.start;
      if(seen[sig]){ seen[sig].who += " & " + per.name; return; }
      const leave = T.hhmm(T.min(e.start)-e.travel.min-10);
      const driver = pickDriver(k, T.min(leave), T.min(e.start));
      const rec = { id:e.id, title:e.title, who:per.name, leave, start:e.start, driver };
      seen[sig] = rec; out.push(rec);
    });
    return out;
  }
  function pickDriver(k, from, to){
    const cand = ["mama","papa"].filter(a=>{
      if(isOut(a,k)) return false;
      const busy = rawEvents(a,k).some(e=> T.min(e.start) < to && T.min(e.end) > from);
      const working = workBlocks(a,k).some(b=> !b.soft && !b.home && T.min(b.start) < to && T.min(b.end) > from);
      return !busy && !working;
    });
    if(cand.length) return cand[(T.diffDays(k, Store.get().meta.abAnchor)%cand.length+cand.length)%cand.length];
    return "mama";
  }
  function rawEvents(pid,k){
    const db=Store.get(), d=T.dow(k), wt=weekType(k);
    return db.events.filter(e=> e.person===pid && e.days.includes(d) && (!e.week || e.week==="*" || e.week===wt));
  }

  /* ---- Abendlogik: wer bringt Emma ins Bett, wer macht die Küche? ------ */
  /* Die Woche wird als Kette gerechnet: nach einem sporterzwungenen Tausch
     verschiebt sich die Reihenfolge, damit sie sich wieder ausgleicht.       */
  function eveningWeek(k){
    const db = Store.get(), st = db.settings;
    const bedA = T.min(st.emmaBedStart), bedB = bedA+45;
    const kitA = T.min(st.kitchenStart),  kitB = kitA+30;
    const mon = mondayOf(k);
    const weekIdx = Math.floor(T.diffDays(mon, mondayOf(db.meta.abAnchor))/7);
    let prev = ((((weekIdx%2)+2)%2)===0) ? "papa" : "mama";     /* wer die Vorwoche beendet hat */
    const out = {};
    for(let i=0;i<7;i++){
      const d = T.addDays(mon,i);
      const busy = (pid,a,b)=> isOut(pid,d) || rawEvents(pid,d).some(e=> (e.blocksEvening || e.kind==="sport" || e.kind==="family") && T.min(e.start)<b && T.min(e.end)>a);
      let bed = prev==="mama" ? "papa" : "mama";
      let other = bed==="mama" ? "papa" : "mama";
      let reason = "Regulärer Wechsel — heute ist "+P(bed).name+" dran.";
      let conflict = false;
      /* Wer gar nicht da ist, kann nichts übernehmen — das schlägt alles andere. */
      if(isOut(bed,d) && !isOut(other,d)){
        const ab = absenceLabel(bed,d);
        reason = P(bed).name+" ist heute nicht da"+(ab&&ab.note? " ("+ab.note+")":"")+" — "+P(other).name+" übernimmt.";
        const t=bed; bed=other; other=t;
      } else if(isOut(bed,d) && isOut(other,d)){
        conflict = true;
        reason = "Heute ist keiner von euch beiden da. Das muss jemand anders übernehmen.";
      } else if(busy(bed,bedA,bedB) && busy(other,bedA,bedB)){
        const why = p => { const ab=absenceLabel(p,d); if(ab && ab.kind!=="schulfrei") return ab.text.toLowerCase();
          const e = rawEvents(p,d).find(x=> T.min(x.start)<bedB && T.min(x.end)>bedA); return e? e.title : "verplant"; };
        conflict = true;
        reason = "Beide verplant — "+P(bed).name+": "+why(bed)+", "+P(other).name+": "+why(other)+". Das müsst ihr heute von Hand klären.";
      }
      if(busy(bed,bedA,bedB) && !busy(other,bedA,bedB)){
        const conf = rawEvents(bed,d).find(e=> T.min(e.start)<bedB && T.min(e.end)>bedA);
        const ab = absenceLabel(bed,d);
        reason = isOut(bed,d)
          ? P(bed).name+" ist heute nicht da"+(ab&&ab.note? " ("+ab.note+")":"")+" — "+P(other).name+" übernimmt."
          : P(bed).name+" hat "+(conf? conf.title+" um "+conf.start : "einen Termin")+" — deshalb übernimmt "+P(other).name+" und ist morgen dafür dran.";
        const t=bed; bed=other; other=t;
      }
      if(Store.dayRead(d).eveningSwap){ const t=bed; bed=other; other=t; reason = "Von Hand getauscht."; }
      let kitchen = other, both = false, kitchenReason = P(other).name+" macht dafür den Küchenabschluss.";
      if(busy(other,kitA,kitB)){
        const conf = rawEvents(other,d).find(e=> T.min(e.start)<kitB && T.min(e.end)>kitA);
        kitchen = bed; both = true;
        kitchenReason = P(other).name+" ist wegen "+(conf?conf.title:"einem Termin")+" raus — "+P(bed).name+" übernimmt heute beides.";
      }
      out[d] = { bedtime:bed, kitchen, both, conflict, reason, kitchenReason, bedTime:st.emmaBedStart, kitchenTime:st.kitchenStart };
      prev = bed;
    }
    return out;
  }
  function eveningPlan(k){ return eveningWeek(k)[k]; }


  /* ---- Haushaltsgedächtnis -------------------------------------------- */
  function choreStatus(c, k){
    const next = T.addDays(c.lastDone || T.addDays(k,-c.interval), c.interval);
    const days = T.diffDays(next, k);
    return { next, days, state: days<0?"over": days===0?"today": days<=2?"soon":"ok" };
  }
  /* Zustand einer Aufgabe: 100 % direkt nach dem Erledigen, danach fallend.
     Aufgaben mit festem Wochentag sind Termine und haben keinen Zustand.    */
  const COND_MIN = { 1:10, 2:20, 3:35 };
  function minutesOf(c){ return c.minutes || COND_MIN[c.effort||1] || 15; }
  function condition(c, k){
    const iv = Math.max(1, c.interval||7);
    const since = c.lastDone ? T.diffDays(k, c.lastDone) : iv;
    const raw = 100 - (since/iv)*100;                 /* darf negativ werden: für die Reihenfolge */
    const pct = clamp(Math.round(raw), 0, 100);
    let label = "frisch";
    if(pct < 80) label = "gut";
    if(pct < 55) label = "wird Zeit";
    if(pct < 30) label = "bald dringend";
    if(pct <= 5) label = "jetzt dran";
    return { pct, raw, since, iv, label, minutes:minutesOf(c), fixed:!!c.fixedDay };
  }
  function stateChores(){ return Store.get().chores.filter(c=> !c.fixedDay && (c.interval||7) > 2); }
  function routineChores(){ return Store.get().chores.filter(c=> !c.fixedDay && (c.interval||7) <= 2); }
  function dateChores(){ return Store.get().chores.filter(c=> !!c.fixedDay); }
  /* Gesamtzustand des Haushalts, gewichtet nach Aufwand */
  function houseHealth(k){
    const list = stateChores();
    if(!list.length) return 100;
    let sum = 0, w = 0;
    list.forEach(c=>{ const e = c.effort||1; sum += condition(c,k).pct * e; w += e; });
    return Math.round(sum/w);
  }
  /* "Ich habe X Minuten" — was bringt jetzt am meisten? */
  function suggest(k, budget, pid){
    const day = Store.dayRead(k);
    let list = stateChores()
      .filter(c=> !day.chores[c.id])
      .filter(c=> !pid || (c.pool||[]).includes(pid))
      .map(c=> ({ c, cond:condition(c,k) }))
      .sort((a,b)=> a.cond.raw - b.cond.raw);
    const out = []; let left = budget;
    list.forEach(x=>{ if(x.cond.minutes <= left){ out.push(x); left -= x.cond.minutes; } });
    return { picks:out, rest:left };
  }
  function choresDue(k){
    const db = Store.get(), d = T.dow(k), day = Store.dayRead(k);
    return db.chores.filter(c=>{
      if(day.chores[c.id]) return true;          /* heute abgehakt: bleibt sichtbar */
      const st = choreStatus(c,k);
      if(c.fixedDay) return c.fixedDay===d && st.days<=0;
      return st.days<=0;
    }).sort((a,b)=> choreStatus(a,k).days - choreStatus(b,k).days);
  }
  /* Verfügbare Minuten im Haushaltsfenster 15:00–20:30 */
  function freeMinutes(pid, k){
    if(isOut(pid,k)) return 0;
    const A=T.min("15:00"), B=T.min("20:30");
    let busy = 0;
    rawEvents(pid,k).concat(workBlocks(pid,k)).forEach(e=>{
      const a=Math.max(A,T.min(e.start)), b=Math.min(B,T.min(e.end));
      if(b>a) busy += (b-a);
    });
    const per = P(pid);
    if(per.role==="child"){                       /* Schule/Betreuung zählt als Belastung */
      if(school(pid,k)) busy += 20;
      if(per.age<=4) busy += 120;
    }
    return Math.max(0, (B-A) - busy);
  }
  /* Faire Verteilung: Verfügbarkeit − bisherige Last − heutige Last */
  function computeAssignments(k){
    const db = Store.get(), due = choresDue(k), assign = {}, todayLoad = {};
    db.people.forEach(p=> todayLoad[p.id]=0);
    const dayIdx = T.diffDays(k, db.meta.abAnchor);

    due.forEach(c=>{
      if(c.everyone){ assign[c.id]="*"; return; }
      let pool = (c.pool||[]).filter(pid=>{
        const p = P(pid); return p && !isOut(pid,k) && canDo(pid, c);
      });
      if(!pool.length){ assign[c.id] = null; return; }   /* niemand freigeschaltet — nicht heimlich an Mama */
      if(c.rotate){
        const order = pool.slice().sort();
        for(let i=0;i<order.length;i++){
          const cand = order[(((dayIdx+i)%order.length)+order.length)%order.length];
          if(freeMinutes(cand,k) > 45){ assign[c.id]=cand; todayLoad[cand]+=c.effort; return; }
        }
        assign[c.id]=order[0]; todayLoad[order[0]]+=c.effort; return;
      }
      let best=null, bestScore=-1e9;
      pool.forEach(pid=>{
        const hist = db.state.choreHistory[pid]||0;
        const score = freeMinutes(pid,k)/30 - hist*0.9 - todayLoad[pid]*2.2 - (P(pid).role==="adult"?0:0.4)
                    - (pid==="mama"?1.2:0);        /* Gegengewicht: Mama nicht als Standard */
        if(score>bestScore){ bestScore=score; best=pid; }
      });
      assign[c.id]=best; todayLoad[best]+= c.effort;
    });
    return assign;
  }
  function assignmentsFor(k){
    const day = Store.dayRead(k);
    const due = choresDue(k);
    const missing = due.some(c=> !day.assign || !day.assign[c.id]);
    if(missing) return computeAssignments(k);
    return day.assign;
  }
  function choresForPerson(pid, k){
    const a = assignmentsFor(k);
    return choresDue(k).filter(c=> a[c.id]===pid || (a[c.id]==="*" && (c.pool||[]).includes(pid)));
  }

  /* ---- Morgenablauf ---------------------------------------------------- */
  function morningLeave(pid){
    const p = P(pid);
    return p.morningLeave || (Store.get().settings.morning||{}).leave || "07:30";
  }
  function morningSteps(pid){
    return (Store.get().morningSteps||[]).filter(x=> x.person==="all" || x.person===pid)
      .slice().sort((a,b)=> T.min(a.by)-T.min(b.by));
  }
  /* Zeigt der Morgenbildschirm heute überhaupt etwas an? */
  function morningRelevant(pid, k){
    const p = P(pid);
    if(p.role !== "child") return false;
    if(T.dow(k) > 5) return false;
    if(isOut(pid,k) || isSchoolFree(pid,k)) return false;
    return true;
  }
  function morningState(pid, k, nowMin){
    const cfg = Store.get().settings.morning || {};
    const day = Store.dayRead(k);
    const done = (day.morning||{})[pid] || {};
    const leave = morningLeave(pid);
    const now = (nowMin==null) ? T.nowMin() : nowMin;
    /* Wird eine Uhrzeit übergeben, wird so gerechnet, als wäre es gerade diese. */
    const live = (k === T.key(new Date())) || nowMin != null;
    const steps = morningSteps(pid).map(st=>{
      const isDone = !!done[st.id];
      const left = T.min(st.by) - now;
      return { st, done:isDone, left,
               late: live && !isDone && left < 0,
               soon: live && !isDone && left >= 0 && left <= 5 };
    });
    const openCount = steps.filter(x=>!x.done).length;
    const toLeave = T.min(leave) - now;
    const from = T.min(cfg.from || "06:30"), to = T.min(cfg.to || "08:15");
    return {
      relevant: morningRelevant(pid,k),
      live, active: live && now >= from - 30 && now <= to,
      leave, toLeave, now, from, to,
      steps, openCount, allDone: openCount === 0,
      pct: steps.length ? Math.round((steps.length-openCount)/steps.length*100) : 100,
      /* Fortschritt der Zeit zwischen Aufstehen und Türschluss */
      timePct: clamp(Math.round((now - from) / Math.max(1, T.min(leave) - from) * 100), 0, 100)
    };
  }
  /* Was heute zusätzlich mit muss */
  function morningPacking(pid, k){
    const preps = [];
    rawEvents(pid,k).forEach(e=>{ if(e.prep) preps.push(e.prep); });
    const out = preps.slice();
    (Store.get().basics||[]).forEach(b=>{
      if(b.person!==pid || !b.morning || !(b.days||[]).includes(T.dow(k))) return;
      const dop = preps.some(pr=> b.title.toLowerCase().indexOf(pr.toLowerCase().slice(0,6)) >= 0);
      if(!dop) out.push(b.title);                      /* keine Dopplung zum Termin-Vermerk */
    });
    return [...new Set(out)];
  }

  /* ---- Befähigungen ---------------------------------------------------- */
  function caps(){ return Store.get().capabilities || []; }
  function capById(id){ return caps().find(c=>c.id===id) || null; }
  function hasCap(pid, capId){
    const p = P(pid);
    if(!capId) return true;
    if(p.role === "adult") return true;
    return (p.skills||[]).includes(capId);
  }
  /* Darf diese Person diese Aufgabe übernehmen? */
  function canDo(pid, item){
    const p = P(pid);
    if(item && item.cap){
      const c = capById(item.cap);
      if(c && p.role==="child" && p.age < (c.minAge||0)) return false;
      return hasCap(pid, item.cap);
    }
    return p.age >= ((item && item.minAge) || 0);
  }
  function capCount(pid, capId){
    const m = (Store.get().state.capCount||{})[pid] || {};
    return m[capId] || 0;
  }
  /* Fortschritt zur nächsten Stufe: Wie oft wurden die Vorstufen schon gemacht? */
  function capProgress(pid, cap){
    const need = cap.reps || 0;
    if(!need) return { have:0, need:0, ready:true };
    const have = (cap.needs||[]).reduce((n,x)=> n + capCount(pid,x), 0);
    return { have:Math.min(have,need), need, ready: have >= need };
  }
  /* Stufen, die als Nächstes drankommen können */
  function nextCaps(pid){
    const p = P(pid);
    return caps()
      .filter(c=> !hasCap(pid,c.id))
      .filter(c=> (c.needs||[]).every(n=> hasCap(pid,n)))
      .map(c=> ({ cap:c, prog:capProgress(pid,c), tooYoung: p.age < (c.minAge||0) }))
      .sort((a,b)=> (b.prog.ready?1:0)-(a.prog.ready?1:0) || (a.cap.minAge||0)-(b.cap.minAge||0));
  }
  function unlockedCaps(pid){ return caps().filter(c=> hasCap(pid,c.id)); }
  function readyCaps(pid){ return nextCaps(pid).filter(x=> x.prog.ready && !x.tooYoung); }

  /* ---- Daily Basics ---------------------------------------------------- */
  function basicsFor(pid, k){
    const d = T.dow(k);
    if(isOut(pid,k)) return [];
    return Store.get().basics.filter(b=> b.person===pid && (b.days||[]).includes(d));
  }

  /* ---- Medienzeit ------------------------------------------------------ */
  function media(pid, k){
    const per = P(pid), day = Store.dayRead(k);
    const budget = per.media||0;
    const entries = day.media[pid] || [];
    const used = entries.reduce((s,e)=> s+e.min, 0);
    const gates = basicsFor(pid,k).filter(b=> b.unlocksMedia);
    const open  = gates.filter(b=> !day.basics[b.id]);
    return { budget, used, remaining:Math.max(0,budget-used), entries,
             unlocked: open.length===0, gates, open };
  }

  /* ---- Missionen -------------------------------------------------------- */
  function openMissions(){ return Store.get().missions.filter(m=> m.status==="open"); }
  function missionsOf(pid){ return Store.get().missions.filter(m=> m.by===pid && m.status!=="open"); }

  /* ---- Tagesüberblick --------------------------------------------------- */
  function dayStats(pid, k){
    const day = Store.dayRead(k);
    const b = basicsFor(pid,k), c = choresForPerson(pid,k), all = missionsOf(pid);
    const mOpen = all.filter(x=>x.status==="claimed");
    const mDone = all.filter(x=>x.status==="done" && x.doneAt===k);
    const total = b.length + c.length + mOpen.length + mDone.length;
    const done  = b.filter(x=>day.basics[x.id]).length + c.filter(x=>day.chores[x.id]).length + mDone.length;
    return { total, done, open:Math.max(0,total-done), basics:b, chores:c, missions:mOpen };
  }
  function firstEventTime(pid,k){ const e = eventsFor(pid,k); return e.length? e[0].start : null; }

  /* ---- Hinweise für Heute ------------------------------------------------ */
  function highlights(k){
    const db=Store.get(), d=T.dow(k), out=[];
    if(d===db.settings.weekResetDay)
      out.push({ icon:"broom", title:"Freitags-Reset heute Abend", text:"10 Minuten alle gemeinsam — damit Freitag geputzt statt aufgeräumt wird." });
    const coach = db.chores.find(c=>c.id==="c_coach");
    if(coach && choreStatus(coach,k).days<=2 && d<=4)
      out.push({ icon:"sparkle", title:"U8-Rugby vorbereiten", text:"Freitag 16:30 leitet ihr das Training. Übungen und Material jetzt planen, nicht Freitagmittag." });
    if(d===2)
      out.push({ icon:"sportbag", title:"Hannah: Tanzsachen morgens einpacken", text:"Wenn sie nach der Betreuung direkt weiterzieht, muss die Tasche früh dabei sein." });
    if(d===4)
      out.push({ icon:"bike", title:"Hannah fährt früher los", text:"Reiten um 15:00, 15 Minuten Fahrrad — Betreuung schon um "+hannahLeave(k).time+" verlassen." });
    db.people.forEach(p=>{
      const ab = absenceLabel(p.id,k);
      if(ab) out.push({ icon:"map", title:p.name+": "+ab.text+(ab.note? " — "+ab.note : ""),
        text: ab.kind==="schulfrei"
          ? "Keine Schule oder Kita. Termine und Betreuung sind für heute ausgeblendet."
          : "Aus der Tagesplanung genommen: keine Aufgaben, keine Fahrdienste, nicht für den Abenddienst eingeteilt." });
    });
    const wx = (typeof Weather!=="undefined") ? Weather.forDate(k) : null;
    if(wx){
      const outdoor = [...new Set(db.events.filter(e=> e.days.includes(d) && e.kind==="hobby" && e.travel).map(e=>e.title))];
      if(wx.max >= 30 && outdoor.length)
        out.push({ icon:"sportbag", title:"Hitze: "+wx.max+" Grad", text:"Heute draußen "+outdoor.join(", ")+". Große Trinkflaschen, Sonnencreme und Kappe einpacken." });
      else if(wx.max >= 30)
        out.push({ icon:"soap", title:"Hitze: "+wx.max+" Grad", text:"Viel trinken, Rollos zu, anstrengende Haushaltsaufgaben auf den Abend legen." });
      if(wx.rain!=null && wx.rain >= 60)
        out.push({ icon:"laundry", title:"Regen wahrscheinlich ("+wx.rain+" %)", text:"Regenjacken bereitlegen. Wäsche heute lieber drinnen trocknen." });
      if(wx.min <= 3)
        out.push({ icon:"towel", title:"Kalt: nur "+wx.min+" Grad", text:"Mütze und Handschuhe an die Garderobe legen." });
    }
    const shop = db.chores.find(c=>c.id==="c_shop");
    if(shop && choreStatus(shop,k).days<=0)
      out.push({ icon:"box", title:"Wocheneinkauf ist dran", text:"Vorgeschlagener Slot: "+["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"][db.settings.shopping.day-1]+" ab "+db.settings.shopping.start+"." });
    if(!db.settings.hannahHasKey)
      out.push({ icon:"lock", title:"Hannah hat noch keinen Schlüssel", text:"Die Planung schickt sie nur nach Hause, wenn jemand da ist. Im Admin umstellbar, sobald der Schlüssel da ist." });
    return out;
  }

  return { morningState, morningSteps, morningLeave, morningRelevant, morningPacking, caps, capById, hasCap, canDo, capCount, capProgress, nextCaps, unlockedCaps, readyCaps, absencesFor, absenceLabel, isAway, isSick, isOut, isSchoolFree, condition, minutesOf, stateChores, routineChores, dateChores, houseHealth, suggest, weekType, mondayOf, workBlocks, workSummary, isHome, henrySchool, school, blocksOf, usesAB, weekOf, eventsFor, rawEvents,
           hannahLeave, drives, eveningPlan, choreStatus, choresDue, computeAssignments,
           assignmentsFor, choresForPerson, basicsFor, media, openMissions, missionsOf,
           dayStats, highlights, freeMinutes, travelLabel, firstEventTime };
})();

/* ==========================================================================
   6) ACTIONS — bauen Aktionen und geben sie an den Store.
      Kein direkter Zugriff auf den Datenstand mehr: alles läuft über Ops,
      damit dieselbe Änderung auf jedem Gerät identisch nachvollzogen wird.
   ========================================================================== */
const Actions = (function(){
  const D = p => Store.dispatch(p);
  const fmt = k => T.dayShort(k)+", "+T.parse(k).getDate()+"."+(T.parse(k).getMonth()+1)+".";

  function ensureDay(k){
    const day = Store.dayRead(k);
    const due = Engine.choresDue(k);
    const missing = due.some(c=> !day.assign || !day.assign[c.id]);
    if(!missing) return;
    D({ kind:"assign.set", date:k, map: Engine.computeAssignments(k) });
  }

  function toggleBasic(id, k){
    const value = !Store.dayRead(k).basics[id];
    D({ kind:"basic.set", id, date:k, value });
    const b = Store.get().basics.find(x=>x.id===id);
    if(b && value){
      const m = Engine.media(b.person,k);
      if(b.unlocksMedia && m.unlocked) UI.toast("Medienzeit freigeschaltet für "+P(b.person).name+".", "gold");
    }
  }

  function toggleChore(id, k){
    const value = !Store.dayRead(k).chores[id];
    const who = (Store.dayRead(k).assign||{})[id] || Engine.assignmentsFor(k)[id];
    D({ kind:"chore.set", id, date:k, value, who });
    if(value){
      const c = Store.get().chores.find(x=>x.id===id);
      if(c) UI.toast(c.title+" erledigt — wieder fällig am "+fmt(Engine.choreStatus(c,k).next)+".");
    }
  }

  function claimMission(id, pid){
    D({ kind:"mission.claim", id, by:pid, date:T.key(new Date()) });
    UI.toast("Übernommen. Liegt jetzt offen in deinem Plan — Haken setzt du erst, wenn sie fertig ist.");
  }
  function returnMission(id){
    D({ kind:"mission.return", id });
    UI.toast("Zurückgegeben. Sie steht wieder in der Jobbörse.");
  }
  function completeMission(id, k, ev){
    const m0 = Store.get().missions.find(x=>x.id===id);
    if(!m0 || m0.status!=="claimed") return;
    D({ kind:"mission.done", id, date:k });
    UI.coinFly(ev, m0.coins);
    UI.toast("+"+m0.coins+" Coins für "+P(m0.by).name+".", "gold");
    UI.celebrate();
  }
  function undoMission(id){ D({ kind:"mission.undo", id }); }

  function redeem(rid, pid, ev){
    const db = Store.get(), r = db.rewards.find(x=>x.id===rid);
    if(!r || (db.state.coins[pid]||0) < r.cost){ UI.toast("Dafür fehlen noch Coins."); return; }
    D({ kind:"reward.redeem", rid, pid, rdId:uid("rd"), date:T.key(new Date()) });
    UI.toast(r.title+" eingelöst — "+r.cost+" Coins abgezogen.", "gold");
    UI.celebrate();
  }
  function markRedemptionUsed(id){
    const r = Store.get().state.redemptions.find(x=>x.id===id);
    D({ kind:"redemption.used", id, value: r? !r.used : true });
  }

  function logMedia(pid, minutes, k){
    const m = Engine.media(pid,k);
    if(!m.unlocked){ UI.toast("Erst die Basics erledigen, dann geht's los."); return; }
    const use = Math.min(minutes, m.remaining);
    if(use<=0){ UI.toast("Für heute ist das Budget aufgebraucht."); return; }
    D({ kind:"media.add", pid, date:k, min:use, at:T.hhmm(T.nowMin()), entryId:uid("me") });
    const after = Engine.media(pid,k);
    UI.toast(use+" Minuten eingetragen — "+after.remaining+" Minuten bleiben für später.");
  }
  function undoMedia(pid, entryId, k){ D({ kind:"media.remove", pid, date:k, entryId:String(entryId) }); }

  function swapEvening(k){
    D({ kind:"evening.swap", date:k, value: !Store.dayRead(k).eveningSwap });
    UI.toast("Abendplanung getauscht.");
  }

  /* ---- Admin ---- */
  function upsert(coll, obj){ D({ kind:"coll.upsert", coll, obj }); }
  function remove(coll, id){ D({ kind:"coll.remove", coll, id }); }
  function patchPerson(id, patch){ D({ kind:"coll.upsert", coll:"people", obj: Object.assign({id}, patch) }); }
  function patchSettings(patch){ D({ kind:"settings.patch", patch }); }
  function patchMeta(patch){ D({ kind:"meta.patch", patch }); }
  function patchChoreDate(id, dateKey){ D({ kind:"coll.upsert", coll:"chores", obj:{ id, lastDone:dateKey } }); }
  function ttSubject(pid, week, day, idx, value){ D({ kind:"tt.subject", pid, week, day, idx, value }); }
  function ttBlocks(pid, blocks){ D({ kind:"tt.blocks", pid, blocks }); }
  function ttMode(pid, ab){ D({ kind:"tt.mode", pid, ab }); }
  function morningStep(pid, id, value, date){ D({ kind:"morning.set", pid, id, value:!!value, date }); }
  function capSet(pid, cap, on){ D({ kind:"cap.set", pid, cap, on:!!on }); }
  function setCoins(pid, n){ D({ kind:"coins.set", pid, n }); }

  return { ensureDay, toggleBasic, toggleChore, claimMission, returnMission, completeMission, undoMission,
           redeem, markRedemptionUsed, logMedia, undoMedia, swapEvening,
           morningStep, capSet, ttSubject, ttBlocks, ttMode, upsert, remove, patchPerson, patchSettings, patchMeta, patchChoreDate, setCoins };
})();

/* ==========================================================================
   7) SYNC — gemeinsamer Familienstand über Supabase (reines REST, kein SDK).
      Übertragen werden nur Aktionen, nie der ganze Datenstand. Deshalb
      überschreibt niemand die Eingabe eines anderen.
   ========================================================================== */
const Sync = (function(){
  const CKEY = "nestwerk.sync.config";
  let cfg = null, timer = null, busy = false, nudged = false;
  let status = "off", detail = "";                 /* off | ok | busy | error */

  function loadCfg(){
    try{ cfg = JSON.parse(localStorage.getItem(CKEY)) || null; }catch(e){ cfg = null; }
    if(cfg && !cfg.device){ cfg.device = uid("dev"); saveCfg(); }
    return cfg;
  }
  function saveCfg(){ if(cfg) localStorage.setItem(CKEY, JSON.stringify(cfg)); else localStorage.removeItem(CKEY); }
  function config(){ return cfg; }
  function configured(){ return !!(cfg && cfg.url && cfg.key && cfg.family); }
  function actorName(){ return (cfg && cfg.name) ? cfg.name : "lokal"; }
  function state(){ return { status, detail, configured:configured(), pending:Store.pending().length, seq:Store.seq() }; }

  const endpoint = ()=> String(cfg.url).replace(/\/+$/,"") + "/rest/v1/family_ops";
  function headers(extra){
    /* Alte anon-Keys sind JWTs und gehören zusätzlich in den Authorization-Header.
       Neue publishable Keys (sb_publishable_…) sind keine JWTs und werden dort
       abgelehnt — für sie reicht der apikey-Header. */
    const h = { "apikey": cfg.key, "Content-Type":"application/json" };
    if(/^eyJ/.test(String(cfg.key))) h["Authorization"] = "Bearer "+cfg.key;
    return Object.assign(h, extra||{});
  }
  async function req(url, opts){
    const res = await fetch(url, opts);
    if(!res.ok){
      let msg = res.status+" "+res.statusText;
      try{ const j = await res.json(); if(j && j.message) msg = j.message; }catch(e){}
      throw new Error(msg);
    }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : [];
  }
  function setStatus(s, d){
    status = s; detail = d||"";
    /* Nur die Anzeige oben auffrischen — ein kompletter Neuaufbau alle sechs
       Sekunden würde Scrollposition und Eingaben zerstören. */
    if(typeof UI !== "undefined" && UI.paintStatus) UI.paintStatus();
  }

  /* --- hochladen --- */
  async function push(){
    const q = Store.pending();
    if(!q.length) return;
    const rows = q.map(op=>({ family: cfg.family, op_id: op.opId, kind: op.kind, actor: op.actor||"", payload: op }));
    await req(endpoint()+"?on_conflict=op_id", {
      method:"POST",
      headers: headers({ "Prefer":"resolution=ignore-duplicates,return=minimal" }),
      body: JSON.stringify(rows)
    });
    Store.clearPending(q.map(o=>o.opId));
    Store.save();
  }
  /* --- herunterladen --- */
  async function pull(){
    const url = endpoint()+"?family=eq."+encodeURIComponent(cfg.family)
              + "&seq=gt."+Store.seq()+"&select=seq,op_id,kind,payload&order=seq.asc&limit=800";
    const rows = await req(url, { headers: headers() });
    if(!rows.length) return 0;
    let changed = 0;
    rows.forEach(r=>{
      if(r.kind === "bootstrap"){
        if(r.seq > Store.bootSeq()){
          Store.replaceDB(r.payload.db);
          Store.setBootSeq(r.seq);
          changed++;
        }
      }else if(Store.applyRemote(r.payload)) changed++;
      Store.setSeq(r.seq);
    });
    Store.save();
    if(changed) Store.notify("bg");
    return changed;
  }
  async function cycle(){
    if(!configured() || busy) return;
    busy = true; setStatus("busy");
    try{ await push(); await pull(); setStatus("ok"); }
    catch(e){ console.warn("Sync:", e); setStatus("error", e.message); }
    finally{ busy = false; }
  }
  function nudge(){
    if(!configured() || nudged) return;
    nudged = true;
    setTimeout(()=>{ nudged = false; cycle(); }, 400);       /* mehrere Klicks zusammenfassen */
  }
  function startTimer(){
    if(timer) clearInterval(timer);
    if(!configured()) return;
    timer = setInterval(()=>{ if(document.visibilityState !== "hidden") cycle(); }, 6000);
  }

  /* --- Erstverbindung --- */
  async function bootstrapRemote(){
    const url = endpoint()+"?family=eq."+encodeURIComponent(cfg.family)
              + "&kind=eq.bootstrap&select=seq,payload&order=seq.desc&limit=1";
    const rows = await req(url, { headers: headers() });
    return rows[0] || null;
  }
  async function publishSnapshot(){
    const op = { opId: uid("boot"), ts: Date.now(), kind:"bootstrap", actor: actorName(), db: JSON.parse(Store.exportJSON()) };
    await req(endpoint(), {
      method:"POST",
      headers: headers({ "Prefer":"return=representation" }),
      body: JSON.stringify([{ family: cfg.family, op_id: op.opId, kind:"bootstrap", actor: op.actor, payload: op }])
    }).then(rows=>{
      const seq = rows && rows[0] ? rows[0].seq : 0;
      Store.setBootSeq(seq); Store.setSeq(seq);
    });
    Store.clearPending(Store.pending().map(o=>o.opId));   /* im Schnappschuss bereits enthalten */
    Store.save();
  }
  async function connect(next, onQuestion){
    cfg = Object.assign({ device: uid("dev") }, next);
    saveCfg();
    setStatus("busy");
    try{
      const boot = await bootstrapRemote();
      if(!boot){
        await publishSnapshot();
      }else if(boot.seq !== Store.bootSeq()){
        const takeRemote = await onQuestion();
        if(takeRemote){
          Store.replaceDB(boot.payload.db);
          Store.setBootSeq(boot.seq); Store.setSeq(boot.seq);
          Store.clearPending(Store.pending().map(o=>o.opId));
          Store.save();
        }else{
          await publishSnapshot();
        }
      }
      await pull();
      setStatus("ok");
      startTimer();
      return true;
    }catch(e){
      setStatus("error", e.message);
      throw e;
    }
  }
  function disconnect(){ cfg = null; saveCfg(); if(timer) clearInterval(timer); timer=null; setStatus("off"); }

  function init(){
    loadCfg();
    if(configured()){ setStatus("busy"); cycle(); startTimer();
      document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") cycle(); });
    }
  }
  return { init, connect, disconnect, cycle, nudge, config, configured, actorName, state, publishSnapshot };
})();


/* ==========================================================================
   5b) WETTER — Open-Meteo, ohne Schlüssel, mit lokalem Zwischenspeicher.
       Fällt die Verbindung aus, bleibt der letzte bekannte Stand sichtbar.
   ========================================================================== */
const Weather = (function(){
  const KEY = "nestwerk.weather.v1";
  const TTL = 30*60*1000;
  let data = null, busy = false, tries = 0;

  function place(){
    const w = (Store.get().settings||{}).weather || {};
    return { lat: w.lat!=null? w.lat : 49.9833, lon: w.lon!=null? w.lon : 8.8333,
             name: w.name || "Rödermark" };
  }
  function load(){ try{ data = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ data = null; } }
  function fresh(){
    const p = place();
    return data && !data.err && data.at && (Date.now()-data.at < TTL) && data.lat===p.lat && data.lon===p.lon;
  }
  async function refresh(force){
    if(busy || (!force && fresh())) return;
    if(!force && tries >= 3) return;              /* nicht endlos gegen eine Wand laufen */
    busy = true;
    if(force) tries = 0;
    const p = place();
    const url = "https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon
      + "&current=temperature_2m,weather_code"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=Europe%2FBerlin&forecast_days=3";
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const j = await res.json();
      const d = j.daily || {};
      data = { at:Date.now(), lat:p.lat, lon:p.lon, name:p.name,
               now:{ t:Math.round(j.current.temperature_2m), code:j.current.weather_code },
               days:(d.time||[]).map((day,i)=>({
                 date:day, code:d.weather_code[i],
                 max:Math.round(d.temperature_2m_max[i]), min:Math.round(d.temperature_2m_min[i]),
                 rain:d.precipitation_probability_max ? d.precipitation_probability_max[i] : null })) };
      try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
    }catch(e){
      const blocked = /failed to fetch|networkerror|load failed/i.test(e.message||"");
      const msg = blocked
        ? "Die Seite darf keine externen Daten laden. In einer Vorschau ist das normal — unter der echten Adresse öffnen."
        : e.message;
      console.warn("Wetter nicht erreichbar:", e.message);
      if(data && data.now){ data.err = msg; }
      else data = { err:msg, at:0, days:[], name:p.name };
      tries++;
    }finally{
      busy = false;
      if(typeof Store!=="undefined") Store.notify("bg");
    }
  }
  function get(){ return data; }
  function forDate(k){ return (data && data.days) ? data.days.find(x=>x.date===k) : null; }

  const TXT = { 0:"klar", 1:"überwiegend klar", 2:"wechselnd bewölkt", 3:"bedeckt",
    45:"Nebel", 48:"Nebel", 51:"Niesel", 53:"Niesel", 55:"Niesel", 56:"gefrierender Niesel", 57:"gefrierender Niesel",
    61:"Regen", 63:"Regen", 65:"starker Regen", 66:"gefrierender Regen", 67:"gefrierender Regen",
    71:"Schnee", 73:"Schnee", 75:"starker Schnee", 77:"Schneegriesel",
    80:"Schauer", 81:"Schauer", 82:"kräftige Schauer", 85:"Schneeschauer", 86:"Schneeschauer",
    95:"Gewitter", 96:"Gewitter mit Hagel", 99:"Gewitter mit Hagel" };
  function text(code){ return TXT[code] || "wechselhaft"; }
  function kind(code){
    if(code===0||code===1) return "sun";
    if(code===2) return "partly";
    if(code===3) return "cloud";
    if(code===45||code===48) return "fog";
    if(code>=71 && code<=77) return "snow";
    if(code===85||code===86) return "snow";
    if(code>=95) return "storm";
    if(code>=51) return "rain";
    return "cloud";
  }
  function status(){ return data && data.err ? data.err : null; }
  return { load, refresh, get, forDate, text, kind, place, status };
})();

/* ==========================================================================
   5c) PWA — Installation und Offline-Betrieb.
       Scheitert alles davon, läuft die App unverändert als normale Seite.
   ========================================================================== */
const PWA = (function(){
  let deferred = null, updateReady = false, reg = null;

  function standalone(){
    try{
      return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
          || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isIOS(){
    const ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }
  function supported(){
    try{ return !!(navigator && navigator.serviceWorker) && String(location.protocol).indexOf("http") === 0; }
    catch(e){ return false; }
  }

  function init(){
    try{ start(); }catch(e){ console.warn("Installationsteil übersprungen:", e.message); }
  }
  function start(){
    window.addEventListener("beforeinstallprompt", e=>{
      e.preventDefault(); deferred = e;
      if(typeof UI!=="undefined" && UI.render) UI.render();
    });
    window.addEventListener("appinstalled", ()=>{
      deferred = null;
      if(typeof UI!=="undefined"){ UI.toast("Nestwerk ist installiert."); UI.render(); }
    });
    if(!supported()) return;
    navigator.serviceWorker.register("sw.js").then(r=>{
      reg = r;
      r.addEventListener("updatefound", ()=>{
        const nw = r.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            updateReady = true;
            if(typeof UI!=="undefined") UI.toast("Neue Fassung bereit — im Admin unter Daten laden.");
          }
        });
      });
    }).catch(err=> console.warn("Offline-Betrieb nicht aktiv:", err.message));

    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(reloading) return; reloading = true; location.reload();
    });
  }
  async function install(){
    if(!deferred) return false;
    deferred.prompt();
    const res = await deferred.userChoice;
    deferred = null;
    return res && res.outcome === "accepted";
  }
  function applyUpdate(){
    if(reg && reg.waiting) reg.waiting.postMessage("skipWaiting");
    else location.reload();
  }
  function state(){
    return { canInstall: !!deferred, standalone: standalone(), ios: isIOS(),
             supported: supported(), updateReady };
  }
  return { init, install, applyUpdate, state };
})();

/* ==========================================================================
   5d) GERÄT — Einstellungen, die NUR für dieses Gerät gelten und bewusst
       nicht synchronisiert werden (Wandmodus am Familien-Tablet).
   ========================================================================== */
const Device = (function(){
  const KEY = "nestwerk.device.v1";
  let cfg = { wall:false, idleMinutes:3, keepAwake:true,
              rotate:5, shift:true, night:true, nightFrom:"21:30", nightTo:"06:00" };
  let lock = null, idleTimer = null, unlocked = false, taps = 0, tapAt = 0;
  let loopTimer = null, shiftTimer = null, cycleAt = 0, nightOn = false, nightSnoozed = false;

  function load(){
    try{ const r = localStorage.getItem(KEY); if(r) cfg = Object.assign(cfg, JSON.parse(r)); }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }
  function get(){ return Object.assign({}, cfg); }
  function isWall(){ return !!cfg.wall; }
  /* Im Wandmodus bleibt der Admin-Bereich verborgen, bis er entsperrt wurde */
  function adminVisible(){ return !cfg.wall || unlocked; }
  function unlock(){ unlocked = true; }
  function relock(){ unlocked = false; }

  function set(patch){
    cfg = Object.assign(cfg, patch); save();
    applyWake(); shiftPixels();
    if(!cfg.wall){
      unlocked = false; clearTimeout(idleTimer); stopLoop();
      clearInterval(shiftTimer); shiftTimer = null; paintNight(false);
    } else {
      if(!shiftTimer) shiftTimer = setInterval(shiftPixels, 120000);
      resetIdle();
    }
  }

  /* Bildschirm wachhalten, solange die Seite sichtbar ist */
  async function applyWake(){
    try{
      if(cfg.wall && cfg.keepAwake && "wakeLock" in navigator && document.visibilityState === "visible"){
        if(!lock){
          lock = await navigator.wakeLock.request("screen");
          lock.addEventListener("release", ()=>{ lock = null; });
        }
      } else if(lock){ await lock.release(); lock = null; }
    }catch(e){ /* Browser verweigert oder kein Akkubetrieb — kein Grund abzubrechen */ }
  }
  function wakeActive(){ return !!lock; }

  /* ---- Anzeigebetrieb: erst nach Ruhe, damit niemand beim Tippen gestört wird ---- */
  const CYCLE = [
    { tab:"today"  },
    { tab:"house"  },
    { tab:"me", person:"henry"  },
    { tab:"me", person:"hannah" },
    { tab:"me", person:"emma"   }
  ];
  function inNight(){
    if(!cfg.night) return false;
    const now = T.nowMin(), a = T.min(cfg.nightFrom||"21:30"), b = T.min(cfg.nightTo||"06:00");
    return (a > b) ? (now >= a || now < b) : (now >= a && now < b);
  }
  /* Nachtbild: fast schwarz, kaum Fläche — schont das AMOLED am stärksten */
  function paintNight(on){
    if(!document.getElementById) return;
    let n = document.getElementById("nightScreen");
    if(on && !n){
      n = document.createElement("div");
      n.id = "nightScreen"; n.className = "nightscreen";
      n.addEventListener("click", ()=>{ nightSnoozed = true; paintNight(false); resetIdle(); });
      document.body.appendChild(n);
    }
    if(!n) return;
    nightOn = on;
    n.style.display = on ? "flex" : "none";
    if(on){
      const d = new Date();
      n.innerHTML = '<div class="ns-in" style="transform:translate('+(Math.random()*40-20).toFixed(0)+'px,'
        + (Math.random()*40-20).toFixed(0)+'px)"><b>'+T.hhmm(d.getHours()*60+d.getMinutes())+'</b>'
        + '<span>'+T.dayName(T.key(d))+'</span></div>';
    }
  }
  function stopLoop(){ clearTimeout(loopTimer); loopTimer = null; cycleAt = 0; }
  function tick(){
    if(!cfg.wall) return;
    if(inNight() && !nightSnoozed){ paintNight(true); loopTimer = setTimeout(tick, 60000); return; }
    if(nightOn) paintNight(false);
    if(cfg.rotate && typeof UI !== "undefined"){
      const step = CYCLE[cycleAt % CYCLE.length]; cycleAt++;
      UI.S.date = T.key(new Date());
      UI.S.tab = step.tab;
      if(step.person) UI.S.person = step.person;
      UI.render();
    }
    loopTimer = setTimeout(tick, Math.max(1, cfg.rotate || 5) * 60000);
  }
  /* Kleiner Versatz des gesamten Inhalts, damit keine Kante monatelang steht */
  function shiftPixels(){
    if(!document.documentElement || !document.documentElement.style) return;
    const on = cfg.wall && cfg.shift;
    document.documentElement.style.setProperty("--shift-x", on ? (Math.round(Math.random()*10-5))+"px" : "0px");
    document.documentElement.style.setProperty("--shift-y", on ? (Math.round(Math.random()*8-4))+"px" : "0px");
  }
  /* Jede Berührung beendet den Anzeigebetrieb sofort */
  function resetIdle(){
    clearTimeout(idleTimer); stopLoop();
    if(nightOn) paintNight(false);
    if(!cfg.wall) return;
    nightSnoozed = false;
    if(!cfg.idleMinutes) return;
    idleTimer = setTimeout(()=>{
      unlocked = false;
      if(typeof UI !== "undefined"){
        UI.S.tab = "today"; UI.S.date = T.key(new Date()); UI.render();
      }
      cycleAt = 1;                 /* Heute steht schon, also mit dem Nächsten weiter */
      loopTimer = setTimeout(tick, Math.max(1, cfg.rotate || 5) * 60000);
      if(inNight()) paintNight(true);
    }, cfg.idleMinutes * 60000);
  }
  /* Fünfmal auf das Zeichen tippen öffnet den Admin-Bereich wieder */
  function logoTap(){
    const now = Date.now();
    taps = (now - tapAt < 1200) ? taps + 1 : 1;
    tapAt = now;
    if(taps >= 5){ taps = 0; unlocked = true; return true; }
    return false;
  }
  function init(){
    load(); applyWake(); shiftPixels(); resetIdle();
    if(cfg.wall && !shiftTimer) shiftTimer = setInterval(shiftPixels, 120000);
    document.addEventListener("visibilitychange", applyWake);
    ["click","keydown","touchstart"].forEach(ev=>
      document.addEventListener(ev, resetIdle, { passive:true }));
  }
  return { init, get, set, isWall, adminVisible, unlock, relock, logoTap, wakeActive, applyWake,
           inNight, _tick:tick, _cycleLength:()=>CYCLE.length, _cycleAt:()=>cycleAt, _night:()=>nightOn };
})();

/* ==========================================================================
   6) UI — rendert ausschließlich aus Store + Engine
   ========================================================================== */
const UI = (function(){
  const S = { tab:"today", bandMode:"auto", timeBudget:null, ttKid:"henry", ttWeek:"A", person:"mama", date:T.key(new Date()), adminTab:"basics", jobKid:"henry", houseFilter:"all" };
  const el = id => document.getElementById(id);

  /* ---------- Mikro-Feedback ---------- */
  function toast(msg, kind){
    const w = el("toasts"); const t = document.createElement("div");
    t.className = "toast"+(kind?" "+kind:""); t.textContent = msg; w.appendChild(t);
    setTimeout(()=>{ t.style.transition="opacity .3s, transform .3s"; t.style.opacity="0"; t.style.transform="translateY(8px)"; setTimeout(()=>t.remove(),320); }, 2600);
  }
  const sized = (svg,px)=> svg.replace("<svg ", '<svg style="width:'+px+'px;height:'+px+'px" ');
  function coinFly(ev, n){
    const x = ev && ev.clientX ? ev.clientX : window.innerWidth/2, y = ev && ev.clientY ? ev.clientY : window.innerHeight/2;
    for(let i=0;i<Math.min(6,Math.max(3,Math.round(n/4)));i++){
      const s = document.createElement("span");
      s.className="coin-fly"; s.style.left=(x-14+(Math.random()*44-22))+"px"; s.style.top=(y-14)+"px";
      s.style.animationDelay=(i*60)+"ms"; s.style.width="28px"; s.style.height="28px";
      s.innerHTML = sized(Art.illu("coin"),28);
      document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
    }
  }
  const CONF = ["#6A46D9","#9B6BF0","#EE5B8C","#F0982A","#2FA36B","#3B76E8","#FBCB5A"];
  function confetti(ev, n){
    n = n || 14;
    const x = ev && ev.clientX ? ev.clientX : window.innerWidth/2;
    const y = ev && ev.clientY ? ev.clientY : window.innerHeight/2;
    for(let i=0;i<n;i++){
      const s = document.createElement("span");
      const ang = (Math.PI*2*i)/n + Math.random()*0.5;
      const dist = 46 + Math.random()*54;
      s.className = "confetti";
      s.style.left = (x-4)+"px"; s.style.top = (y-6)+"px";
      s.style.background = CONF[i % CONF.length];
      s.style.setProperty("--dx", Math.cos(ang)*dist+"px");
      s.style.setProperty("--dy", (Math.sin(ang)*dist + 34)+"px");
      s.style.setProperty("--rot", Math.round(Math.random()*720-360)+"deg");
      s.style.animationDelay = (i*14)+"ms";
      if(i%3===0) s.style.borderRadius = "50%";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 1300);
    }
  }
  function celebrate(){
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for(let i=0;i<9;i++){
      const s=document.createElement("span");
      s.className="coin-fly"; s.style.left=(cx-16+(Math.random()*220-110))+"px"; s.style.top=(cy+(Math.random()*80-40))+"px";
      s.style.animationDelay=(i*45)+"ms"; s.innerHTML = sized(Art.illu(i%2?"star":"sparkle"),26);
      document.body.appendChild(s); setTimeout(()=>s.remove(),1300);
    }
  }
  function modal(title, body, footer){
    const root = el("modalRoot");
    root.innerHTML = '<div class="modal-bg" data-a="closeModal"><div class="modal" data-stop="1">'
      + '<div class="row" style="margin-bottom:8px"><h2 style="flex:1">'+esc(title)+'</h2>'
      + '<button class="icon-btn" data-a="closeModal" aria-label="Schließen">'+Art.icon("close")+'</button></div>'
      + body + (footer? '<div class="row" style="gap:10px;margin-top:18px">'+footer+'</div>' : '') + '</div></div>';
  }
  function closeModal(){ el("modalRoot").innerHTML=""; }

  /* ---------- Bausteine ---------- */
  function personPill(pid){
    return '<span class="pill-person" style="background:'+P(pid).soft+'">'+Art.avatar(pid)+esc(P(pid).name)+'</span>';
  }
  function taskRow(o){
    return '<div class="task'+(o.done?" done":"")+'" data-a="'+o.action+'" data-id="'+o.id+'" role="button" tabindex="0" aria-pressed="'+(!!o.done)+'">'
      + '<span class="check">'+Art.checkPath+'</span>'
      + (o.icon? '<span class="t-ico">'+Art.illu(o.icon)+'</span>' : '')
      + '<span class="t-body"><span class="t-title">'+esc(o.title)+'</span>'
      + (o.sub? '<span class="t-sub">'+esc(o.sub)+'</span>':'') + '</span>'
      + (o.right||'') + '</div>';
  }
  function bar(pct, cls){ return '<div class="bar '+(cls||"")+'"><i style="width:'+clamp(pct,0,100)+'%"></i></div>'; }
  function empty(txt, ico){ return '<div class="empty">'+Art.illu(ico||"sparkle")+'<div>'+esc(txt)+'</div></div>'; }

  const EV_COLOR = { school:["#EAF0F5","#5E7B9E"], care:["#F1F0EA","#9A9078"], hobby:["#EAF3EE","#4C8579"],
                     sport:["#F6EAF0","#B04C77"], work:["#EFEFF3","#6B6E86"], travel:["#F3F5F3","#8A9690"],
                     family:["#FAF1E2","#B5822A"], logistics:["#EDF2F6","#4C7BA0"] };

  /* ---------- Signature: Familien-Tagesband ---------- */
  function band(k){
    const A=6*60, B=21*60, span=B-A;
    let hours=""; for(let h=6;h<21;h++) hours += '<span>'+String(h).padStart(2,"0")+'</span>';
    const lanes = Store.get().people.map(p=>{
      const evs = Engine.eventsFor(p.id,k).filter(e=> T.min(e.end)>A && T.min(e.start)<B);
      const rows=[];
      evs.forEach(e=>{
        const s=T.min(e.start), en=Math.max(T.min(e.end), s+25);
        let r=0; while(rows[r] && rows[r] > s) r++;
        rows[r]=en; e._row=r;
      });
      const h = 16 + Math.max(1,rows.length)*50;
      const body = evs.map((e,ix)=>{
        const s=clamp(T.min(e.start),A,B), en=clamp(Math.max(T.min(e.end),T.min(e.start)+25),A,B);
        const c = EV_COLOR[e.kind]||EV_COLOR.family;
        const isTravel = e.kind==="travel";
        const wpct = Math.max(2.2,(en-s)/span*100);
        const mini = wpct < 6.5;                       /* zu schmal für Text → antippbare Marke */
        return '<div class="ev'+(isTravel?" travel":"")+(mini?" mini":"")+'" role="button" tabindex="0"'
          + ' data-a="evDetail" data-id="'+p.id+'" data-n="'+evs.indexOf(e)+'"'
          + ' title="'+esc(e.title+" "+e.start+"–"+e.end)+'"'
          + ' style="left:'+((s-A)/span*100)+'%;width:'+wpct+'%;top:'+(9+e._row*50)+'px;--ev-bg:'+c[0]+';--ev-c:'+c[1]+'">'
          + '<b>'+esc(e.title)+'</b>'+(isTravel?"":'<span>'+e.start+'–'+e.end+'</span>')+'</div>';
      }).join("");
      let grid=""; for(let i=0;i<15;i++) grid+="<i></i>";
      return '<div class="lane" style="min-height:'+h+'px">'
        + '<div class="lane-head">'+Art.avatar(p.id)+'<b>'+esc(p.name)+'</b></div>'
        + '<div class="lane-track"><div class="lane-grid">'+grid+'</div>'+body+'</div></div>';
    }).join("");
    const nowPct = (T.key(new Date())===k) ? (clamp(T.nowMin(),A,B)-A)/span*100 : null;
    const now = nowPct==null ? "" : '<div class="now-line" style="left:calc(96px + (100% - 96px) * '+(nowPct/100)+')"></div>';
    return '<div class="band"><div class="band-scroll" data-ks="band"><div class="band-inner">'
      + '<div class="band-hours">'+hours+'</div>'+ lanes + now +'</div></div></div>';
  }

  /* ---------- Tagesliste: gleiche Daten, für schmale Bildschirme ---------- */
  function isNarrow(){ return (typeof window.innerWidth !== "undefined" ? window.innerWidth : 1200) < 900; }
  function bandMode(){ return S.bandMode === "auto" ? (isNarrow() ? "list" : "band") : S.bandMode; }

  function agenda(k){
    const rows = [], travelOf = {};
    Store.get().people.forEach(p=>{
      const evs = Engine.eventsFor(p.id,k);
      evs.forEach((e,ix)=>{
        if(e.travelOf){ travelOf[p.id+"|"+e.travelOf] = e; return; }
        rows.push({ pid:p.id, e, ix });
      });
    });
    rows.sort((a,b)=> T.min(a.e.start)-T.min(b.e.start));
    if(!rows.length) return empty("Heute steht nichts im Kalender.","star");
    let lastTime = "";
    return rows.map(r=>{
      const c = EV_COLOR[r.e.kind] || EV_COLOR.family;
      const tv = travelOf[r.pid+"|"+(r.e.ref||r.e.id)];
      const head = (r.e.start !== lastTime);
      lastTime = r.e.start;
      return '<div class="ag'+(r.e.kind==="travel"?" ag-soft":"")+'" role="button" tabindex="0" data-a="evDetail" data-id="'+r.pid+'" data-n="'+r.ix+'">'
        + '<div class="ag-time">'+(head? '<b>'+r.e.start+'</b>' : '<span>'+r.e.start+'</span>')+'<i>'+r.e.end+'</i></div>'
        + '<div class="ag-bar" style="background:'+c[1]+'"></div>'
        + '<div class="ag-av">'+Art.avatar(r.pid)+'</div>'
        + '<div class="ag-body"><b>'+esc(r.e.title)+'</b>'
        + (tv? '<span class="ag-sub">'+Art.icon("clock")+' Aufbruch '+tv.start+'</span>' : '')
        + (r.e.note? '<span class="ag-sub">'+esc(r.e.note)+'</span>' : '')
        + '</div></div>';
    }).join("");
  }

  function dayView(k){
    const mode = bandMode();
    const toggle = '<div class="seg">'
      + '<button data-a="setBandMode" data-id="list" aria-pressed="'+(mode==="list")+'">Liste</button>'
      + '<button data-a="setBandMode" data-id="band" aria-pressed="'+(mode==="band")+'">Zeitachse</button></div>';
    return '<div class="section-h"><h2>Tagesband</h2><span class="hint">alle Termine der Familie</span>'
      + '<span class="spacer"></span>'+toggle+'</div>'
      + (mode==="band" ? band(k) : '<div class="card tight">'+agenda(k)+'</div>');
  }

  /* ==========================  HEUTE  ========================== */
  function viewToday(){
    const k = S.date, db = Store.get(), day = Store.dayRead(k);
    const ev = Engine.eveningPlan(k);
    const wt = Engine.weekType(k);

    /* Abendkarte */
    const evening = '<div class="card" style="--acc:'+pcol(ev.bedtime)+'">'
      + '<div class="row"><span class="eyebrow">Der Abend ist geregelt</span><span class="spacer"></span>'
      + '<button class="btn ghost sm" data-a="swapEvening">'+Art.icon("refresh")+' Tauschen</button></div>'
      + '<div class="grid" style="grid-template-columns:1fr;gap:12px;margin-top:12px">'
      + '<div class="row" style="gap:14px"><div style="width:52px;flex:none">'+Art.avatar(ev.bedtime)+'</div>'
      + '<div style="flex:1"><h3>'+esc(P(ev.bedtime).name)+' bringt Emma ins Bett</h3>'
      + '<p class="small muted">ab '+ev.bedTime+' · '+esc(ev.reason)+'</p></div></div>'
      + '<div class="row" style="gap:14px"><div style="width:52px;flex:none">'+Art.avatar(ev.kitchen)+'</div>'
      + '<div style="flex:1"><h3>'+esc(P(ev.kitchen).name)+' macht den Küchenabschluss</h3>'
      + '<p class="small muted">ab '+ev.kitchenTime+' · '+esc(ev.kitchenReason)+'</p></div></div>'
      + (ev.conflict
          ? '<div class="locked-note"><span style="width:22px;flex:none;color:var(--warn)">'+Art.icon("warn")+'</span><div class="small">Hier kommt die Planung an ihre Grenze — bitte kurz selbst entscheiden.</div></div>'
          : ev.both? '<div class="locked-note"><span style="width:22px;flex:none;color:var(--warn)">'+Art.icon("warn")+'</span><div class="small">Heute übernimmt eine Person beides. Morgen gleicht die Planung das wieder aus.</div></div>':'')
      + '</div></div>';

    /* Personen-Kacheln — der Einstieg in den Tag */
    const cards = db.people.map(p=>{
      const st = Engine.dayStats(p.id,k);
      const m = p.role==="child" ? Engine.media(p.id,k) : null;
      const next = Engine.eventsFor(p.id,k).find(e=> T.min(e.end) > T.nowMin() && e.kind!=="travel");
      const pct = st.total? Math.round(st.done/st.total*100) : 100;
      const allDone = st.total>0 && st.open===0;
      const ab = Engine.absenceLabel(p.id,k);
      const status = ab ? ab.text : (st.open ? st.open+" offen" : (st.total? "alles erledigt" : "nichts geplant"));
      return '<div class="ptile'+(allDone?" all-done":"")+'" role="button" tabindex="0"'
        + ' style="--acc:'+pcol(p.id)+';--acc-soft:'+p.soft+'" data-a="openPerson" data-id="'+p.id+'"'
        + ' aria-label="'+esc(p.name)+' — '+esc(status)+(m && !m.unlocked? ", Medienzeit gesperrt":"")+'">'
        + '<div class="pt-figs">'
        + '<span class="pt-avatar">'+Art.portrait(p.id)+'</span>'
        + (m && !m.unlocked? '<span class="pt-lock" title="Medienzeit noch gesperrt">'+Art.icon("lock")+'</span>':'')
        + (allDone? '<span class="pt-star">'+Art.illu("star")+'</span>':'')
        + '<span class="pt-comp">'+Art.companion(p.companion)+'</span>'
        + '</div>'
        + '<b class="pt-name">'+esc(p.name)+'</b>'
        + '<span class="pt-status">'+esc(status)+'</span>'
        + '<div class="pt-bar">'+bar(pct)+'</div>'
        + '<div class="pt-meta">'
        + '<span class="pt-next">'+(next? next.start+' '+esc(shortTitle(next.title)) : '&nbsp;')+'</span>'
        + '<span class="pt-coins'+(p.role==="child"?"":" ghost")+'">'
        + (p.role==="child"? Art.illu("coin")+(db.state.coins[p.id]||0) : '&nbsp;')+'</span>'
        + '</div>'
        + '</div>';
    }).join("");

    /* Haushalt heute */
    const assign = Engine.assignmentsFor(k);
    const due = Engine.choresDue(k);
    const houseList = due.length ? due.map(c=>{
      const who = assign[c.id];
      const st = Engine.choreStatus(c,k);
      return taskRow({ id:c.id, action:"toggleChore", done:!!day.chores[c.id], title:c.title,
        sub:(who==="*"? "alle gemeinsam" : (who? P(who).name : "niemand freigeschaltet")+" · "+c.room)+(st.days<0? " · "+(-st.days)+" Tage überfällig":""),
        right: who==="*" ? '<span class="chip">Familie</span>'
             : who ? '<span class="pill-person" style="background:'+P(who).soft+'">'+Art.avatar(who)+'</span>'
             : '<span class="chip warn">niemand frei</span>' });
    }).join("") : empty("Heute ist im Haushalt nichts fällig.","broom");

    /* Missionen im Umlauf */
    const claimed = db.missions.filter(m=>m.status==="claimed");
    const doneM = db.missions.filter(m=>m.status==="done" && m.doneAt===k);
    const missionBox = (claimed.length||doneM.length) ?
      claimed.map(m=>'<div class="task"><span class="t-ico">'+Art.illu(m.icon)+'</span><span class="t-body"><span class="t-title">'+esc(m.title)+'</span><span class="t-sub">übernommen von '+esc(P(m.by).name)+' · noch offen</span></span><span class="chip gold">'+m.coins+'</span></div>').join("")
      + doneM.map(m=>'<div class="task done"><span class="check">'+Art.checkPath+'</span><span class="t-body"><span class="t-title">'+esc(m.title)+'</span><span class="t-sub">'+esc(P(m.by).name)+' · '+m.coins+' Coins gutgeschrieben</span></span></div>').join("")
      : empty("Aktuell hat niemand eine Extra-Mission übernommen.","sparkle");

    /* Medienzeit kompakt */
    const mediaBox = db.people.filter(p=>p.role==="child").map(p=>{
      const m = Engine.media(p.id,k);
      return '<div style="margin-bottom:14px"><div class="row" style="gap:8px"><b class="small">'+esc(p.name)+'</b><span class="spacer"></span>'
        + '<span class="xs '+(m.unlocked?"muted":"")+'" '+(m.unlocked?"":'style="color:var(--warn)"')+'>'+(m.unlocked? m.used+" / "+m.budget+" Min" : "gesperrt — "+m.open.length+" Basics offen")+'</span></div>'
        + '<div style="margin-top:6px">'+bar(m.budget? m.used/m.budget*100:0, "gold")+'</div></div>';
    }).join("");

    const hl = Engine.highlights(k);
    const hlBox = hl.map(h=>'<div class="row" style="align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)">'
      + '<span style="width:34px;flex:none">'+Art.illu(h.icon)+'</span>'
      + '<div><b class="small">'+esc(h.title)+'</b><p class="xs muted">'+esc(h.text)+'</p></div></div>').join("");

    return '<div class="stack lg" style="padding-top:18px">'
      + '<div><span class="eyebrow">Familienübersicht</span><h1 style="margin-top:4px">'+T.dayName(k)+', '+T.long(k)+'</h1>'
      + '<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">'
      + '<span class="chip brand">Schulwoche '+wt+'</span>'
      + '<span class="chip">'+Engine.choresDue(k).length+' Haushaltsaufgaben fällig</span>'
      + '<span class="chip">'+Engine.openMissions().length+' freie Extra-Missionen</span>'
      + wxChip(k)
      + dateNav() + '</div></div>'

      + '<div><div class="section-h"><h2>Wer steht wo?</h2><span class="hint">tippen für das eigene Dashboard</span></div>'
      + '<div class="ptiles">'+cards+'</div></div>'

      + morningStrip(k)
      + (hl.length? '<div><div class="section-h"><h2>Worauf es heute ankommt</h2></div><div class="card hl-card">'+hlBox+'</div></div>':'')

      + '<div class="two-col"><div class="stack">'
      + evening
      + '<div>'+dayView(k)+'</div>'
      + '<div><div class="section-h"><h2>Haushalt heute</h2><span class="hint">automatisch verteilt</span></div><div class="card">'+houseList+'</div></div>'
      + '<div><div class="section-h"><h2>Extra-Missionen im Umlauf</h2></div><div class="card">'+missionBox+'</div></div>'
      + '</div><div class="stack">'
      + '<div><div class="section-h"><h2>Medienzeit heute</h2></div><div class="card">'+mediaBox+'</div></div>'
      + '</div></div></div>';
  }
  /* Kurzfassung für enge Kacheln — der volle Titel steht im Tagesband */
  function shortTitle(t){
    return String(t)
      .replace(/^Fahrdienst:\s*/, "")
      .replace(/^U8-Rugby:\s*/, "")
      .replace(/\s*\(Homeoffice\)/, " daheim")
      .replace(/\s*\(Büro\)/, " im Büro")
      .replace(/Emma ins Bett bringen/, "Emma ins Bett");
  }
  function wxChip(k){
    const w = Weather.get(); if(!w || !w.days) return "";
    const d = Weather.forDate(k); if(!d) return "";
    const isToday = k === T.key(new Date());
    return '<span class="chip" title="'+esc(w.name+" · "+Weather.text(d.code))+'">'+Art.wx(d.code)
      + (isToday && w.now ? ' '+w.now.t+'° jetzt · bis '+d.max+'°' : ' '+d.max+'° / '+d.min+'°')
      + (d.rain!=null && d.rain>=20 ? ' · '+d.rain+' % Regen' : '')+'</span>';
  }
  function morningStrip(k){
    const kids = Store.get().people.filter(p=>p.role==="child")
      .map(p=>({p, m:Engine.morningState(p.id,k)})).filter(x=> x.m.relevant && x.m.active);
    if(!kids.length) return "";
    return '<div><div class="section-h"><h2>Der Morgen läuft</h2><span class="hint">bis alle aus der Tür sind</span></div>'
      + '<div class="card"><div class="mo-strip">'
      + kids.map(x=>'<button class="mo-mini" data-lvl="'+(x.m.allDone?"ok":(x.m.toLeave<0?"crit":x.m.toLeave<=10?"low":"mid"))+'"'
          + ' data-a="openPerson" data-id="'+x.p.id+'">'
          + '<span class="mo-mini-av">'+Art.avatar(x.p.id)+'</span>'
          + '<b>'+esc(x.p.name)+'</b>'
          + '<span class="xs">'+(x.m.allDone? "fertig" : x.m.openCount+" offen")+'</span>'
          + '<div class="meter" style="width:100%;margin-top:6px"><i style="width:'+clamp(x.m.pct,3,100)+'%"></i></div>'
          + '<span class="xs muted" style="margin-top:4px">'+(x.m.toLeave<0? "seit "+mmText(-x.m.toLeave)+" fällig" : "los in "+mmText(x.m.toLeave))+'</span>'
          + '</button>').join("")
      + '</div></div></div>';
  }
  function dateNav(){
    return '<span class="spacer"></span>'
      + '<button class="icon-btn" data-a="dateShift" data-n="-1" aria-label="Tag zurück">'+Art.icon("back")+'</button>'

    return '<div class="hero-person" style="--acc-soft:'+p.soft+'">'

  function scheduleList(pid){
    const k=S.date, evs = Engine.eventsFor(pid,k);
    if(!evs.length) return empty("Heute steht nichts im Kalender.","star");
    return evs.map(e=>{
      const c = EV_COLOR[e.kind]||EV_COLOR.family;
      const sub = e.subjects ? e.subjects.map(s=>s.subject).join(" · ") : (e.note||"");
      return '<div class="row" style="align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)">'
        + '<div style="width:52px;flex:none"><b class="small">'+e.start+'</b><div class="xs muted">'+e.end+'</div></div>'
        + '<div style="width:4px;align-self:stretch;border-radius:3px;background:'+c[1]+';flex:none"></div>'
        + '<div style="flex:1;min-width:0"><b class="small">'+esc(e.title)+'</b>'
        + (sub? '<p class="xs muted">'+esc(sub)+'</p>':'')+'</div></div>';
    }).join("");
  }
  function mediaCard(pid){
    const k=S.date, m = Engine.media(pid,k), p=P(pid);
    const gate = !m.unlocked;
    const chips = [10,15,20,30].map(n=>'<button class="btn '+(gate?"ghost":"soft")+' sm" data-a="logMedia" data-id="'+pid+'" data-n="'+n+'" '+(gate||m.remaining<=0?"disabled":"")+'>+'+n+' Min</button>').join("");
    const list = m.entries.length ? '<div class="stack" style="gap:6px;margin-top:12px">'+m.entries.map((e,i)=>
        '<div class="row xs muted"><span>'+e.at+' Uhr · '+e.min+' Minuten</span><span class="spacer"></span><button class="btn ghost sm" data-a="undoMedia" data-id="'+pid+'" data-n="'+i+'">rückgängig</button></div>').join("")+'</div>' : '';
    return '<div class="card'+(m.unlocked?" unlock-burst":"")+'">'
      + '<div class="row" style="margin-bottom:12px"><span class="eyebrow">Medienzeit</span><span class="spacer"></span>'
      + '<span class="chip '+(gate?"warn":"ok")+'">'+(gate?"gesperrt":"frei")+'</span></div>'
      + '<div class="media-visual"><span class="device">'+Art.illu(p.id==="henry"?"tv":"tablet")+'</span>'
      + '<div class="mv-body">'

      + '<p class="xs muted" style="margin-top:6px">'+m.used+' Minuten genutzt · '+m.remaining+' für später aufgehoben</p>'
      + '</div></div>'
      + (gate? '<div class="locked-note" style="margin-top:14px"><span style="width:22px;flex:none;color:var(--warn)">'+Art.icon("lock")+'</span>'
              + '<div class="small">Noch offen: '+m.open.map(b=>esc(b.title)).join(", ")+'</div></div>'
              : '<div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">'+chips+'</div>')

  /* ---- Morgenbildschirm ---- */
  function mmText(min){
    if(min <= 0) return "jetzt";
    if(min < 60) return min + " Min";
    return Math.floor(min/60) + " Std " + (min%60) + " Min";
  }
  function morningPanel(pid, big){
    const k = S.date, m = Engine.morningState(pid, k);
    if(!m.relevant) return "";
    const late = m.live && m.toLeave < 0;
    const tight = m.live && m.toLeave >= 0 && m.toLeave <= 10;
    const lvl = m.allDone ? "ok" : late ? "crit" : tight ? "low" : "mid";
    const pack = Engine.morningPacking(pid, k);

    const head = '<div class="mo-head">'
      + '<div class="mo-clock" data-mo-clock>'
      + (m.live
          ? (m.allDone ? '<b>Fertig!</b><span>du kannst los</span>'
             : late ? '<b>'+mmText(-m.toLeave)+'</b><span>zu spät — schnell!</span>'
                    : '<b>'+mmText(m.toLeave)+'</b><span>bis los um '+m.leave+'</span>')
          : '<b>'+m.leave+'</b><span>Losgehen</span>')
      + '</div>'
      + '<div style="flex:1;min-width:0">'
      + '<div class="row" style="gap:8px"><b class="small" style="flex:1">'+(m.allDone? "Alles geschafft" : m.openCount+" von "+m.steps.length+" noch offen")+'</b></div>'
      + '<div class="meter" style="margin-top:8px" data-mo-bar><i style="width:'+clamp(m.pct,3,100)+'%"></i></div>'
      + (m.live? '<div class="mo-time" data-mo-time><i style="width:'+m.timePct+'%"></i></div>':'')
      + '</div></div>';

    const steps = m.steps.map(x=>
      '<button class="mo-step'+(x.done?" done":"")+(x.late?" late":"")+(x.soon?" soon":"")+'"'
      + ' data-a="morningStep" data-id="'+pid+'" data-k="'+x.st.id+'" aria-pressed="'+x.done+'">'
      + '<span class="mo-ico">'+Art.illu(x.st.icon)+'</span>'
      + '<span class="mo-body"><b>'+esc(x.st.title)+'</b>'
      + '<span>'+(x.done? "erledigt" : "bis "+x.st.by+(x.late? " · überfällig" : x.soon? " · gleich" : ""))+'</span></span>'
      + '<span class="mo-check">'+Art.checkPath+'</span></button>').join("");

    return '<div class="card morning" data-lvl="'+lvl+'"'+(big?' data-mo-big="1"':'')+'>'
      + '<div class="row" style="margin-bottom:12px"><span class="eyebrow">Guten Morgen</span>'
      + '<span class="spacer"></span>'
      + (m.live? '<span class="chip">'+T.hhmm(m.now)+'</span>' : '')
      + '</div>'
      + head
      + '<div class="mo-grid">'+steps+'</div>'
      + (pack.length? '<div class="mo-pack"><span style="width:26px;flex:none">'+Art.icon("bulb")+'</span>'
          + '<div class="small"><b>Heute mit dabei:</b> '+esc(pack.join(", "))+'</div></div>' : '')
      + '</div>';
  }

  /* ---- Verantwortungsstufen ---- */
  function capBoard(pid){
    const have = Engine.unlockedCaps(pid), next = Engine.nextCaps(pid);
    const chips = have.map(c=>'<span class="cap-chip done">'+Art.illu(c.icon)+esc(c.title)+'</span>').join("");
    const ready = next.filter(x=> x.prog.ready && !x.tooYoung);
    const soon  = next.filter(x=> !(x.prog.ready && !x.tooYoung)).slice(0,3);
    const readyBox = ready.map(x=>
      '<div class="cap-next ready"><span class="cn-ico">'+Art.illu(x.cap.icon)+'</span>'
      + '<div style="flex:1;min-width:0"><b class="small">'+esc(x.cap.title)+'</b>'
      + '<p class="xs muted">Du hast genug geübt — das kannst du jetzt freischalten.</p></div>'
      + '<button class="btn gold sm" data-a="unlockCap" data-id="'+pid+'" data-k="'+x.cap.id+'">Freischalten</button></div>').join("");
    const soonBox = soon.map(x=>
      '<div class="cap-next"><span class="cn-ico">'+Art.illu(x.cap.icon)+'</span>'
      + '<div style="flex:1;min-width:0"><b class="small">'+esc(x.cap.title)+'</b>'
      + (x.tooYoung
          ? '<p class="xs muted">Dafür musst du noch etwas älter sein (ab '+x.cap.minAge+').</p>'
          : '<div style="margin-top:6px">'+bar(x.prog.need? x.prog.have/x.prog.need*100:0)+'</div>'
            + '<p class="xs muted" style="margin-top:4px">Noch '+(x.prog.need-x.prog.have)+'× '
            + esc((x.cap.needs||[]).map(n=>(Engine.capById(n)||{}).title).filter(Boolean).join(" oder "))+'</p>')
      + '</div></div>').join("");
    return '<div><div class="section-h"><h2>Was du kannst</h2><span class="hint">'+have.length+' von '+Engine.caps().length+' freigeschaltet</span></div>'
      + '<div class="card">'
      + (chips? '<div class="cap-wrap">'+chips+'</div>' : '<p class="small muted">Noch nichts freigeschaltet.</p>')
      + (readyBox? '<div class="stack" style="gap:10px;margin-top:16px">'+readyBox+'</div>':'')
      + (soonBox? '<div class="stack" style="gap:10px;margin-top:12px">'+soonBox+'</div>':'')
      + '</div></div>';
  }

  /* ---- Jobbörse, gefiltert auf die Person ---- */
  function missionBoard(pid){
    const p = P(pid), open = Engine.openMissions().filter(m=> Engine.canDo(pid,m));
    const isKid = p.role === "child";
    const head = '<div class="section-h"><h2>Missionen übernehmen</h2>'
      + '<span class="hint">'+(isKid? "freiwillig, gegen Coins" : "freiwillig, ohne Coins")+'</span>'
      + '<span class="spacer"></span>'
      + '<button class="btn ghost sm" data-a="tab" data-id="jobs">Alle ansehen</button></div>';
    if(!open.length)
      return head + '<div class="card">'+empty("Gerade ist nichts frei, das zu "+esc(p.name)+" passt.","sparkle")+'</div>';
    const list = open.slice(0,4).map(m=>
      '<div class="mission"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body">'
      + '<b>'+esc(m.title)+'</b><p class="small muted">'+esc(m.desc)+'</p>'
      + '<div class="row" style="gap:8px;margin-top:9px;flex-wrap:wrap">'

      + '<button class="btn sm" data-a="claimMission" data-id="'+m.id+'">Übernehmen</button></div></div></div>').join("");
