<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241B4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241B4A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Nestwerk — der Familienplan: Termine, Aufgaben, Morgenablauf und Haushalt an einem Ort.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nestwerk">
<title>Nestwerk — Family OS</title>
<style>
/* ============================================================
   NESTWERK — Design Tokens
   Palette: Salbei-Weiss / Tiefgruen / Personenfarben als Kante
   ============================================================ */
:root{
  --bg:#F6F3FB;
  --bg-2:#EBE6F7;
  --surface:#FFFFFF;
  --surface-2:#FBF9FE;
  --ink:#171A34;
  --ink-2:#3D4266;
  --muted:#7B7F9E;
  --line:#E3DEF2;
  --line-2:#EFEBF9;
  --brand:#6A46D9;
  --brand-2:#9B6BF0;
  --brand-soft:#EDE7FC;
  --gold:#E9A31F;
  --gold-soft:#FEF3DC;
  --ok:#21A160;
  --ok-2:#4ECB8B;
  --p-henry:#2FA36B;
  --p-hannah:#6A46D9;
  --p-emma:#EE5B8C;
  --p-mama:#F0982A;
  --p-papa:#3B76E8;
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --sh-1:0 1px 2px rgba(23,26,52,.05), 0 6px 18px rgba(23,26,52,.06);
  --sh-2:0 2px 8px rgba(23,26,52,.08), 0 18px 40px rgba(23,26,52,.12);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --nav-h:76px;
  --pad:18px;
  /* Navigation: gleicher Buntton wie der Akzent, nur sehr viel dunkler */
  --nav-bg:#241B4A;
  --nav-bg-2:#2E2359;
  --nav-ink:#FFFFFF;
  --nav-ink-2:#A99FD4;
  --nav-pill:linear-gradient(135deg,#5A4BDB,#9B6BF0);
  --nav-line:rgba(255,255,255,.10);
}
html[data-nav="light"]{
  --nav-bg:#FFFFFFEE;
  --nav-bg-2:#FFFFFF;
  --nav-ink:var(--brand);
  --nav-ink-2:var(--muted);
  --nav-pill:var(--brand-soft);
  --nav-line:var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  overflow-wrap:anywhere;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);letter-spacing:-.02em;font-weight:650}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- App-Gerüst ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.main{flex:1;padding:0 var(--pad) calc(var(--nav-h) + 40px);max-width:1400px;width:100%;margin:0 auto}
@media (display-mode: standalone){
  body{overscroll-behavior:none}
  .main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 40px)}
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
}
.topbar-in{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto}
.wordmark{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:0;color:inherit;font-family:var(--font-display);font-weight:700;letter-spacing:-.03em;font-size:19px}
.wordmark .dot{width:26px;height:26px;flex:none}
.topbar .date{text-align:right;line-height:1.15}
.wx{margin-left:auto;display:none;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer}
.wx svg{width:24px;height:24px;flex:none}
.wx .wx-max{color:var(--ink-2);font-weight:650;font-size:12.5px}
.wx .wx-range{color:var(--muted);font-weight:500;font-size:12px}
.wx.stale{opacity:.55}
@media (max-width:430px){.wx{padding:4px 9px 4px 4px;font-size:12.5px}.wx .wx-range{display:none}}
.sync-dot{margin-left:8px;width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.sync-dot.s-ok{background:#4C8579}
.sync-dot.s-busy{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.sync-dot.s-error{background:#C6493F}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.topbar .date b{display:block;font-size:14px;font-family:var(--font-display)}
.topbar .date span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* ---------- Navigation ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--nav-bg);
  backdrop-filter:saturate(1.4) blur(18px);
  border-top:1px solid var(--nav-line);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;border-radius:14px;color:var(--nav-ink-2);
  font-size:11px;font-weight:600;letter-spacing:.01em;min-height:56px;justify-content:center;
  transition:color .15s,background .15s,transform .15s;
}
.nav button svg{width:23px;height:23px}
.nav button:active{transform:scale(.94)}
.nav button[aria-current="page"]{color:var(--nav-ink);background:var(--nav-pill);box-shadow:0 3px 12px rgba(90,75,219,.35)}
html[data-nav="light"] .nav button[aria-current="page"]{box-shadow:none}

/* ---------- Karten ---------- */
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh-1);padding:18px;border:1px solid var(--line-2)}
.card.tight{padding:14px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.lg{gap:22px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.section-h{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.section-h h2{flex:none}
.section-h .hint{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.grid{display:grid;gap:14px}

/* ---------- Chips / Badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg-2);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.gold{background:var(--gold-soft);color:#8A6314;font-weight:700}
.chip.warn{background:#FDF0DE;color:#9A6410}
.chip.ok{background:#E1F5EA;color:#177A48}
.pill-person{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--bg-2);font-size:13px;font-weight:650}
.pill-person svg{width:26px;height:26px;border-radius:999px;flex:none;background:#fff}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#5A4BDB,var(--brand-2));color:#fff;font-weight:650;font-size:14.5px;min-height:46px;transition:transform .12s,filter .15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#FBCB5A);color:#6A4708}
.btn.danger{background:#FCEAEF;color:#B23A5C;border-color:#F5D5DE}
.btn.sm{padding:8px 13px;min-height:38px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn svg{width:17px;height:17px}

/* ---------- Aufgaben-Zeile mit Checkbox ---------- */
.task{display:flex;align-items:center;gap:13px;padding:11px 4px;border-bottom:1px solid var(--line-2);min-height:56px}
.task:last-child{border-bottom:0}
.check{
  width:30px;height:30px;flex:none;border-radius:10px;border:2px solid var(--line);
  background:var(--surface);display:grid;place-items:center;transition:all .18s cubic-bezier(.2,.9,.3,1.4);
}
.check svg{width:17px;height:17px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .25s ease .05s}
.task.done .check{background:linear-gradient(135deg,var(--ok),var(--ok-2));border-color:var(--ok)}
.task.done .check svg{stroke-dashoffset:0}
.task.done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--line)}
.task .t-body{flex:1;min-width:0}
.t-title{font-size:15px;font-weight:600;line-height:1.3}
.t-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.t-ico{width:34px;height:34px;flex:none}
.task.pop .check{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ---------- Fortschritt ---------- */
.bar{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#5A4BDB,var(--brand-2));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar.thick{height:16px}
.bar.gold > i{background:linear-gradient(90deg,var(--gold),#FBCB5A)}
.bar.ok > i{background:linear-gradient(90deg,var(--ok),var(--ok-2))}

/* ---------- Personen-Akzent ---------- */
.accent{border-left:5px solid var(--acc,var(--brand))}
.hero-person{position:relative;overflow:hidden;padding:20px;border-radius:var(--r-xl);background:linear-gradient(160deg,var(--acc-soft,#EEF3F0),var(--surface) 62%);border:1px solid var(--line-2)}
.hero-person .figs{display:flex;align-items:flex-end;gap:6px}
.hero-person .avatar{width:96px;height:121px;flex:none;border-radius:18px;overflow:hidden;box-shadow:0 5px 16px rgba(23,26,52,.14)}
.hero-person .avatar svg{width:100%;height:100%;display:block}
.hero-person .comp{width:60px;height:60px;flex:none;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(23,26,52,.14);animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- Tagesband (Signature) ---------- */
.band{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--line-2);box-shadow:var(--sh-1);overflow:hidden}
.band-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.band-inner{min-width:760px;position:relative}
.band-hours{display:flex;padding-left:96px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:2}
.band-hours span{flex:1;font-size:10.5px;color:var(--muted);font-weight:650;padding:7px 0 6px 5px;border-left:1px solid var(--line-2)}
.lane{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2);min-height:62px}
.lane:last-child{border-bottom:0}
.lane-head{width:96px;flex:none;display:flex;align-items:center;gap:7px;padding:8px 8px 8px 12px;background:var(--surface-2);border-right:1px solid var(--line-2);position:sticky;left:0;z-index:1}
.lane-head svg{width:30px;height:30px;flex:none;border-radius:50%}
.lane-head b{font-size:12.5px;font-weight:650}
.lane-track{flex:1;position:relative;padding:9px 0}
.lane-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.lane-grid i{flex:1;border-left:1px solid var(--line-2)}
.ev{
  position:absolute;top:9px;height:44px;border-radius:11px;padding:6px 9px;
  background:var(--ev-bg,#EEF2F0);border-left:3px solid var(--ev-c,var(--brand));
  overflow:hidden;box-shadow:0 1px 2px rgba(30,38,34,.05)
}
.ev b{display:block;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ev span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.ev.travel{background:repeating-linear-gradient(135deg,#F3F5F3,#F3F5F3 5px,#E9EDE9 5px,#E9EDE9 10px);border-left-style:dashed;height:22px;top:20px}
.ev.travel b{font-size:10px;color:var(--ink-2)}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:#C6493F;z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:#C6493F}

/* ---------- Tagesliste (Handy) ---------- */
.seg{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--sh-1)}
.ag{display:flex;align-items:flex-start;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;min-height:60px}
.ag:last-child{border-bottom:0}
.ag-soft{opacity:.72;min-height:46px;padding:8px 4px}
.ag-time{width:52px;flex:none;text-align:right;line-height:1.25}
.ag-time b{display:block;font-size:14.5px;font-family:var(--font-display)}
.ag-time span{display:block;font-size:14.5px;font-family:var(--font-display);color:var(--ink-2)}
.ag-time i{display:block;font-size:11px;color:var(--muted);font-style:normal}
.ag-bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.ag-av{width:32px;height:32px;flex:none}
.ag-av svg{width:100%;height:100%;border-radius:50%}
.ag-body{flex:1;min-width:0}
.ag-body > b{display:block;font-size:15px;font-weight:650;line-height:1.3}
.ag-sub{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:2px}
.ag-sub svg{width:13px;height:13px}
.ev{cursor:pointer}
.ev.mini{padding:0;min-width:8px}
.ev.mini b,.ev.mini span{display:none}
.ev.mini::after{content:"";position:absolute;inset:0;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(23,26,52,.10)}
.chip svg{width:18px;height:18px}

/* ---------- Emma-Modus ---------- */
.emma-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.emma-card{
  position:relative;border-radius:26px;background:var(--surface);border:2px solid var(--line-2);
  box-shadow:var(--sh-1);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  min-height:168px;justify-content:center;transition:transform .16s,border-color .2s,background .2s;
}
.emma-card svg.illu{width:100%;max-width:132px;height:auto;aspect-ratio:1;pointer-events:none}
.emma-card .lbl{font-family:var(--font-display);font-size:16px;font-weight:700}
.emma-card:active{transform:scale(.96)}
.emma-card.done{background:#E8F7EF;border-color:#8FD9B4}
.emma-card .tick{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ok),var(--ok-2));display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.2,.9,.3,1.6)}
.emma-card.done .tick{transform:scale(1)}
.emma-card .tick svg{width:19px;height:19px;stroke:#fff;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.emma-card.done svg.illu{filter:saturate(.85)}

/* ---------- Personen-Kacheln (Heute) ---------- */
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;grid-auto-rows:1fr}
.ptile{
  position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  height:100%;min-width:0;padding:16px 12px 14px;border-radius:24px;cursor:pointer;
  background:var(--surface);
  border:1px solid var(--line-2);box-shadow:var(--sh-1);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .18s;
}
.ptile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--acc);border-radius:0 0 24px 24px;opacity:.85}
.ptile:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.ptile:active{transform:scale(.975)}
.pt-figs{position:relative;width:100%;display:flex;justify-content:center;margin-bottom:12px}
.pt-avatar{width:100%;max-width:150px;aspect-ratio:98/124;display:block;overflow:hidden}
.pt-avatar{border-radius:20px;box-shadow:0 5px 16px rgba(23,26,52,.13);background:var(--acc-soft)}
.pt-avatar svg{width:100%;height:100%;display:block}
.ptile{--ring:color-mix(in srgb,var(--acc) 32%,#FFFFFF)}
.pt-avatar{box-shadow:0 5px 16px rgba(23,26,52,.13), inset 0 0 0 3px var(--ring)}
.pt-comp{position:absolute;right:max(-8px, calc(50% - 88px));bottom:-12px;width:42px;height:42px;animation:bob 4.6s ease-in-out infinite}
.pt-comp{border-radius:50%;background:#FFFFFF;box-shadow:0 2px 8px rgba(23,26,52,.18);border:2px solid #FFFFFF}
.pt-comp svg{width:100%;height:100%;display:block}
.pt-star{position:absolute;left:max(-4px, calc(50% - 84px));top:-6px;width:26px;height:26px;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(23,26,52,.25));z-index:2}
.pt-name{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pt-status{font-size:12px;color:var(--muted);margin-top:2px;min-height:17px;line-height:17px}
.ptile.all-done .pt-status{color:var(--ok);font-weight:650}
.pt-bar{width:100%;margin-top:10px}
.pt-bar .bar{height:7px}
.pt-bar .bar > i{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 45%,#FFFFFF))}
.pt-meta{width:100%;min-width:0;margin-top:9px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:58px}
.pt-next{font-size:11.5px;color:var(--ink-2);line-height:1.28;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;min-height:30px}
.pt-coins{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:750;color:#7E5A11;background:var(--gold-soft);padding:2px 9px 2px 3px;border-radius:999px;min-height:22px}
.pt-coins svg{width:17px;height:17px}
.pt-coins.ghost{background:none;box-shadow:none}
.pt-lock{position:absolute;left:8px;bottom:8px;z-index:2;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;background:#FFFFFF;color:var(--warn);box-shadow:0 2px 6px rgba(23,26,52,.18)}
.pt-lock svg{width:14px;height:14px}

/* ---------- Medienzeit ---------- */
.media-visual{display:flex;align-items:center;gap:16px}
.media-visual .device{width:78px;height:78px;flex:none}
.media-visual .mv-body{flex:1;min-width:0}
.locked-note{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:#FBF3E6;border:1px solid #F0E0C4}
.unlock-burst{animation:burst .8s ease-out}
@keyframes burst{0%{transform:scale(.9);filter:brightness(1)}35%{transform:scale(1.04);filter:brightness(1.15)}100%{transform:scale(1);filter:brightness(1)}}

/* ---------- Coins ---------- */
.coin-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 6px;border-radius:999px;background:linear-gradient(135deg,#FEF3DC,#FDE3AE);color:#7E5A11;font-weight:750;font-family:var(--font-display)}
.coin-badge svg{width:24px;height:24px}
.confetti{position:fixed;z-index:200;width:8px;height:12px;border-radius:2px;pointer-events:none;
  animation:conf .95s cubic-bezier(.12,.66,.36,1) forwards}
@keyframes conf{
  0%{transform:translate(0,0) rotate(0deg) scale(.5);opacity:0}
  12%{opacity:1;transform:translate(calc(var(--dx)*.35),calc(var(--dy)*-.35)) rotate(calc(var(--rot)*.3)) scale(1)}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.85);opacity:0}}
.coin-fly{position:fixed;z-index:200;pointer-events:none;animation:fly 1s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:1;transform:translate(0,-38px) scale(1.15)}100%{transform:translate(0,-92px) scale(.8);opacity:0}}

/* ---------- Missionen ---------- */
.mission{display:flex;gap:13px;align-items:flex-start;padding:15px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.mission .m-ico{width:44px;height:44px;flex:none}
.mission .m-body{flex:1;min-width:0}
.mission.claimed{background:var(--surface-2);border-style:dashed}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px);z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:11px 17px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--sh-2);animation:toastIn .28s cubic-bezier(.2,.9,.3,1.3);max-width:440px}
.toast.gold{background:var(--gold)}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ---------- Personenwechsler ---------- */
.who{display:flex;gap:9px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px 8px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line-2);min-width:78px;transition:all .18s}
.who button svg{width:46px;height:46px;border-radius:50%}
.who button b{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.who button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:var(--sh-1)}
.who button[aria-pressed="true"] b{color:var(--ink)}

/* ---------- Formulare (Admin) ---------- */
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input.f,select.f,textarea.f{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;min-height:46px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--brand);outline:none}
.form-row{display:grid;gap:12px;grid-template-columns:1fr}
.adm-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line-2)}
.adm-item .ai-body{flex:1 1 200px}
.adm-item:last-child{border-bottom:0}
.adm-item .ai-body{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--bg-2);flex:none}
.icon-btn svg{width:18px;height:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Stundenplan ---------- */
.tt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.tt{border-collapse:separate;border-spacing:6px;min-width:560px}
table.tt th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:left;padding:0 2px}
table.tt th span{display:none}
table.tt .tt-corner{width:96px}
table.tt .tt-row{width:96px;vertical-align:top}
table.tt .tt-row b{display:block;font-size:13px;color:var(--ink);font-family:var(--font-display);margin-bottom:4px}
table.tt .tt-row span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.tt-in.same{background:var(--brand-soft);border-color:#D9CDF7}
.tt-times{display:grid;grid-template-columns:1fr;gap:8px}
.tt-time-row{display:flex;align-items:center;gap:8px}
.tt-time-row b{width:34px;flex:none;font-size:13px;font-family:var(--font-display)}
.tt-t{flex:1;min-width:0;text-align:center;font-variant-numeric:tabular-nums;min-height:42px;padding:8px}
.tt-dash{color:var(--muted)}
@media (min-width:640px){ .tt-times{grid-template-columns:1fr 1fr} }
.tt-in{width:100%;min-width:88px;padding:10px 9px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);font-size:14px}
.tt-in:focus{border-color:var(--brand);outline:none;background:#fff}
.tt-in::placeholder{color:var(--line)}
@media (min-width:700px){ table.tt th span{display:inline} table.tt{min-width:660px} }

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:150;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:88dvh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(28px)}to{transform:translateY(0)}}
.modal h2{margin-bottom:14px}

/* ---------- Haus / Intervalle ---------- */
.chore-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line-2)}
.chore-row > div{flex:1 1 190px}
.chore-row:last-child{border-bottom:0}
.due-dot{width:9px;height:9px;border-radius:50%;flex:none}
.due-over{background:#C6493F}.due-today{background:var(--warn)}.due-soon{background:var(--gold)}.due-ok{background:#B9C7BE}

/* ---------- Wandmodus: größer, ruhiger, für Blicke aus zwei Metern ---------- */
html[data-wall="1"] .app{ transform:translate(var(--shift-x,0px), var(--shift-y,0px)); transition:transform 3s ease-in-out }
.nightscreen{
  position:fixed;inset:0;z-index:300;background:#000;display:none;
  align-items:center;justify-content:center;color:#3A3550;cursor:pointer;
}
.ns-in{text-align:center;transition:transform 4s ease-in-out}
.ns-in b{display:block;font-family:var(--font-display);font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ns-in span{display:block;font-size:15px;margin-top:8px;letter-spacing:.14em;text-transform:uppercase}
html[data-wall="1"]{ font-size:18px }
html[data-wall="1"] body{ font-size:17.5px }
html[data-wall="1"] .task{ min-height:66px }
html[data-wall="1"] .check{ width:34px;height:34px }
html[data-wall="1"] .btn{ min-height:52px;font-size:15.5px }
html[data-wall="1"] .btn.sm{ min-height:44px;font-size:14.5px }
html[data-wall="1"] .nav button{ min-height:66px;font-size:12.5px }
html[data-wall="1"] .nav button svg{ width:27px;height:27px }
html[data-wall="1"] .pt-name{ font-size:20px }
html[data-wall="1"] .t-title{ font-size:16.5px }
html[data-wall="1"] .mo-clock b{ font-size:34px }
html[data-wall="1"] .topbar .date b{ font-size:16px }
html[data-wall="1"] .wordmark{ font-size:20px }

/* ---------- Morgenbildschirm ---------- */
.card.morning{border:1.5px solid var(--line-2);background:linear-gradient(170deg,#FFFFFF,var(--surface-2))}
.card.morning[data-lvl="low"]{border-color:#F0C99A}
.card.morning[data-lvl="crit"]{border-color:#E4A49E;background:linear-gradient(170deg,#FFF6F5,#FFFFFF)}
.card.morning[data-lvl="ok"]{border-color:#A8DCC1;background:linear-gradient(170deg,#F1FAF5,#FFFFFF)}
.mo-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.mo-clock{flex:none;min-width:104px;text-align:center;padding:12px 10px;border-radius:18px;background:var(--bg-2)}
.mo-clock b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.05;letter-spacing:-.02em}
.mo-clock span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
[data-lvl="crit"] .mo-clock{background:#FBE4E1}
[data-lvl="crit"] .mo-clock b{color:#B4453F}
[data-lvl="low"]  .mo-clock{background:#FCEFDD}
[data-lvl="ok"]   .mo-clock{background:#E1F5EA}
[data-lvl="ok"]   .mo-clock b{color:#177A48}
.mo-time{height:4px;border-radius:999px;background:var(--bg-2);overflow:hidden;margin-top:6px}
.mo-time > i{display:block;height:100%;background:var(--muted);opacity:.5}
.mo-grid{display:grid;grid-template-columns:1fr;gap:8px}
.mo-step{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;text-align:left;
  background:var(--surface);border:1.5px solid var(--line-2);min-height:66px;transition:all .18s}
.mo-step:active{transform:scale(.98)}
.mo-ico{width:40px;height:40px;flex:none}
.mo-body{flex:1;min-width:0}
.mo-body b{display:block;font-size:15.5px;font-weight:650}
.mo-body span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.mo-check{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.mo-check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .25s ease .05s}
.mo-step.done{background:#F1FAF5;border-color:#A8DCC1}
.mo-step.done .mo-check{background:linear-gradient(135deg,var(--ok),var(--ok-2));border-color:var(--ok)}
.mo-step.done .mo-check svg{stroke-dashoffset:0}
.mo-step.done .mo-body b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.mo-step.late{border-color:#E4A49E;background:#FFF6F5}
.mo-step.late .mo-body span{color:#B4453F;font-weight:650}
.mo-step.soon{border-color:#F0C99A}
.mo-pack{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:14px;
  background:var(--brand-soft);color:var(--brand)}
.mo-pack .small{color:var(--ink-2)}
[data-mo-big] .mo-ico{width:56px;height:56px}
[data-mo-big] .mo-body b{font-size:19px}
[data-mo-big] .mo-step{min-height:86px;border-radius:20px}
[data-mo-big] .mo-clock b{font-size:32px}
.mo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.mo-mini{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 10px;
  border-radius:18px;background:var(--surface-2);border:1.5px solid var(--line-2);cursor:pointer}
.mo-mini[data-lvl="crit"]{border-color:#E4A49E;background:#FFF6F5}
.mo-mini[data-lvl="low"]{border-color:#F0C99A}
.mo-mini[data-lvl="ok"]{border-color:#A8DCC1;background:#F1FAF5}
.mo-mini-av{width:42px;height:42px}
.mo-mini-av svg{width:100%;height:100%;border-radius:50%}
.mo-mini b{font-size:13.5px;font-family:var(--font-display)}
@media (min-width:640px){ .mo-grid{grid-template-columns:1fr 1fr} }

/* ---------- Verantwortungsstufen ---------- */
.cap-wrap{display:flex;flex-wrap:wrap;gap:8px}
.cap-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 6px;border-radius:999px;
  background:var(--bg-2);font-size:12.5px;font-weight:650;color:var(--ink-2)}
.cap-chip svg{width:24px;height:24px;flex:none}
.cap-chip.done{background:#E1F5EA;color:#177A48}
.cap-chip.big{font-size:15px;padding:9px 17px 9px 8px}
.cap-chip.big svg{width:34px;height:34px}
.cap-chip.off{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.cap-next{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-m);
  background:var(--surface-2);border:1px solid var(--line-2)}
.cap-next.ready{background:var(--gold-soft);border-color:#F1DFB4}
.cn-ico{width:38px;height:38px;flex:none}

/* ---------- Zustandsanzeige ---------- */
.meter{height:9px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.meter > i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
[data-lvl="ok"]   .meter > i{background:linear-gradient(90deg,#1E8F58,#4ECB8B)}
[data-lvl="mid"]  .meter > i{background:linear-gradient(90deg,#C98A12,#F0C24A)}
[data-lvl="low"]  .meter > i{background:linear-gradient(90deg,#C4702A,#EFA35C)}
[data-lvl="crit"] .meter > i{background:linear-gradient(90deg,#B4453F,#E0796F)}
.cr-main{flex:1 1 190px;min-width:0}
.cr-pct{font-size:12.5px;font-weight:700;font-family:var(--font-display);color:var(--ink-2)}
[data-lvl="crit"] .cr-pct{color:#B4453F}
[data-lvl="low"]  .cr-pct{color:#B0651F}
.chore-row.is-done{opacity:.55}
.card.health{border:1px solid var(--line-2)}

/* ---------- Reward ---------- */
.reward{display:flex;gap:12px;align-items:center;padding:13px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.reward .r-ico{width:42px;height:42px;flex:none}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:14px}
.empty svg{width:64px;height:64px;opacity:.65;margin-bottom:8px}

/* ============================================================
   RESPONSIVE — eigene Layouts, kein Zusammenschieben
   ============================================================ */
@media (min-width:700px){
  :root{--pad:26px}
  .ptiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .emma-grid{grid-template-columns:repeat(3,1fr)}
  .emma-card{min-height:200px}
  .emma-card svg.illu{max-width:150px}
  .form-row{grid-template-columns:1fr 1fr}
  h1{font-size:31px}
}
/* Tablet: Familien-Dashboard an der Wand */
@media (min-width:900px){
  .nav{
    top:0;bottom:0;left:0;right:auto;width:104px;grid-template-columns:1fr;
    grid-auto-rows:min-content;align-content:start;gap:6px;
    border-top:0;border-right:1px solid var(--nav-line);
    padding:calc(env(safe-area-inset-top) + 88px) 10px 10px;
    background:linear-gradient(180deg,var(--nav-bg-2),var(--nav-bg));
  }
  .nav::before{
    content:"";position:absolute;top:calc(env(safe-area-inset-top) + 26px);left:50%;
    transform:translateX(-50%);width:38px;height:38px;border-radius:12px;
    background:var(--nav-pill);
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M28 68V34l22 20 22-20v34' fill='none' stroke='black' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><circle cx='50' cy='76' r='6' fill='black'/></svg>") center/24px no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M28 68V34l22 20 22-20v34' fill='none' stroke='black' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><circle cx='50' cy='76' r='6' fill='black'/></svg>") center/24px no-repeat;
  }
  html[data-nav="dark"] .nav::before{background:#FFFFFF}
  .nav button{min-height:66px;font-size:11.5px}
  .nav button svg{width:25px;height:25px}
  .app{padding-left:104px}
  .topbar{padding-left:calc(104px + var(--pad));margin-left:-104px}
  .topbar .wordmark{display:none}
  .main{padding-bottom:44px}
  .ptiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
  .pt-avatar{max-width:170px}
  .pt-comp{width:48px;height:48px;bottom:-14px}
  .pt-name{font-size:19px}
  .hl-card{column-count:2;column-gap:28px}
  .hl-card > div{break-inside:avoid}
  .two-col{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
  .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  .modal-bg{align-items:center}
  .modal{border-radius:26px;max-height:82dvh}
  .toast-wrap{bottom:24px;left:104px}
}
@media (min-width:1200px){
  .emma-grid{grid-template-columns:repeat(4,1fr)}
  .four-col{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
}
.hide-mob{display:none}
@media (min-width:900px){.hide-mob{display:block}.only-mob{display:none}}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <button class="wordmark" id="wordmark" data-a="logoTap" aria-label="Nestwerk"><span class="dot" id="mark"></span> Nestwerk</button>
      <button class="wx" id="wxBox" data-a="wxRefresh" style="display:none" title="Wetter aktualisieren"></button>
      <span class="sync-dot" id="syncDot" style="display:none" aria-hidden="true"></span>
      <div class="date"><b id="dateB"></b><span id="dateS"></span></div>
    </div>
  </header>
  <main class="main" id="view"></main>
</div>
<nav class="nav" id="nav"></nav>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="avclip" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
</defs></svg>
<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ============================================================================
   NESTWERK — Family OS
   Schichten:  Store (Daten) → Engine (reine Logik) → Actions → UI
   Kein Framework, keine externen Abhängigkeiten, offline lauffähig.
   ========================================================================== */

/* ==========================================================================
   0) Hilfsfunktionen — Datum & Zeit
   ========================================================================== */
const T = {
  key(d){ const x=d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); },
  parse(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); },
  addDays(k,n){ const d=T.parse(k); d.setDate(d.getDate()+n); return T.key(d); },
  diffDays(a,b){ return Math.round((T.parse(a)-T.parse(b))/86400000); },
  dow(k){ const n=T.parse(k).getDay(); return n===0?7:n; },            // Mo=1 … So=7
  min(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; },
  hhmm(mins){ mins=Math.max(0,Math.round(mins)); return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0"); },
  dayName(k){ return ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"][T.dow(k)-1]; },
  dayShort(k){ return ["Mo","Di","Mi","Do","Fr","Sa","So"][T.dow(k)-1]; },
  long(k){ const d=T.parse(k); return d.getDate()+". "+["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]; },
  nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
};
const uid = p => (p||"id")+"_"+Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ==========================================================================
   1) SEED — alle Familiendaten als Daten, nicht als Code.
      Alles hier ist im Admin-Bereich änderbar.
   ========================================================================== */
function defaultDB(){
  const today = T.key(new Date());
  const back = n => T.addDays(today,-n);
  return {
  meta:{ version:1, created:today, abAnchor:"2026-01-05", abAnchorWeek:"A" },

  settings:{
    hannahHasKey:false,
    hannahCareEarliest:"13:45",
    hannahCareLatest:"15:00",
    emmaPickupTarget:"14:30",
    emmaPickupLatest:"15:00",
    emmaKitaTravel:10,
    emmaBedStart:"19:15",
    kitchenStart:"19:45",
    shopping:{ day:1, start:"15:15", minutes:60 },  // Montag, weil nachmittags nichts ansteht
    weekResetDay:4,                                  // Donnerstag: Vorbereitung auf Freitag
    navTheme:"dark",
    morning:{ from:"06:30", to:"08:15", leave:"07:30" },   /* Aufstehen bis Türschluss */
    weather:{ name:"Rödermark", lat:49.9833, lon:8.8333 }
  },

/* ==========================================================================
   2) OPS — jede Änderung ist eine kleine, beschreibbare Aktion.
      Nur so lassen sich Änderungen von fünf Geräten sauber zusammenführen:
      es wird nicht der ganze Datenstand überschrieben, sondern nur die Aktion
      übertragen und auf jedem Gerät erneut angewendet.
   ========================================================================== */
const Ops = (function(){
  function dayOf(db, k){
    if(!db.state.log[k]) db.state.log[k] = { basics:{}, chores:{}, missions:{}, media:{}, assign:{}, morning:{}, eveningSwap:false };
    const d = db.state.log[k];
    ["basics","chores","missions","media","assign","morning"].forEach(x=>{ if(!d[x]) d[x]={}; });
    return d;
  }
  const H = {
    "basic.set"(db,op){ dayOf(db,op.date).basics[op.id] = op.value; },

    "chore.set"(db,op){
      const day = dayOf(db,op.date);
      day.chores[op.id] = op.value;
      const c = db.chores.find(x=>x.id===op.id); if(!c) return;
      const who = op.who || day.assign[op.id];
      if(c.cap && who && who!=="*"){                       /* Fortschritt der Befähigung */
        const per = db.people.find(x=>x.id===who);
        if(per && per.role==="child"){
          const cc = (db.state.capCount = db.state.capCount||{});
          const m  = (cc[who] = cc[who]||{});
          m[c.cap] = Math.max(0, (m[c.cap]||0) + (op.value? 1 : -1));
        }
      }
      if(op.value){
        c.lastDone = op.date;
        if(who && who!=="*" && db.state.choreHistory[who]!=null) db.state.choreHistory[who] += (c.effort||1);
      }else{
        c.lastDone = T.addDays(op.date, -(c.interval||1));
        if(who && who!=="*" && db.state.choreHistory[who]!=null) db.state.choreHistory[who] = Math.max(0, db.state.choreHistory[who]-(c.effort||1));
      }
    },
    "assign.set"(db,op){ const d = dayOf(db,op.date); d.assign = Object.assign({}, op.map, d.assign||{}); },

    "mission.claim"(db,op){ const m = db.missions.find(x=>x.id===op.id); if(m && m.status==="open"){ m.status="claimed"; m.by=op.by; m.claimedAt=op.date; } },
    "mission.return"(db,op){ const m = db.missions.find(x=>x.id===op.id); if(m && m.status==="claimed"){ m.status="open"; m.by=null; } },
    "mission.done"(db,op){
      const m = db.missions.find(x=>x.id===op.id); if(!m || m.status!=="claimed") return;
      m.status="done"; m.doneAt=op.date;
      if(db.state.coins[m.by]!=null) db.state.coins[m.by] += m.coins;
      db.teamGoal.progress = Math.min(db.teamGoal.target, db.teamGoal.progress + Math.round(m.coins/2));
      dayOf(db,op.date).missions[m.id] = true;
    },
    "mission.undo"(db,op){
      const m = db.missions.find(x=>x.id===op.id); if(!m || m.status!=="done") return;
      if(db.state.coins[m.by]!=null) db.state.coins[m.by] = Math.max(0, db.state.coins[m.by]-m.coins);
      m.status="claimed";
    },
    "reward.redeem"(db,op){
      const r = db.rewards.find(x=>x.id===op.rid); if(!r) return;
      if(db.state.redemptions.some(x=>x.id===op.rdId)) return;          /* schon angewendet */
      if((db.state.coins[op.pid]||0) < r.cost) return;
      db.state.coins[op.pid] -= r.cost;
      db.state.redemptions.unshift({ id:op.rdId, reward:r.id, title:r.title, person:op.pid, cost:r.cost, date:op.date, used:false });
    },
    "redemption.used"(db,op){ const r = db.state.redemptions.find(x=>x.id===op.id); if(r) r.used = op.value; },

    "media.add"(db,op){ const d = dayOf(db,op.date); (d.media[op.pid] = d.media[op.pid]||[]);
      if(!d.media[op.pid].some(e=>e.id===op.entryId)) d.media[op.pid].push({ id:op.entryId, min:op.min, at:op.at }); },
    "media.remove"(db,op){ const d = dayOf(db,op.date); if(d.media[op.pid]) d.media[op.pid] = d.media[op.pid].filter((e,i)=> (e.id||String(i)) !== op.entryId); },

    "evening.swap"(db,op){ dayOf(db,op.date).eveningSwap = op.value; },

    "coll.upsert"(db,op){ const l = db[op.coll]; if(!l) return;
      const i = l.findIndex(x=>x.id===op.obj.id); if(i>=0) l[i] = Object.assign({}, l[i], op.obj); else l.push(op.obj); },
    "coll.remove"(db,op){ if(db[op.coll]) db[op.coll] = db[op.coll].filter(x=>x.id!==op.id); },
    "settings.patch"(db,op){ Object.assign(db.settings, op.patch); },
    "meta.patch"(db,op){ Object.assign(db.meta, op.patch); },
    "tt.subject"(db,op){
      const tt = (db.timetables = db.timetables||{});
      const t  = (tt[op.pid] = tt[op.pid] || { ab:false, A:{} });
      const wk = (t[op.week] = t[op.week] || {});
      const row = (wk[op.day] = wk[op.day] || []);
      while(row.length <= op.idx) row.push(null);
      row[op.idx] = op.value || null;
    },
    "tt.blocks"(db,op){
      const tt = (db.timetables = db.timetables||{});
      const t  = (tt[op.pid] = tt[op.pid] || { ab:false, A:{} });
      t.blocks = op.blocks;
    },
    "tt.mode"(db,op){
      const tt = (db.timetables = db.timetables||{});
      const t  = (tt[op.pid] = tt[op.pid] || { ab:false, A:{} });
      t.ab = !!op.ab;
      if(t.ab && !t.B) t.B = JSON.parse(JSON.stringify(t.A||{}));
    },
    "morning.set"(db,op){
      const day = dayOf(db, op.date);
      const m = (day.morning = day.morning||{});
      const per = (m[op.pid] = m[op.pid]||{});
      per[op.id] = op.value;
    },
    "cap.set"(db,op){
      const p = db.people.find(x=>x.id===op.pid); if(!p) return;
      const list = p.skills = p.skills || [];
      const i = list.indexOf(op.cap);
      if(op.on && i<0) list.push(op.cap);
      if(!op.on && i>=0) list.splice(i,1);
    },
    "coins.set"(db,op){ if(db.state.coins[op.pid]!=null) db.state.coins[op.pid] = Math.max(0, op.n|0); }
  };
  function apply(db, op){
    const h = H[op.kind];
    if(!h){ console.warn("Unbekannte Aktion übersprungen:", op.kind); return; }
    h(db, op);
  }
  return { apply, dayOf, kinds:Object.keys(H) };
})();

/* ==========================================================================
   3) STORE — lokaler Datenstand + Aktionsprotokoll.
      Ohne Sync verhält er sich genau wie vorher (alles im LocalStorage).
   ========================================================================== */
const Store = (function(){
  const KEY = "nestwerk.family.v2", KEY_OLD = "nestwerk.family.v1";
  let db = null, queue = [], lastSeq = 0, bootstrapSeq = 0, seen = {};
  const subs = [];

  function load(){
    let saved = null;
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) saved = JSON.parse(raw);
      else { const old = localStorage.getItem(KEY_OLD); if(old) saved = { db: JSON.parse(old) }; }
    }catch(e){ console.warn("Gespeicherte Daten unlesbar, starte neu.", e); }

    const base = defaultDB();
    if(saved) migrateSinglePeriods(saved, base);                    /* Doppelblöcke → Einzelstunden */
    if(saved && saved.henryTimetable && !saved.timetables){        /* Umstieg auf Pläne je Kind */
      saved.timetables = Object.assign({}, base.timetables,
        { henry: Object.assign({ ab:true }, saved.henryTimetable) });
      delete saved.henryTimetable;
    }
    db = saved && saved.db ? merge(base, saved.db) : base;
    queue = ((saved && saved.queue) || []).map(o=> o.opId ? o : Object.assign({}, o, { opId: uid("op") }));
    lastSeq = (saved && saved.lastSeq) || 0;
    bootstrapSeq = (saved && saved.bootstrapSeq) || 0;
    seen = {}; ((saved && saved.seen) || []).forEach(id=> seen[id]=1);
    return db;
  }
  /* Ältere Stände kannten nur Doppelblöcke ("1./2."). Sie werden in zwei
     Einzelstunden mit demselben Fach aufgeteilt, damit nichts verloren geht. */
  const isDouble = b => /^\s*\d+\.\s*\/\s*\d+\./.test(String((b && b.label) || ""));
  function splitBlocks(blocks){
    const out = [];
    blocks.forEach(b=>{
      if(!isDouble(b)){ out.push(Object.assign({}, b)); return; }
      const nums = String(b.label).match(/\d+/g) || ["",""];
      const a0 = T.min(b.start), b0 = T.min(b.end), mid = a0 + Math.round((b0-a0)/2);
      out.push({ id:(b.id||"b")+"_1", label:nums[0]+".", start:b.start, end:T.hhmm(mid) });
      out.push({ id:(b.id||"b")+"_2", label:nums[1]+".", start:T.hhmm(mid), end:b.end });
    });
    return out;
  }
  function splitRow(row, blocks){
    const out = [];
    blocks.forEach((b,i)=>{ const v = (row && row[i]!=null) ? row[i] : null;
      out.push(v); if(isDouble(b)) out.push(v); });
    return out;
  }
  function migrateSinglePeriods(saved, base){
    try{
      const globalOld = (saved.schoolBlocks && saved.schoolBlocks.length) ? saved.schoolBlocks : base.schoolBlocks;
      const tts = saved.timetables;
      if(tts) Object.keys(tts).forEach(pid=>{
        const tt = tts[pid]; if(!tt) return;
        const old = (tt.blocks && tt.blocks.length) ? tt.blocks : globalOld;
        if(!old.some(isDouble)) return;
        ["A","B"].forEach(w=>{
          if(!tt[w]) return;
          Object.keys(tt[w]).forEach(d=>{ tt[w][d] = splitRow(tt[w][d], old); });
        });
        if(tt.blocks && tt.blocks.length) tt.blocks = splitBlocks(tt.blocks);
      });
      if(saved.schoolBlocks && saved.schoolBlocks.some(isDouble))
        saved.schoolBlocks = splitBlocks(saved.schoolBlocks);
    }catch(e){ console.warn("Stundenplan-Umstellung übersprungen:", e && e.message); }
  }
  function merge(base, saved){
    const out = JSON.parse(JSON.stringify(base));
    Object.keys(saved).forEach(k=>{
      if(k==="meta"){ out.meta = Object.assign({}, base.meta, saved.meta); return; }
      if(Array.isArray(saved[k]) || typeof saved[k]!=="object" || saved[k]===null){ out[k] = saved[k]; return; }
      out[k] = Object.assign({}, base[k]||{}, saved[k]);
    });
    if(saved.state) out.state = Object.assign({}, base.state, saved.state);
    return out;
  }
  function save(){
    try{
      const ids = Object.keys(seen); const keep = ids.length>2000 ? ids.slice(-2000) : ids;
      localStorage.setItem(KEY, JSON.stringify({ version:2, db, queue, lastSeq, bootstrapSeq, seen:keep }));
    }catch(e){
      console.error("Speichern fehlgeschlagen", e);
      if(typeof UI!=="undefined") UI.toast("Speicher voll — bitte exportieren und zurücksetzen.");
    }
  }
  function notify(src){ subs.forEach(f=>{ try{ f(src); }catch(e){ console.error(e); } }); }

  /* Die einzige Mutationsstelle: eine Aktion anwenden, sichern, verteilen. */
  function dispatch(part){
    /* opId zuletzt setzen: Nutzlasten enthalten oft ein eigenes "id"-Feld
       (Missions-ID, Chore-ID …) und dürfen die Identität der Aktion nicht überschreiben. */
    const op = Object.assign({}, part, { opId: uid("op"), ts: Date.now(),
                               actor: (typeof Sync!=="undefined" ? Sync.actorName() : "lokal") });
    try{ Ops.apply(db, op); }
    catch(e){ console.error("Aktion fehlgeschlagen", e); if(typeof UI!=="undefined") UI.toast("Das hat nicht geklappt."); return null; }
    seen[op.opId] = 1; queue.push(op);
    save(); notify();
    if(typeof Sync!=="undefined") Sync.nudge();
    return op;
  }
  /* Aktion von einem anderen Gerät */
  function applyRemote(op){
    if(!op || !op.opId || seen[op.opId]) return false;
    try{ Ops.apply(db, op); }catch(e){ console.error("Fremde Aktion fehlgeschlagen", e); }
    seen[op.opId] = 1; return true;
  }
  function replaceDB(next){ db = merge(defaultDB(), next); }

  function get(){ return db; }
  function subscribe(fn){ subs.push(fn); }
  function pending(){ return queue.slice(); }
  function clearPending(ids){ const s={}; ids.forEach(i=>s[i]=1); queue = queue.filter(o=>!s[o.opId]); }
  function seq(){ return lastSeq; }
  function setSeq(n){ lastSeq = Math.max(lastSeq, n||0); }
  function bootSeq(){ return bootstrapSeq; }
  function setBootSeq(n){ bootstrapSeq = n||0; }

  function reset(){
    localStorage.removeItem(KEY); localStorage.removeItem(KEY_OLD);
    db = defaultDB(); queue = []; lastSeq = 0; bootstrapSeq = 0; seen = {};
    save(); notify();
  }
  function importJSON(text){
    const parsed = JSON.parse(text);
    const payload = parsed && parsed.db ? parsed.db : parsed;
    if(!payload || !payload.people) throw new Error("Keine gültige Nestwerk-Sicherung.");
    migrateSinglePeriods(payload, defaultDB());        /* auch Sicherungen älterer Fassungen */
    replaceDB(payload); queue = []; save(); notify();
  }
  function exportJSON(){ return JSON.stringify(db, null, 2); }

  function day(dateKey){ return Ops.dayOf(db, dateKey); }
  function dayRead(dateKey){
    return db.state.log[dateKey] || { basics:{}, chores:{}, missions:{}, media:{}, assign:{}, morning:{}, eveningSwap:false };
  }
  return { load, save, get, subscribe, dispatch, applyRemote, replaceDB, notify,
           pending, clearPending, seq, setSeq, bootSeq, setBootSeq,
           reset, importJSON, exportJSON, day, dayRead };
})();
