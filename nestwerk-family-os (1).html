<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F1">
<title>Nestwerk — Family OS</title>
<style>
/* ============================================================
   NESTWERK — Design Tokens
   Palette: Salbei-Weiss / Tiefgruen / Personenfarben als Kante
   ============================================================ */
:root{
  --bg:#F1F4F1;
  --bg-2:#E8EDE8;
  --surface:#FFFFFF;
  --surface-2:#FAFBFA;
  --ink:#1E2622;
  --ink-2:#48544D;
  --muted:#7C8A82;
  --line:#DFE6DF;
  --line-2:#EDF1EC;
  --brand:#2F5D50;
  --brand-soft:#E4EEE9;
  --gold:#C9922F;
  --gold-soft:#FAF0DC;
  --ok:#3C7D5E;
  --warn:#B5762A;
  --p-henry:#33739B;
  --p-hannah:#7A57A3;
  --p-emma:#D98A33;
  --p-mama:#B04C77;
  --p-papa:#2F6F62;
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --sh-1:0 1px 2px rgba(30,38,34,.05), 0 4px 14px rgba(30,38,34,.05);
  --sh-2:0 2px 6px rgba(30,38,34,.07), 0 14px 34px rgba(30,38,34,.09);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --nav-h:76px;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  overflow-wrap:anywhere;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);letter-spacing:-.02em;font-weight:650}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- App-Gerüst ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.main{flex:1;padding:0 var(--pad) calc(var(--nav-h) + 40px);max-width:1400px;width:100%;margin:0 auto}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
}
.topbar-in{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;letter-spacing:-.03em;font-size:19px}
.wordmark .dot{width:26px;height:26px;flex:none}
.topbar .date{text-align:right;line-height:1.15}
.sync-dot{margin-left:auto;width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.sync-dot.s-ok{background:#4C8579}
.sync-dot.s-busy{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.sync-dot.s-error{background:#C6493F}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.topbar .date b{display:block;font-size:14px;font-family:var(--font-display)}
.topbar .date span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* ---------- Navigation ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.5) blur(18px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;border-radius:14px;color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.01em;min-height:56px;justify-content:center;
  transition:color .15s,background .15s;
}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}

/* ---------- Karten ---------- */
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh-1);padding:18px;border:1px solid var(--line-2)}
.card.tight{padding:14px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.lg{gap:22px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.section-h{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.section-h h2{flex:none}
.section-h .hint{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.grid{display:grid;gap:14px}

/* ---------- Chips / Badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg-2);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.gold{background:var(--gold-soft);color:#8A6314}
.chip.warn{background:#FBEEE0;color:var(--warn)}
.chip.ok{background:#E3F1E8;color:var(--ok)}
.pill-person{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--bg-2);font-size:13px;font-weight:650}
.pill-person svg{width:26px;height:26px;border-radius:999px;flex:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--brand);color:#fff;font-weight:650;font-size:14.5px;min-height:46px;transition:transform .12s,filter .15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:#FBEDEE;color:#A33A46;border-color:#F3D8DB}
.btn.sm{padding:8px 13px;min-height:38px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn svg{width:17px;height:17px}

/* ---------- Aufgaben-Zeile mit Checkbox ---------- */
.task{display:flex;align-items:center;gap:13px;padding:11px 4px;border-bottom:1px solid var(--line-2);min-height:56px}
.task:last-child{border-bottom:0}
.check{
  width:30px;height:30px;flex:none;border-radius:10px;border:2px solid var(--line);
  background:var(--surface);display:grid;place-items:center;transition:all .18s cubic-bezier(.2,.9,.3,1.4);
}
.check svg{width:17px;height:17px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .25s ease .05s}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{stroke-dashoffset:0}
.task.done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--line)}
.task .t-body{flex:1;min-width:0}
.t-title{font-size:15px;font-weight:600;line-height:1.3}
.t-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.t-ico{width:34px;height:34px;flex:none}
.task.pop .check{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ---------- Fortschritt ---------- */
.bar{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar.thick{height:16px}
.bar.gold > i{background:var(--gold)}

/* ---------- Personen-Akzent ---------- */
.accent{border-left:5px solid var(--acc,var(--brand))}
.hero-person{position:relative;overflow:hidden;padding:20px;border-radius:var(--r-xl);background:linear-gradient(160deg,var(--acc-soft,#EEF3F0),var(--surface) 62%);border:1px solid var(--line-2)}
.hero-person .figs{display:flex;align-items:flex-end;gap:6px}
.hero-person .avatar{width:88px;height:88px;flex:none}
.hero-person .comp{width:56px;height:56px;flex:none;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- Tagesband (Signature) ---------- */
.band{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--line-2);box-shadow:var(--sh-1);overflow:hidden}
.band-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.band-inner{min-width:760px;position:relative}
.band-hours{display:flex;padding-left:96px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:2}
.band-hours span{flex:1;font-size:10.5px;color:var(--muted);font-weight:650;padding:7px 0 6px 5px;border-left:1px solid var(--line-2)}
.lane{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2);min-height:62px}
.lane:last-child{border-bottom:0}
.lane-head{width:96px;flex:none;display:flex;align-items:center;gap:7px;padding:8px 8px 8px 12px;background:var(--surface-2);border-right:1px solid var(--line-2);position:sticky;left:0;z-index:1}
.lane-head svg{width:30px;height:30px;flex:none}
.lane-head b{font-size:12.5px;font-weight:650}
.lane-track{flex:1;position:relative;padding:9px 0}
.lane-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.lane-grid i{flex:1;border-left:1px solid var(--line-2)}
.ev{
  position:absolute;top:9px;height:44px;border-radius:11px;padding:6px 9px;
  background:var(--ev-bg,#EEF2F0);border-left:3px solid var(--ev-c,var(--brand));
  overflow:hidden;box-shadow:0 1px 2px rgba(30,38,34,.05)
}
.ev b{display:block;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ev span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.ev.travel{background:repeating-linear-gradient(135deg,#F3F5F3,#F3F5F3 5px,#E9EDE9 5px,#E9EDE9 10px);border-left-style:dashed;height:22px;top:20px}
.ev.travel b{font-size:10px;color:var(--ink-2)}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:#C6493F;z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:#C6493F}

/* ---------- Emma-Modus ---------- */
.emma-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.emma-card{
  position:relative;border-radius:26px;background:var(--surface);border:2px solid var(--line-2);
  box-shadow:var(--sh-1);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  min-height:168px;justify-content:center;transition:transform .16s,border-color .2s,background .2s;
}
.emma-card svg.illu{width:100%;max-width:132px;height:auto;aspect-ratio:1;pointer-events:none}
.emma-card .lbl{font-family:var(--font-display);font-size:16px;font-weight:700}
.emma-card:active{transform:scale(.96)}
.emma-card.done{background:#EAF4EE;border-color:#9FCBB2}
.emma-card .tick{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;background:var(--ok);display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.2,.9,.3,1.6)}
.emma-card.done .tick{transform:scale(1)}
.emma-card .tick svg{width:19px;height:19px;stroke:#fff;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.emma-card.done svg.illu{filter:saturate(.85)}

/* ---------- Medienzeit ---------- */
.media-visual{display:flex;align-items:center;gap:16px}
.media-visual .device{width:78px;height:78px;flex:none}
.media-visual .mv-body{flex:1;min-width:0}
.locked-note{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:#FBF3E6;border:1px solid #F0E0C4}
.unlock-burst{animation:burst .8s ease-out}
@keyframes burst{0%{transform:scale(.9);filter:brightness(1)}35%{transform:scale(1.04);filter:brightness(1.15)}100%{transform:scale(1);filter:brightness(1)}}

/* ---------- Coins ---------- */
.coin-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--gold-soft);color:#7E5A11;font-weight:750;font-family:var(--font-display)}
.coin-badge svg{width:24px;height:24px}
.coin-fly{position:fixed;z-index:200;pointer-events:none;animation:fly 1s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:1;transform:translate(0,-38px) scale(1.15)}100%{transform:translate(0,-92px) scale(.8);opacity:0}}

/* ---------- Missionen ---------- */
.mission{display:flex;gap:13px;align-items:flex-start;padding:15px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.mission .m-ico{width:44px;height:44px;flex:none}
.mission .m-body{flex:1;min-width:0}
.mission.claimed{background:var(--surface-2);border-style:dashed}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px);z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:11px 17px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--sh-2);animation:toastIn .28s cubic-bezier(.2,.9,.3,1.3);max-width:440px}
.toast.gold{background:var(--gold)}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ---------- Personenwechsler ---------- */
.who{display:flex;gap:9px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px 8px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line-2);min-width:78px;transition:all .18s}
.who button svg{width:46px;height:46px}
.who button b{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.who button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:var(--sh-1)}
.who button[aria-pressed="true"] b{color:var(--ink)}

/* ---------- Formulare (Admin) ---------- */
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input.f,select.f,textarea.f{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;min-height:46px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--brand);outline:none}
.form-row{display:grid;gap:12px;grid-template-columns:1fr}
.adm-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line-2)}
.adm-item .ai-body{flex:1 1 200px}
.adm-item:last-child{border-bottom:0}
.adm-item .ai-body{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--bg-2);flex:none}
.icon-btn svg{width:18px;height:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:150;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:88dvh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(28px)}to{transform:translateY(0)}}
.modal h2{margin-bottom:14px}

/* ---------- Haus / Intervalle ---------- */
.chore-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line-2)}
.chore-row > div{flex:1 1 190px}
.chore-row:last-child{border-bottom:0}
.due-dot{width:9px;height:9px;border-radius:50%;flex:none}
.due-over{background:#C6493F}.due-today{background:var(--warn)}.due-soon{background:var(--gold)}.due-ok{background:#B9C7BE}

/* ---------- Reward ---------- */
.reward{display:flex;gap:12px;align-items:center;padding:13px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.reward .r-ico{width:42px;height:42px;flex:none}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:14px}
.empty svg{width:64px;height:64px;opacity:.65;margin-bottom:8px}

/* ============================================================
   RESPONSIVE — eigene Layouts, kein Zusammenschieben
   ============================================================ */
@media (min-width:700px){
  :root{--pad:26px}
  .emma-grid{grid-template-columns:repeat(3,1fr)}
  .emma-card{min-height:200px}
  .emma-card svg.illu{max-width:150px}
  .form-row{grid-template-columns:1fr 1fr}
  h1{font-size:31px}
}
/* Tablet: Familien-Dashboard an der Wand */
@media (min-width:900px){
  .nav{
    top:0;bottom:0;left:0;right:auto;width:104px;grid-template-columns:1fr;
    grid-auto-rows:min-content;align-content:start;gap:6px;
    border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top) + 96px)
  }
  .nav button{min-height:66px;font-size:11.5px}
  .nav button svg{width:25px;height:25px}
  .app{padding-left:104px}
  .topbar{padding-left:calc(104px + var(--pad));margin-left:-104px}
  .main{padding-bottom:44px}
  .two-col{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
  .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  .modal-bg{align-items:center}
  .modal{border-radius:26px;max-height:82dvh}
  .toast-wrap{bottom:24px;left:104px}
}
@media (min-width:1200px){
  .emma-grid{grid-template-columns:repeat(4,1fr)}
  .four-col{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
}
.hide-mob{display:none}
@media (min-width:900px){.hide-mob{display:block}.only-mob{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <div class="wordmark"><span class="dot" id="mark"></span> Nestwerk</div>
      <span class="sync-dot" id="syncDot" style="display:none" aria-hidden="true"></span>
      <div class="date"><b id="dateB"></b><span id="dateS"></span></div>
    </div>
  </header>
  <main class="main" id="view"></main>
</div>
<nav class="nav" id="nav"></nav>
<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ============================================================================
   NESTWERK — Family OS
   Schichten:  Store (Daten) → Engine (reine Logik) → Actions → UI
   Kein Framework, keine externen Abhängigkeiten, offline lauffähig.
   ========================================================================== */

/* ==========================================================================
   0) Hilfsfunktionen — Datum & Zeit
   ========================================================================== */
const T = {
  key(d){ const x=d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); },
  parse(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); },
  addDays(k,n){ const d=T.parse(k); d.setDate(d.getDate()+n); return T.key(d); },
  diffDays(a,b){ return Math.round((T.parse(a)-T.parse(b))/86400000); },
  dow(k){ const n=T.parse(k).getDay(); return n===0?7:n; },            // Mo=1 … So=7
  min(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; },
  hhmm(mins){ mins=Math.max(0,Math.round(mins)); return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0"); },
  dayName(k){ return ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"][T.dow(k)-1]; },
  dayShort(k){ return ["Mo","Di","Mi","Do","Fr","Sa","So"][T.dow(k)-1]; },
  long(k){ const d=T.parse(k); return d.getDate()+". "+["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]; },
  nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
};
const uid = p => (p||"id")+"_"+Math.random().toString(36).slice(2,9);

/* ==========================================================================
   2) OPS — jede Änderung ist eine kleine, beschreibbare Aktion.
      Nur so lassen sich Änderungen von fünf Geräten sauber zusammenführen:
      es wird nicht der ganze Datenstand überschrieben, sondern nur die Aktion
      übertragen und auf jedem Gerät erneut angewendet.
   ========================================================================== */
const Ops = (function(){
  function dayOf(db, k){
    if(!db.state.log[k]) db.state.log[k] = { basics:{}, chores:{}, missions:{}, media:{}, assign:{}, eveningSwap:false };
    const d = db.state.log[k];
    ["basics","chores","missions","media","assign"].forEach(x=>{ if(!d[x]) d[x]={}; });
    return d;
  }
  const H = {
    "basic.set"(db,op){ dayOf(db,op.date).basics[op.id] = op.value; },

    "chore.set"(db,op){
      const day = dayOf(db,op.date);
      day.chores[op.id] = op.value;
      const c = db.chores.find(x=>x.id===op.id); if(!c) return;
      const who = op.who || day.assign[op.id];
      if(op.value){
        c.lastDone = op.date;
        if(who && who!=="*" && db.state.choreHistory[who]!=null) db.state.choreHistory[who] += (c.effort||1);
      }else{
        c.lastDone = T.addDays(op.date, -(c.interval||1));
        if(who && who!=="*" && db.state.choreHistory[who]!=null) db.state.choreHistory[who] = Math.max(0, db.state.choreHistory[who]-(c.effort||1));
      }
    },
    "assign.set"(db,op){ const d = dayOf(db,op.date); d.assign = Object.assign({}, op.map, d.assign||{}); },

    "mission.claim"(db,op){ const m = db.missions.find(x=>x.id===op.id); if(m && m.status==="open"){ m.status="claimed"; m.by=op.by; m.claimedAt=op.date; } },
    "mission.return"(db,op){ const m = db.missions.find(x=>x.id===op.id); if(m && m.status==="claimed"){ m.status="open"; m.by=null; } },
    "mission.done"(db,op){
      const m = db.missions.find(x=>x.id===op.id); if(!m || m.status!=="claimed") return;
      m.status="done"; m.doneAt=op.date;
      if(db.state.coins[m.by]!=null) db.state.coins[m.by] += m.coins;
      db.teamGoal.progress = Math.min(db.teamGoal.target, db.teamGoal.progress + Math.round(m.coins/2));
      dayOf(db,op.date).missions[m.id] = true;
    },
    "mission.undo"(db,op){
      const m = db.missions.find(x=>x.id===op.id); if(!m || m.status!=="done") return;
      if(db.state.coins[m.by]!=null) db.state.coins[m.by] = Math.max(0, db.state.coins[m.by]-m.coins);
      m.status="claimed";
    },
    "reward.redeem"(db,op){
      const r = db.rewards.find(x=>x.id===op.rid); if(!r) return;
      if(db.state.redemptions.some(x=>x.id===op.rdId)) return;          /* schon angewendet */
      if((db.state.coins[op.pid]||0) < r.cost) return;
      db.state.coins[op.pid] -= r.cost;
      db.state.redemptions.unshift({ id:op.rdId, reward:r.id, title:r.title, person:op.pid, cost:r.cost, date:op.date, used:false });
    },
    "redemption.used"(db,op){ const r = db.state.redemptions.find(x=>x.id===op.id); if(r) r.used = op.value; },

    "media.add"(db,op){ const d = dayOf(db,op.date); (d.media[op.pid] = d.media[op.pid]||[]);
      if(!d.media[op.pid].some(e=>e.id===op.entryId)) d.media[op.pid].push({ id:op.entryId, min:op.min, at:op.at }); },
    "media.remove"(db,op){ const d = dayOf(db,op.date); if(d.media[op.pid]) d.media[op.pid] = d.media[op.pid].filter((e,i)=> (e.id||String(i)) !== op.entryId); },

    "evening.swap"(db,op){ dayOf(db,op.date).eveningSwap = op.value; },

    "coll.upsert"(db,op){ const l = db[op.coll]; if(!l) return;
      const i = l.findIndex(x=>x.id===op.obj.id); if(i>=0) l[i] = Object.assign({}, l[i], op.obj); else l.push(op.obj); },
    "coll.remove"(db,op){ if(db[op.coll]) db[op.coll] = db[op.coll].filter(x=>x.id!==op.id); },
    "settings.patch"(db,op){ Object.assign(db.settings, op.patch); },
    "meta.patch"(db,op){ Object.assign(db.meta, op.patch); },
    "coins.set"(db,op){ if(db.state.coins[op.pid]!=null) db.state.coins[op.pid] = Math.max(0, op.n|0); }
  };
  function apply(db, op){
    const h = H[op.kind];
    if(!h){ console.warn("Unbekannte Aktion übersprungen:", op.kind); return; }
    h(db, op);
  }
  return { apply, dayOf, kinds:Object.keys(H) };
})();

/* ==========================================================================
   3) STORE — lokaler Datenstand + Aktionsprotokoll.
      Ohne Sync verhält er sich genau wie vorher (alles im LocalStorage).
   ========================================================================== */
const Store = (function(){
  const KEY = "nestwerk.family.v2", KEY_OLD = "nestwerk.family.v1";
  let db = null, queue = [], lastSeq = 0, bootstrapSeq = 0, seen = {};
  const subs = [];

  function load(){
    let saved = null;
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) saved = JSON.parse(raw);
      else { const old = localStorage.getItem(KEY_OLD); if(old) saved = { db: JSON.parse(old) }; }
    }catch(e){ console.warn("Gespeicherte Daten unlesbar, starte neu.", e); }

    const base = defaultDB();
    db = saved && saved.db ? merge(base, saved.db) : base;
    queue = ((saved && saved.queue) || []).map(o=> o.opId ? o : Object.assign({}, o, { opId: uid("op") }));
    lastSeq = (saved && saved.lastSeq) || 0;
    bootstrapSeq = (saved && saved.bootstrapSeq) || 0;
    seen = {}; ((saved && saved.seen) || []).forEach(id=> seen[id]=1);
    return db;
  }
  function merge(base, saved){
    const out = JSON.parse(JSON.stringify(base));
    Object.keys(saved).forEach(k=>{
      if(k==="meta"){ out.meta = Object.assign({}, base.meta, saved.meta); return; }
      if(Array.isArray(saved[k]) || typeof saved[k]!=="object" || saved[k]===null){ out[k] = saved[k]; return; }
      out[k] = Object.assign({}, base[k]||{}, saved[k]);
    });
    if(saved.state) out.state = Object.assign({}, base.state, saved.state);
    return out;
  }
  function save(){
    try{
      const ids = Object.keys(seen); const keep = ids.length>2000 ? ids.slice(-2000) : ids;
      localStorage.setItem(KEY, JSON.stringify({ version:2, db, queue, lastSeq, bootstrapSeq, seen:keep }));
    }catch(e){
      console.error("Speichern fehlgeschlagen", e);
      if(typeof UI!=="undefined") UI.toast("Speicher voll — bitte exportieren und zurücksetzen.");
    }
  }
  function notify(){ subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); }

  /* Die einzige Mutationsstelle: eine Aktion anwenden, sichern, verteilen. */
  function dispatch(part){
    /* opId zuletzt setzen: Nutzlasten enthalten oft ein eigenes "id"-Feld
       (Missions-ID, Chore-ID …) und dürfen die Identität der Aktion nicht überschreiben. */
    const op = Object.assign({}, part, { opId: uid("op"), ts: Date.now(),
                               actor: (typeof Sync!=="undefined" ? Sync.actorName() : "lokal") });
    try{ Ops.apply(db, op); }
    catch(e){ console.error("Aktion fehlgeschlagen", e); if(typeof UI!=="undefined") UI.toast("Das hat nicht geklappt."); return null; }
    seen[op.opId] = 1; queue.push(op);
    save(); notify();
    if(typeof Sync!=="undefined") Sync.nudge();
    return op;
  }
  /* Aktion von einem anderen Gerät */
  function applyRemote(op){
    if(!op || !op.opId || seen[op.opId]) return false;
    try{ Ops.apply(db, op); }catch(e){ console.error("Fremde Aktion fehlgeschlagen", e); }
    seen[op.opId] = 1; return true;
  }
  function replaceDB(next){ db = merge(defaultDB(), next); }

  function get(){ return db; }
  function subscribe(fn){ subs.push(fn); }
  function pending(){ return queue.slice(); }
  function clearPending(ids){ const s={}; ids.forEach(i=>s[i]=1); queue = queue.filter(o=>!s[o.opId]); }
  function seq(){ return lastSeq; }
  function setSeq(n){ lastSeq = Math.max(lastSeq, n||0); }
  function bootSeq(){ return bootstrapSeq; }
  function setBootSeq(n){ bootstrapSeq = n||0; }

  function reset(){
    localStorage.removeItem(KEY); localStorage.removeItem(KEY_OLD);
    db = defaultDB(); queue = []; lastSeq = 0; bootstrapSeq = 0; seen = {};
    save(); notify();
  }
  function importJSON(text){
    const parsed = JSON.parse(text);
    const payload = parsed && parsed.db ? parsed.db : parsed;
    if(!payload || !payload.people) throw new Error("Keine gültige Nestwerk-Sicherung.");
    replaceDB(payload); queue = []; save(); notify();
  }
  function exportJSON(){ return JSON.stringify(db, null, 2); }

  function day(dateKey){ return Ops.dayOf(db, dateKey); }
  function dayRead(dateKey){
    return db.state.log[dateKey] || { basics:{}, chores:{}, missions:{}, media:{}, assign:{}, eveningSwap:false };
  }
  return { load, save, get, subscribe, dispatch, applyRemote, replaceDB, notify,
           pending, clearPending, seq, setSeq, bootSeq, setBootSeq,
           reset, importJSON, exportJSON, day, dayRead };
})();

/* ==========================================================================
   4) ENGINE — reine Funktionen. Kein Zustand, keine Seiteneffekte.
      Hier entscheidet die App, damit niemand sonst entscheiden muss.
   ========================================================================== */
const Engine = (function(){

  /* ---- A/B-Woche ---------------------------------------------------- */
  function mondayOf(k){ return T.addDays(k, -(T.dow(k)-1)); }
  function weekType(k){
    const db = Store.get();
    const weeks = Math.floor(T.diffDays(mondayOf(k), mondayOf(db.meta.abAnchor))/7);
    const even = ((weeks % 2)+2)%2 === 0;
    return even ? db.meta.abAnchorWeek : (db.meta.abAnchorWeek==="A"?"B":"A");
  }

  /* ---- Arbeitszeit eines Elternteils --------------------------------- */
  function workBlocks(pid, k){
    const db = Store.get(), w = db.work[pid]; if(!w) return [];
    const plan = w[T.dow(k)]; if(!plan || plan.mode==="off") return [];
    const office = plan.mode==="office";
    const start = office ? w.officeStart : w.homeStart;
    const end   = office ? w.officeEnd   : w.homeEnd;
    const main  = T.min(end)-T.min(start);
    const out = [{ start, end, title:"Arbeit ("+(office?"Büro":"Homeoffice")+")", kind:"work", home:!office }];
    const need = (w.targetDaily||0) - main;
    if(need >= 15){
      out.unshift({ start:w.earlyStart, end:T.hhmm(T.min(w.earlyStart)+need),
                    title:"Frühblock Arbeit", kind:"work", soft:true });
    }
    if(office){
      out.unshift({ start:T.hhmm(T.min(start)-(w.commute||0)), end:start, title:"Fahrt ins Büro", kind:"travel" });
      out.push({ start:end, end:T.hhmm(T.min(end)+(w.commute||0)), title:"Fahrt nach Hause", kind:"travel" });
    }
    return out;
  }
  function workSummary(pid, k){
    const db = Store.get(), w = db.work[pid]; if(!w) return null;
    const plan = w[T.dow(k)];
    if(!plan || plan.mode==="off") return { mode:"off", label:"arbeitsfrei" };
    return { mode:plan.mode, label: plan.mode==="office"?"Bürotag":"Homeoffice" };
  }
  function isHome(pid, k, minute){
    const db = Store.get(), w = db.work[pid]; if(!w) return true;
    const plan = w[T.dow(k)];
    if(!plan || plan.mode==="off" || plan.mode==="home") return true;   // im Haus
    const end = T.min(w.officeEnd) + (w.commute||0);
    return minute >= end;
  }

  /* ---- Henrys Stundenplan -------------------------------------------- */
  function henrySchool(k){
    const db = Store.get(), d = T.dow(k);
    if(d>5) return null;
    const row = (db.henryTimetable[weekType(k)]||{})[d] || [];
    const subs = [];
    row.forEach((s,i)=>{ if(s) subs.push({ block:db.schoolBlocks[i], subject:s }); });
    if(!subs.length) return null;
    return { start:subs[0].block.start, end:subs[subs.length-1].block.end, subjects:subs, week:weekType(k) };
  }

  /* ---- Termine einer Person an einem Tag ------------------------------ */
  function eventsFor(pid, k){
    const db = Store.get(), d = T.dow(k), wt = weekType(k), out = [];

    db.events.forEach(e=>{
      if(e.person!==pid) return;
      if(!e.days.includes(d)) return;
      if(e.week && e.week!=="*" && e.week!==wt) return;
      if(e.id==="e_han_care"){                                   // Betreuung endet dynamisch
        const leave = hannahLeave(k);
        out.push(Object.assign({}, e, { end:leave.time, note:leave.reason, ref:e.id }));
        return;
      }
      if(e.travel && e.travel.min){
        out.push({ id:e.id+"_t", person:pid, title:travelLabel(e.travel)+" → "+e.title, kind:"travel",
                   start:T.hhmm(T.min(e.start)-e.travel.min-10), end:e.start, travelOf:e.id });
      }
      out.push(Object.assign({}, e, { ref:e.id }));
    });

    if(pid==="henry"){ const s = henrySchool(k); if(s) out.push({ id:"hen_school", title:"Schule", kind:"school", start:s.start, end:s.end, subjects:s.subjects }); }
    if(pid==="emma"){
      const st = Store.get().settings;
      out.push({ id:"emma_pick", title:"Emma abholen", kind:"logistics", start:st.emmaPickupTarget, end:T.hhmm(T.min(st.emmaPickupTarget)+st.emmaKitaTravel) });
    }
    if(P(pid).role==="adult") workBlocks(pid,k).forEach((b,i)=> out.push(Object.assign({id:pid+"_w"+i, person:pid}, b)));

    const ev = eveningPlan(k);
    if(ev.bedtime===pid) out.push({ id:"ev_bed", title:"Emma ins Bett bringen", kind:"family", start:Store.get().settings.emmaBedStart, end:T.hhmm(T.min(Store.get().settings.emmaBedStart)+45) });
    if(ev.kitchen===pid) out.push({ id:"ev_kitchen", title:"Küchenabschluss", kind:"family", start:Store.get().settings.kitchenStart, end:T.hhmm(T.min(Store.get().settings.kitchenStart)+30) });

    drives(k).forEach(dr=>{ if(dr.driver===pid) out.push({ id:"drv_"+dr.id, title:"Fahrdienst: "+dr.who+" → "+dr.title, kind:"logistics", start:dr.leave, end:dr.start }); });

    return out.sort((a,b)=> T.min(a.start)-T.min(b.start));
  }
  function travelLabel(t){ return t.mode==="car"?"Auto": t.mode==="bike"?"Fahrrad": t.mode==="scooter"?"Roller":"Zu Fuß"; }

  /* ---- Wann geht Hannah aus der Betreuung? ---------------------------- */
  function hannahLeave(k){
    const db = Store.get(), st = db.settings, d = T.dow(k);
    const early = T.min(st.hannahCareEarliest), latest = T.min(st.hannahCareLatest);
    const hobby = db.events.find(e=> e.person==="hannah" && e.kind==="hobby" && e.days.includes(d));
    if(hobby && hobby.travel){
      const need = T.min(hobby.start) - hobby.travel.min - 10;      /* 10 Min Umziehen/Puffer */
      if(need < latest){
        return { time:T.hhmm(clamp(need, early, latest)),
                 reason:"Los um "+T.hhmm(need)+" — "+travelLabel(hobby.travel)+" "+hobby.travel.min+" Min, damit du um "+hobby.start+" beim "+hobby.title+" bist." };
      }
    }
    if(!st.hannahHasKey){
      const adultHome = ["mama","papa"].some(a=> isHome(a,k,early));
      if(adultHome) return { time:st.hannahCareEarliest, reason:"Du darfst schon um "+st.hannahCareEarliest+" — zu Hause ist jemand da." };
      const homeAt = ["mama","papa"].map(a=>{
        const w = Store.get().work[a], plan = w[d];
        if(!plan || plan.mode!=="office") return early;
        return T.min(w.officeEnd)+(w.commute||0);
      }).sort((x,y)=>x-y)[0];
      return { time:T.hhmm(clamp(homeAt, early, latest)),
               reason:"Ohne eigenen Schlüssel: erst los, wenn jemand zu Hause ist (ca. "+T.hhmm(homeAt)+")." };
    }
    return { time:st.hannahCareLatest, reason:"Kein Termin heute — Betreuung bis "+st.hannahCareLatest+"." };
  }

  /* ---- Fahrdienste (Auto, Kinder) ------------------------------------- */
  function drives(k){
    const db = Store.get(), d = T.dow(k), out = [];
    const seen = {};
    if(d<=5){                                        /* Kita-Abholung ist auch ein Fahrdienst */
      const st = db.settings;
      const leave = T.hhmm(T.min(st.emmaPickupTarget) - st.emmaKitaTravel);
      out.push({ id:"emma_pickup", title:"Kita", who:"Emma", leave, start:st.emmaPickupTarget,
                 driver: pickDriver(k, T.min(leave), T.min(st.emmaPickupTarget)+st.emmaKitaTravel),
                 note:"spätestens "+st.emmaPickupLatest });
    }
    db.events.forEach(e=>{
      if(!e.days.includes(d) || !e.travel || e.travel.mode!=="car") return;
      const per = P(e.person); if(per.role!=="child") return;
      const sig = e.title+"|"+e.start;
      if(seen[sig]){ seen[sig].who += " & " + per.name; return; }
      const leave = T.hhmm(T.min(e.start)-e.travel.min-10);
      const driver = pickDriver(k, T.min(leave), T.min(e.start));
      const rec = { id:e.id, title:e.title, who:per.name, leave, start:e.start, driver };
      seen[sig] = rec; out.push(rec);
    });
    return out;
  }
  function pickDriver(k, from, to){
    const cand = ["mama","papa"].filter(a=>{
      const busy = rawEvents(a,k).some(e=> T.min(e.start) < to && T.min(e.end) > from);
      const working = workBlocks(a,k).some(b=> !b.soft && !b.home && T.min(b.start) < to && T.min(b.end) > from);
      return !busy && !working;
    });
    if(cand.length) return cand[(T.diffDays(k, Store.get().meta.abAnchor)%cand.length+cand.length)%cand.length];
    return "mama";
  }
  function rawEvents(pid,k){
    const db=Store.get(), d=T.dow(k), wt=weekType(k);
    return db.events.filter(e=> e.person===pid && e.days.includes(d) && (!e.week || e.week==="*" || e.week===wt));
  }

  /* ---- Abendlogik: wer bringt Emma ins Bett, wer macht die Küche? ------ */
  /* Die Woche wird als Kette gerechnet: nach einem sporterzwungenen Tausch
     verschiebt sich die Reihenfolge, damit sie sich wieder ausgleicht.       */
  function eveningWeek(k){
    const db = Store.get(), st = db.settings;
    const bedA = T.min(st.emmaBedStart), bedB = bedA+45;
    const kitA = T.min(st.kitchenStart),  kitB = kitA+30;
    const mon = mondayOf(k);
    const weekIdx = Math.floor(T.diffDays(mon, mondayOf(db.meta.abAnchor))/7);
    let prev = ((((weekIdx%2)+2)%2)===0) ? "papa" : "mama";     /* wer die Vorwoche beendet hat */
    const out = {};
    for(let i=0;i<7;i++){
      const d = T.addDays(mon,i);
      const busy = (pid,a,b)=> rawEvents(pid,d).some(e=> (e.blocksEvening || e.kind==="sport" || e.kind==="family") && T.min(e.start)<b && T.min(e.end)>a);
      let bed = prev==="mama" ? "papa" : "mama";
      let other = bed==="mama" ? "papa" : "mama";
      let reason = "Regulärer Wechsel — heute ist "+P(bed).name+" dran.";
      if(busy(bed,bedA,bedB) && !busy(other,bedA,bedB)){
        const conf = rawEvents(bed,d).find(e=> T.min(e.start)<bedB && T.min(e.end)>bedA);
        reason = P(bed).name+" hat "+(conf? conf.title+" um "+conf.start : "einen Termin")+" — deshalb übernimmt "+P(other).name+" und ist morgen dafür dran.";
        const t=bed; bed=other; other=t;
      }
      if(Store.dayRead(d).eveningSwap){ const t=bed; bed=other; other=t; reason = "Von Hand getauscht."; }
      let kitchen = other, both = false, kitchenReason = P(other).name+" macht dafür den Küchenabschluss.";
      if(busy(other,kitA,kitB)){
        const conf = rawEvents(other,d).find(e=> T.min(e.start)<kitB && T.min(e.end)>kitA);
        kitchen = bed; both = true;
        kitchenReason = P(other).name+" ist wegen "+(conf?conf.title:"einem Termin")+" raus — "+P(bed).name+" übernimmt heute beides.";
      }
      out[d] = { bedtime:bed, kitchen, both, reason, kitchenReason, bedTime:st.emmaBedStart, kitchenTime:st.kitchenStart };
      prev = bed;
    }
    return out;
  }
  function eveningPlan(k){ return eveningWeek(k)[k]; }


  /* ---- Haushaltsgedächtnis -------------------------------------------- */
  function choreStatus(c, k){
    const next = T.addDays(c.lastDone || T.addDays(k,-c.interval), c.interval);
    const days = T.diffDays(next, k);
    return { next, days, state: days<0?"over": days===0?"today": days<=2?"soon":"ok" };
  }
  function choresDue(k){
    const db = Store.get(), d = T.dow(k), day = Store.dayRead(k);
    return db.chores.filter(c=>{
      if(day.chores[c.id]) return true;          /* heute abgehakt: bleibt sichtbar */
      const st = choreStatus(c,k);
      if(c.fixedDay) return c.fixedDay===d && st.days<=0;
      return st.days<=0;
    }).sort((a,b)=> choreStatus(a,k).days - choreStatus(b,k).days);
  }
  /* Verfügbare Minuten im Haushaltsfenster 15:00–20:30 */
  function freeMinutes(pid, k){
    const A=T.min("15:00"), B=T.min("20:30");
    let busy = 0;
    rawEvents(pid,k).concat(workBlocks(pid,k)).forEach(e=>{
      const a=Math.max(A,T.min(e.start)), b=Math.min(B,T.min(e.end));
      if(b>a) busy += (b-a);
    });
    const per = P(pid);
    if(per.role==="child"){                       /* Schule/Betreuung zählt als Belastung */
      if(pid==="henry"){ const s=henrySchool(k); if(s) busy += 20; }
      if(per.age<=4) busy += 120;
    }
    return Math.max(0, (B-A) - busy);
  }
  /* Faire Verteilung: Verfügbarkeit − bisherige Last − heutige Last */
  function computeAssignments(k){
    const db = Store.get(), due = choresDue(k), assign = {}, todayLoad = {};
    db.people.forEach(p=> todayLoad[p.id]=0);
    const dayIdx = T.diffDays(k, db.meta.abAnchor);

    due.forEach(c=>{
      if(c.everyone){ assign[c.id]="*"; return; }
      let pool = (c.pool||[]).filter(pid=>{
        const p = P(pid); return p && p.age >= (c.minAge||0);
      });
      if(!pool.length){ assign[c.id]="mama"; return; }
      if(c.rotate){
        const order = pool.slice().sort();
        for(let i=0;i<order.length;i++){
          const cand = order[(((dayIdx+i)%order.length)+order.length)%order.length];
          if(freeMinutes(cand,k) > 45){ assign[c.id]=cand; todayLoad[cand]+=c.effort; return; }
        }
        assign[c.id]=order[0]; todayLoad[order[0]]+=c.effort; return;
      }
      let best=null, bestScore=-1e9;
      pool.forEach(pid=>{
        const hist = db.state.choreHistory[pid]||0;
        const score = freeMinutes(pid,k)/30 - hist*0.9 - todayLoad[pid]*2.2 - (P(pid).role==="adult"?0:0.4)
                    - (pid==="mama"?1.2:0);        /* Gegengewicht: Mama nicht als Standard */
        if(score>bestScore){ bestScore=score; best=pid; }
      });
      assign[c.id]=best; todayLoad[best]+= c.effort;
    });
    return assign;
  }
  function assignmentsFor(k){
    const day = Store.dayRead(k);
    const due = choresDue(k);
    const missing = due.some(c=> !day.assign || !day.assign[c.id]);
    if(missing) return computeAssignments(k);
    return day.assign;
  }
  function choresForPerson(pid, k){
    const a = assignmentsFor(k);
    return choresDue(k).filter(c=> a[c.id]===pid || (a[c.id]==="*" && (c.pool||[]).includes(pid)));
  }

  /* ---- Daily Basics ---------------------------------------------------- */
  function basicsFor(pid, k){
    const d = T.dow(k);
    return Store.get().basics.filter(b=> b.person===pid && (b.days||[]).includes(d));
  }

  /* ---- Medienzeit ------------------------------------------------------ */
  function media(pid, k){
    const per = P(pid), day = Store.dayRead(k);
    const budget = per.media||0;
    const entries = day.media[pid] || [];
    const used = entries.reduce((s,e)=> s+e.min, 0);
    const gates = basicsFor(pid,k).filter(b=> b.unlocksMedia);
    const open  = gates.filter(b=> !day.basics[b.id]);
    return { budget, used, remaining:Math.max(0,budget-used), entries,
             unlocked: open.length===0, gates, open };
  }

  /* ---- Missionen -------------------------------------------------------- */
  function openMissions(){ return Store.get().missions.filter(m=> m.status==="open"); }
  function missionsOf(pid){ return Store.get().missions.filter(m=> m.by===pid && m.status!=="open"); }

  /* ---- Tagesüberblick --------------------------------------------------- */
  function dayStats(pid, k){
    const day = Store.dayRead(k);
    const b = basicsFor(pid,k), c = choresForPerson(pid,k), all = missionsOf(pid);
    const mOpen = all.filter(x=>x.status==="claimed");
    const mDone = all.filter(x=>x.status==="done" && x.doneAt===k);
    const total = b.length + c.length + mOpen.length + mDone.length;
    const done  = b.filter(x=>day.basics[x.id]).length + c.filter(x=>day.chores[x.id]).length + mDone.length;
    return { total, done, open:Math.max(0,total-done), basics:b, chores:c, missions:mOpen };
  }
  function firstEventTime(pid,k){ const e = eventsFor(pid,k); return e.length? e[0].start : null; }

  /* ---- Hinweise für Heute ------------------------------------------------ */
  function highlights(k){
    const db=Store.get(), d=T.dow(k), out=[];
    if(d===db.settings.weekResetDay)
      out.push({ icon:"broom", title:"Freitags-Reset heute Abend", text:"10 Minuten alle gemeinsam — damit Freitag geputzt statt aufgeräumt wird." });

           hannahLeave, drives, eveningPlan, choreStatus, choresDue, computeAssignments,

           dayStats, highlights, freeMinutes, travelLabel, firstEventTime };

/* ==========================================================================
   6) ACTIONS — bauen Aktionen und geben sie an den Store.
      Kein direkter Zugriff auf den Datenstand mehr: alles läuft über Ops,
      damit dieselbe Änderung auf jedem Gerät identisch nachvollzogen wird.
   ========================================================================== */
const Actions = (function(){
  const D = p => Store.dispatch(p);
  const fmt = k => T.dayShort(k)+", "+T.parse(k).getDate()+"."+(T.parse(k).getMonth()+1)+".";

  function ensureDay(k){
    const day = Store.dayRead(k);
    const due = Engine.choresDue(k);
    const missing = due.some(c=> !day.assign || !day.assign[c.id]);
    if(!missing) return;
    D({ kind:"assign.set", date:k, map: Engine.computeAssignments(k) });
  }

  function toggleBasic(id, k){
    const value = !Store.dayRead(k).basics[id];
    D({ kind:"basic.set", id, date:k, value });
    const b = Store.get().basics.find(x=>x.id===id);
    if(b && value){
      const m = Engine.media(b.person,k);
      if(b.unlocksMedia && m.unlocked) UI.toast("Medienzeit freigeschaltet für "+P(b.person).name+".", "gold");
    }
  }

  function toggleChore(id, k){
    const value = !Store.dayRead(k).chores[id];
    const who = (Store.dayRead(k).assign||{})[id] || Engine.assignmentsFor(k)[id];
    D({ kind:"chore.set", id, date:k, value, who });
    if(value){
      const c = Store.get().chores.find(x=>x.id===id);
      if(c) UI.toast(c.title+" erledigt — wieder fällig am "+fmt(Engine.choreStatus(c,k).next)+".");
    }
  }

  function claimMission(id, pid){
    D({ kind:"mission.claim", id, by:pid, date:T.key(new Date()) });
    UI.toast("Übernommen. Liegt jetzt offen in deinem Plan — Haken setzt du erst, wenn sie fertig ist.");
  }
  function returnMission(id){
    D({ kind:"mission.return", id });
    UI.toast("Zurückgegeben. Sie steht wieder in der Jobbörse.");
  }
  function completeMission(id, k, ev){
    const m0 = Store.get().missions.find(x=>x.id===id);
    if(!m0 || m0.status!=="claimed") return;
    D({ kind:"mission.done", id, date:k });
    UI.coinFly(ev, m0.coins);
    UI.toast("+"+m0.coins+" Coins für "+P(m0.by).name+".", "gold");
    UI.celebrate();
  }
  function undoMission(id){ D({ kind:"mission.undo", id }); }

  function redeem(rid, pid, ev){
    const db = Store.get(), r = db.rewards.find(x=>x.id===rid);
    if(!r || (db.state.coins[pid]||0) < r.cost){ UI.toast("Dafür fehlen noch Coins."); return; }
    D({ kind:"reward.redeem", rid, pid, rdId:uid("rd"), date:T.key(new Date()) });
    UI.toast(r.title+" eingelöst — "+r.cost+" Coins abgezogen.", "gold");
    UI.celebrate();
  }
  function markRedemptionUsed(id){
    const r = Store.get().state.redemptions.find(x=>x.id===id);
    D({ kind:"redemption.used", id, value: r? !r.used : true });
  }

  function logMedia(pid, minutes, k){
    const m = Engine.media(pid,k);
    if(!m.unlocked){ UI.toast("Erst die Basics erledigen, dann geht's los."); return; }
    const use = Math.min(minutes, m.remaining);
    if(use<=0){ UI.toast("Für heute ist das Budget aufgebraucht."); return; }
    D({ kind:"media.add", pid, date:k, min:use, at:T.hhmm(T.nowMin()), entryId:uid("me") });
    const after = Engine.media(pid,k);
    UI.toast(use+" Minuten eingetragen — "+after.remaining+" Minuten bleiben für später.");
  }
  function undoMedia(pid, entryId, k){ D({ kind:"media.remove", pid, date:k, entryId:String(entryId) }); }

  function swapEvening(k){
    D({ kind:"evening.swap", date:k, value: !Store.dayRead(k).eveningSwap });
    UI.toast("Abendplanung getauscht.");
  }

  /* ---- Admin ---- */
  function upsert(coll, obj){ D({ kind:"coll.upsert", coll, obj }); }
  function remove(coll, id){ D({ kind:"coll.remove", coll, id }); }
  function patchPerson(id, patch){ D({ kind:"coll.upsert", coll:"people", obj: Object.assign({id}, patch) }); }
  function patchSettings(patch){ D({ kind:"settings.patch", patch }); }
  function patchMeta(patch){ D({ kind:"meta.patch", patch }); }
  function patchChoreDate(id, dateKey){ D({ kind:"coll.upsert", coll:"chores", obj:{ id, lastDone:dateKey } }); }
  function setCoins(pid, n){ D({ kind:"coins.set", pid, n }); }

  return { ensureDay, toggleBasic, toggleChore, claimMission, returnMission, completeMission, undoMission,
           redeem, markRedemptionUsed, logMedia, undoMedia, swapEvening,
           upsert, remove, patchPerson, patchSettings, patchMeta, patchChoreDate, setCoins };
})();

/* ==========================================================================
   7) SYNC — gemeinsamer Familienstand über Supabase (reines REST, kein SDK).
      Übertragen werden nur Aktionen, nie der ganze Datenstand. Deshalb
      überschreibt niemand die Eingabe eines anderen.
   ========================================================================== */
const Sync = (function(){
  const CKEY = "nestwerk.sync.config";
  let cfg = null, timer = null, busy = false, nudged = false;
  let status = "off", detail = "";                 /* off | ok | busy | error */

  function loadCfg(){
    try{ cfg = JSON.parse(localStorage.getItem(CKEY)) || null; }catch(e){ cfg = null; }
    if(cfg && !cfg.device){ cfg.device = uid("dev"); saveCfg(); }
    return cfg;
  }
  function saveCfg(){ if(cfg) localStorage.setItem(CKEY, JSON.stringify(cfg)); else localStorage.removeItem(CKEY); }
  function config(){ return cfg; }
  function configured(){ return !!(cfg && cfg.url && cfg.key && cfg.family); }
  function actorName(){ return (cfg && cfg.name) ? cfg.name : "lokal"; }
  function state(){ return { status, detail, configured:configured(), pending:Store.pending().length, seq:Store.seq() }; }

  const endpoint = ()=> String(cfg.url).replace(/\/+$/,"") + "/rest/v1/family_ops";
  function headers(extra){
    return Object.assign({ "apikey": cfg.key, "Authorization": "Bearer "+cfg.key, "Content-Type":"application/json" }, extra||{});
  }
  async function req(url, opts){
    const res = await fetch(url, opts);
    if(!res.ok){
      let msg = res.status+" "+res.statusText;
      try{ const j = await res.json(); if(j && j.message) msg = j.message; }catch(e){}
      throw new Error(msg);
    }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : [];
  }
  function setStatus(s, d){ status = s; detail = d||""; Store.notify(); }

  /* --- hochladen --- */
  async function push(){
    const q = Store.pending();
    if(!q.length) return;
    const rows = q.map(op=>({ family: cfg.family, op_id: op.opId, kind: op.kind, actor: op.actor||"", payload: op }));
    await req(endpoint()+"?on_conflict=op_id", {
      method:"POST",
      headers: headers({ "Prefer":"resolution=ignore-duplicates,return=minimal" }),
      body: JSON.stringify(rows)
    });
    Store.clearPending(q.map(o=>o.opId));
    Store.save();
  }
  /* --- herunterladen --- */
  async function pull(){
    const url = endpoint()+"?family=eq."+encodeURIComponent(cfg.family)
              + "&seq=gt."+Store.seq()+"&select=seq,op_id,kind,payload&order=seq.asc&limit=800";
    const rows = await req(url, { headers: headers() });
    if(!rows.length) return 0;
    let changed = 0;
    rows.forEach(r=>{
      if(r.kind === "bootstrap"){
        if(r.seq > Store.bootSeq()){
          Store.replaceDB(r.payload.db);
          Store.setBootSeq(r.seq);
          changed++;
        }
      }else if(Store.applyRemote(r.payload)) changed++;
      Store.setSeq(r.seq);
    });
    Store.save();
    if(changed) Store.notify();
    return changed;
  }
  async function cycle(){
    if(!configured() || busy) return;
    busy = true; setStatus("busy");
    try{ await push(); await pull(); setStatus("ok"); }
    catch(e){ console.warn("Sync:", e); setStatus("error", e.message); }
    finally{ busy = false; }
  }
  function nudge(){
    if(!configured() || nudged) return;
    nudged = true;
    setTimeout(()=>{ nudged = false; cycle(); }, 400);       /* mehrere Klicks zusammenfassen */
  }
  function startTimer(){
    if(timer) clearInterval(timer);
    if(!configured()) return;
    timer = setInterval(()=>{ if(document.visibilityState !== "hidden") cycle(); }, 6000);
  }

  /* --- Erstverbindung --- */
  async function bootstrapRemote(){
    const url = endpoint()+"?family=eq."+encodeURIComponent(cfg.family)
              + "&kind=eq.bootstrap&select=seq,payload&order=seq.desc&limit=1";
    const rows = await req(url, { headers: headers() });
    return rows[0] || null;
  }
  async function publishSnapshot(){
    const op = { opId: uid("boot"), ts: Date.now(), kind:"bootstrap", actor: actorName(), db: JSON.parse(Store.exportJSON()) };
    await req(endpoint(), {
      method:"POST",
      headers: headers({ "Prefer":"return=representation" }),
      body: JSON.stringify([{ family: cfg.family, op_id: op.opId, kind:"bootstrap", actor: op.actor, payload: op }])
    }).then(rows=>{
      const seq = rows && rows[0] ? rows[0].seq : 0;
      Store.setBootSeq(seq); Store.setSeq(seq);
    });
    Store.clearPending(Store.pending().map(o=>o.opId));   /* im Schnappschuss bereits enthalten */
    Store.save();
  }
  async function connect(next, onQuestion){
    cfg = Object.assign({ device: uid("dev") }, next);
    saveCfg();
    setStatus("busy");
    try{
      const boot = await bootstrapRemote();
      if(!boot){
        await publishSnapshot();
      }else if(boot.seq !== Store.bootSeq()){
        const takeRemote = await onQuestion();
        if(takeRemote){
          Store.replaceDB(boot.payload.db);
          Store.setBootSeq(boot.seq); Store.setSeq(boot.seq);
          Store.clearPending(Store.pending().map(o=>o.opId));
          Store.save();
        }else{
          await publishSnapshot();
        }
      }
      await pull();
      setStatus("ok");
      startTimer();
      return true;
    }catch(e){
      setStatus("error", e.message);
      throw e;
    }
  }
  function disconnect(){ cfg = null; saveCfg(); if(timer) clearInterval(timer); timer=null; setStatus("off"); }

  function init(){
    loadCfg();
    if(configured()){ setStatus("busy"); cycle(); startTimer();
      document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") cycle(); });
    }
  }
  return { init, connect, disconnect, cycle, nudge, config, configured, actorName, state, publishSnapshot };
})();

      + '<div class="two-col"><div class="stack">'
      + evening
      + '<div><div class="section-h"><h2>Tagesband</h2><span class="hint">alle Termine, eine Zeitachse</span></div>'+band(k)+'</div>'

  /* ==========================  ICH / DASHBOARDS  ========================== */
  function whoBar(){
    return '<div class="who">'+ Store.get().people.map(p=>
      '<button data-a="setPerson" data-id="'+p.id+'" aria-pressed="'+(S.person===p.id)+'" style="--acc:'+pcol(p.id)+';--acc-soft:'+p.soft+'">'
      + Art.avatar(p.id)+'<b>'+esc(p.name)+'</b></button>').join("") + '</div>';
  }
  function heroPerson(pid, subtitle, extra){
    const p = P(pid);
    return '<div class="hero-person" style="--acc-soft:'+p.soft+'">'
      + '<div class="row" style="align-items:flex-start;gap:14px">'
      + '<div class="figs"><span class="avatar">'+Art.avatar(pid)+'</span><span class="comp">'+Art.companion(p.companion)+'</span></div>'
      + '<div style="flex:1;min-width:0;padding-top:6px"><span class="eyebrow">'+T.dayName(S.date)+'</span>'
      + '<h1 style="margin-top:2px">'+esc(p.name)+'</h1>'
      + '<p class="small muted">'+subtitle+'</p></div></div>'
      + (extra||'') + '</div>';

  function scheduleList(pid){
    const k=S.date, evs = Engine.eventsFor(pid,k);
    if(!evs.length) return empty("Heute steht nichts im Kalender.","star");
    return evs.map(e=>{
      const c = EV_COLOR[e.kind]||EV_COLOR.family;
      const sub = e.subjects ? e.subjects.map(s=>s.subject).join(" · ") : (e.note||"");
      return '<div class="row" style="align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)">'
        + '<div style="width:52px;flex:none"><b class="small">'+e.start+'</b><div class="xs muted">'+e.end+'</div></div>'
        + '<div style="width:4px;align-self:stretch;border-radius:3px;background:'+c[1]+';flex:none"></div>'
        + '<div style="flex:1;min-width:0"><b class="small">'+esc(e.title)+'</b>'
        + (sub? '<p class="xs muted">'+esc(sub)+'</p>':'')+'</div></div>';
    }).join("");
  }
  function mediaCard(pid){
    const k=S.date, m = Engine.media(pid,k), p=P(pid);
    const gate = !m.unlocked;
    const chips = [10,15,20,30].map(n=>'<button class="btn '+(gate?"ghost":"soft")+' sm" data-a="logMedia" data-id="'+pid+'" data-n="'+n+'" '+(gate||m.remaining<=0?"disabled":"")+'>+'+n+' Min</button>').join("");
    const list = m.entries.length ? '<div class="stack" style="gap:6px;margin-top:12px">'+m.entries.map((e,i)=>
        '<div class="row xs muted"><span>'+e.at+' Uhr · '+e.min+' Minuten</span><span class="spacer"></span><button class="btn ghost sm" data-a="undoMedia" data-id="'+pid+'" data-n="'+i+'">rückgängig</button></div>').join("")+'</div>' : '';
    return '<div class="card'+(m.unlocked?" unlock-burst":"")+'">'
      + '<div class="row" style="margin-bottom:12px"><span class="eyebrow">Medienzeit</span><span class="spacer"></span>'
      + '<span class="chip '+(gate?"warn":"ok")+'">'+(gate?"gesperrt":"frei")+'</span></div>'
      + '<div class="media-visual"><span class="device">'+Art.illu(p.id==="henry"?"tv":"tablet")+'</span>'
      + '<div class="mv-body">'
      + '<div class="row" style="align-items:baseline;gap:6px"><b style="font-family:var(--font-display);font-size:26px">'+m.remaining+'</b><span class="small muted">von '+m.budget+' Minuten übrig</span></div>'
      + '<div style="margin-top:8px">'+bar(m.budget? m.used/m.budget*100:0,"gold thick")+'</div>'
      + '<p class="xs muted" style="margin-top:6px">'+m.used+' Minuten genutzt · '+m.remaining+' für später aufgehoben</p>'
      + '</div></div>'
      + (gate? '<div class="locked-note" style="margin-top:14px"><span style="width:22px;flex:none;color:var(--warn)">'+Art.icon("lock")+'</span>'
              + '<div class="small">Noch offen: '+m.open.map(b=>esc(b.title)).join(", ")+'</div></div>'
              : '<div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">'+chips+'</div>')
      + list + '</div>';
  }

  /* ---- Kind (Henry / Hannah) ---- */
  function dashKid(pid){
    const k=S.date, db=Store.get(), day=Store.dayRead(k), p=P(pid);
    const st = Engine.dayStats(pid,k);
    const basics = st.basics.map(b=> taskRow({ id:b.id, action:"toggleBasic", done:!!day.basics[b.id], title:b.title, icon:b.icon,
      right: b.unlocksMedia? '<span class="chip gold" title="Schaltet Medienzeit frei">'+Art.icon("unlock")+'</span>':'' })).join("") || empty("Heute keine Basics.","star");
    const chores = st.chores.length? st.chores.map(c=> taskRow({ id:c.id, action:"toggleChore", done:!!day.chores[c.id], title:c.title, sub:c.room, icon:"broom" })).join("")
                                   : empty("Heute keine Haushaltsaufgabe für dich.","broom");
    const mine = Engine.missionsOf(pid);
    const missions = mine.length? mine.map(m=>{
      if(m.status==="claimed") return '<div class="task" data-a="completeMission" data-id="'+m.id+'" role="button" tabindex="0">'
        + '<span class="check">'+Art.checkPath+'</span><span class="t-ico">'+Art.illu(m.icon)+'</span>'
        + '<span class="t-body"><span class="t-title">'+esc(m.title)+'</span><span class="t-sub">offen · '+m.coins+' Coins bei Erledigung</span></span>'
        + '<button class="btn ghost sm" data-a="returnMission" data-id="'+m.id+'" data-stopclick="1">Zurückgeben</button></div>';
      return '<div class="task done"><span class="check">'+Art.checkPath+'</span><span class="t-body"><span class="t-title">'+esc(m.title)+'</span><span class="t-sub">erledigt · +'+m.coins+' Coins</span></span></div>';
    }).join("") : empty("Noch keine Mission übernommen. Schau in die Jobbörse.","sparkle");

    const redeemed = db.state.redemptions.filter(r=>r.person===pid).slice(0,4);
    const rew = redeemed.length? redeemed.map(r=>'<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2)"><span style="width:30px;flex:none">'+Art.illu(Store.get().rewards.find(x=>x.id===r.reward)?.icon||"star")+'</span><div style="flex:1"><b class="small">'+esc(r.title)+'</b><div class="xs muted">'+r.date+(r.used?" · eingelöst":"")+'</div></div><button class="btn ghost sm" data-a="useRedemption" data-id="'+r.id+'">'+(r.used?"zurück":"benutzt")+'</button></div>').join("")
      : '<p class="small muted">Noch nichts eingelöst. Im Bereich Jobs findest du den Belohnungs-Shop.</p>';

    const pct = st.total? Math.round(st.done/st.total*100):100;
    let hint = '';
    if(pid==="hannah"){
      const lv = Engine.hannahLeave(k);
      hint = '<div class="card accent" style="--acc:'+pcol(pid)+'"><div class="row" style="align-items:flex-start;gap:12px">'
        + '<span style="width:36px;flex:none">'+Art.illu("bike")+'</span>'
        + '<div><b class="small">Betreuung verlassen um '+lv.time+'</b><p class="xs muted">'+esc(lv.reason)+'</p></div></div></div>';
    }

    return '<div class="stack lg" style="padding-top:14px">'
      + whoBar()
      + heroPerson(pid, st.open? st.open+" Sachen warten noch auf dich — "+st.done+" hast du schon."
                              : "Alles erledigt. Stark.",
          '<div style="margin-top:16px">'+bar(pct)+'</div>'
        + '<div class="row" style="margin-top:14px;gap:10px;flex-wrap:wrap">'
        + '<span class="coin-badge">'+Art.illu("coin")+(db.state.coins[pid]||0)+' Coins</span>'
        + '<span class="chip">'+esc(Art.companionName(p.companion))+' ist dabei</span></div>')
      + hint
      + '<div class="two-col"><div class="stack">'
      + '<div><div class="section-h"><h2>Dein Tag</h2></div><div class="card">'+scheduleList(pid)+'</div></div>'
      + '<div><div class="section-h"><h2>Daily Basics</h2><span class="hint">antippen zum Abhaken</span></div><div class="card">'+basics+'</div></div>'
      + '<div><div class="section-h"><h2>Haushalt</h2></div><div class="card">'+chores+'</div></div>'
      + '</div><div class="stack">'
      + mediaCard(pid)
      + '<div><div class="section-h"><h2>Deine Missionen</h2></div><div class="card">'+missions+'</div></div>'
      + '<div><div class="section-h"><h2>Deine Belohnungen</h2></div><div class="card">'+rew+'</div></div>'
      + '</div></div></div>';
  }

      + '<div style="margin-top:10px">'+bar(m.budget? m.used/m.budget*100:0,"gold thick")+'</div>'

            + [15,30].map(n=>'<button class="btn soft" data-a="logMedia" data-id="emma" data-n="'+n+'" '+(m.remaining<=0?"disabled":"")+'>'+n+' Min</button>').join("")+'</div>'
          : '<div class="row" style="gap:8px;margin-top:12px"><span style="width:26px;color:var(--warn)">'+Art.icon("lock")+'</span><span class="small muted">Erst die Bilder oben antippen.</span></div>')
      + '</div></div></div>'

      + '<div class="card"><div class="row" style="margin-bottom:6px"><span class="eyebrow">Dein Tag</span></div>'+plan+'</div>'
      + '<div class="card"><div class="row"><span class="coin-badge" style="font-size:19px">'+Art.illu("coin")+(db.state.coins.emma||0)+'</span>'
      + '<span class="small muted" style="margin-left:12px">Sterne zum Aussuchen</span></div></div>'
      + '</div>';

  /* ---- Eltern ---- */
  function dashAdult(pid){
    const k=S.date, db=Store.get(), day=Store.dayRead(k);
    const w = Engine.workSummary(pid,k), blocks = Engine.workBlocks(pid,k);
    const st = Engine.dayStats(pid,k);
    const ev = Engine.eveningPlan(k);
    const chores = st.chores.length? st.chores.map(c=> taskRow({ id:c.id, action:"toggleChore", done:!!day.chores[c.id], title:c.title, sub:c.room+" · alle "+c.interval+" Tage", icon:"broom" })).join("")
                                   : empty("Heute nichts aus dem Haushalt zugeteilt.","broom");
    const dr = Engine.drives(k).filter(d=>d.driver===pid);
    const driveBox = dr.length? dr.map(d=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line-2)"><span style="width:34px;flex:none">'+Art.illu("car")+'</span><div style="flex:1"><b class="small">'+esc(d.who+" → "+d.title)+'</b><div class="xs muted">losfahren '+d.leave+' · Beginn '+d.start+'</div></div></div>').join("")
      : '<p class="small muted">Heute keine Fahrdienste.</p>';
    const workBox = blocks.length? blocks.filter(b=>b.kind==="work").map(b=>'<div class="row" style="padding:9px 0"><b class="small" style="width:110px">'+b.start+'–'+b.end+'</b><span class="small muted">'+esc(b.title)+'</span></div>').join("")
      : '<p class="small muted">Heute arbeitsfrei.</p>';
    const kidStatus = db.people.filter(p=>p.role==="child").map(p=>{
      const s = Engine.dayStats(p.id,k), m = Engine.media(p.id,k);
      return '<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line-2)"><span style="width:34px;flex:none">'+Art.avatar(p.id)+'</span>'
        + '<div style="flex:1"><b class="small">'+esc(p.name)+'</b><div class="xs muted">'+s.done+'/'+s.total+' erledigt · '+m.used+'/'+m.budget+' Min Medien</div></div>'
        + '<span class="chip gold">'+(db.state.coins[p.id]||0)+'</span></div>';
    }).join("");

    return '<div class="stack lg" style="padding-top:14px">'
      + whoBar()
      + heroPerson(pid, (w? w.label:"")+" · "+st.open+" offene Aufgaben heute",
          '<div class="row" style="margin-top:14px;gap:10px;flex-wrap:wrap">'
          + '<span class="chip brand">'+(ev.bedtime===pid? "Emma ins Bett "+ev.bedTime : ev.kitchen===pid? "Küchenabschluss "+ev.kitchenTime : "abends frei")+'</span>'
          + '<span class="chip">Keine Coins — Coins sind Kindersache</span></div>')
      + '<div class="two-col"><div class="stack">'
      + '<div><div class="section-h"><h2>Dein Tag</h2></div><div class="card">'+scheduleList(pid)+'</div></div>'
      + '<div><div class="section-h"><h2>Haushalt heute</h2><span class="hint">automatisch zugeteilt</span></div><div class="card">'+chores+'</div></div>'
      + '<div><div class="section-h"><h2>Fahrdienste</h2></div><div class="card">'+driveBox+'</div></div>'
      + '</div><div class="stack">'
      + '<div><div class="section-h"><h2>Arbeit</h2></div><div class="card">'+workBox+'</div></div>'
      + '<div><div class="section-h"><h2>Kinder im Blick</h2></div><div class="card">'+kidStatus+'</div></div>'
      + '<div class="card"><span class="eyebrow">Abend</span><p class="small" style="margin-top:8px">'+esc(ev.reason)+'</p>'
      + '<p class="small muted" style="margin-top:6px">'+esc(ev.kitchenReason)+'</p>'
      + '<button class="btn ghost sm" data-a="swapEvening" style="margin-top:12px">'+Art.icon("refresh")+' Tauschen</button></div>'
      + '</div></div></div>';
  }
  function viewMe(){
    const p = P(S.person);
    if(p.mode==="emma") return dashEmma();
    if(p.role==="child") return dashKid(p.id);
    return dashAdult(p.id);
  }

  /* ==========================  JOBS  ========================== */
  function viewJobs(){
    const db=Store.get(), kid=S.jobKid, coins=db.state.coins[kid]||0, age=P(kid).age;
    const kidTabs = '<div class="tabs">'+db.people.filter(p=>p.role==="child").map(p=>
      '<button data-a="setJobKid" data-id="'+p.id+'" aria-pressed="'+(kid===p.id)+'">'+esc(p.name)+'</button>').join("")+'</div>';

    const open = Engine.openMissions();
    const forKid = open.filter(m=> age >= m.minAge);
    const tooOld = open.filter(m=> age < m.minAge);
    const board = forKid.length? forKid.map(m=>
      '<div class="mission"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body">'
      + '<b>'+esc(m.title)+'</b><p class="small muted">'+esc(m.desc)+'</p>'
      + '<div class="row" style="gap:8px;margin-top:9px;flex-wrap:wrap"><span class="chip gold">'+Art.icon("coinI")+m.coins+'</span>'
      + '<span class="chip">ab '+m.minAge+' Jahren</span>'
      + '<button class="btn sm" data-a="claimMission" data-id="'+m.id+'">Übernehmen</button></div></div></div>').join("")
      : empty("Gerade sind keine passenden Missionen frei.","sparkle");

    const mine = Engine.missionsOf(kid);
    const mineBox = mine.length? mine.map(m=> m.status==="claimed"
      ? '<div class="mission claimed"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body"><b>'+esc(m.title)+'</b>'
        + '<p class="small muted">Noch offen — Haken setzt du in deinem Dashboard oder hier.</p>'
        + '<div class="row" style="gap:8px;margin-top:9px"><button class="btn sm" data-a="completeMission" data-id="'+m.id+'">Erledigt — '+m.coins+' Coins</button>'
        + '<button class="btn ghost sm" data-a="returnMission" data-id="'+m.id+'">Zurückgeben</button></div></div></div>'
      : '<div class="mission" style="opacity:.72"><span class="m-ico">'+Art.illu(m.icon)+'</span><div class="m-body"><b>'+esc(m.title)+'</b><p class="small muted">Erledigt · +'+m.coins+' Coins</p></div></div>').join("")
      : empty("Noch nichts übernommen.","box");

    const rewards = db.rewards.filter(r=> age>=r.minAge).map(r=>{
      const can = coins>=r.cost;
      return '<div class="reward"><span class="r-ico">'+Art.illu(r.icon)+'</span><div style="flex:1;min-width:0">'
        + '<b class="small">'+esc(r.title)+'</b><p class="xs muted">'+esc(r.desc)+'</p>'
        + (!can? '<div style="margin-top:7px;max-width:160px">'+bar(coins/r.cost*100,"gold")+'<span class="xs muted">noch '+(r.cost-coins)+' Coins</span></div>':'')
        + '</div><button class="btn '+(can?"gold":"ghost")+' sm" data-a="redeem" data-id="'+r.id+'" '+(can?"":"disabled")+'>'+r.cost+'</button></div>';
    }).join("");

    const red = db.state.redemptions.filter(r=>r.person===kid);
    const redBox = red.length? red.map(r=>'<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2)"><div style="flex:1"><b class="small">'+esc(r.title)+'</b><div class="xs muted">'+r.date+' · '+r.cost+' Coins'+(r.used?" · benutzt":"")+'</div></div><button class="btn ghost sm" data-a="useRedemption" data-id="'+r.id+'">'+(r.used?"zurück":"benutzt")+'</button></div>').join("")

  function readForm(){
    const form = el("editForm"); const coll = form.dataset.coll;
    const obj = { id: form.dataset.id };
    FIELDS[coll].forEach(f=>{
      const node = form.querySelector('[data-f="'+f.k+'"]');
      if(!node) return;
      const type = node.dataset.type;
      let val;
      if(type==="days") val = [...node.querySelectorAll("button")].filter(b=>b.classList.contains("soft")).map(b=>+b.dataset.day);
      else if(type==="multi") val = [...node.querySelectorAll("button")].filter(b=>b.classList.contains("soft")).map(b=>b.dataset.val);
      else if(type==="check") val = node.checked;
      else if(type==="number") val = node.value===""? null : Number(node.value);
      else val = node.value;
      if(f.k==="travel.mode" && !val){ obj.travel = null; return; }
      setV(obj, f.k, val);
    });
    if(obj.travel && !obj.travel.min) obj.travel.min = 10;
    return { coll, obj };
  }
