        + syncCard()
        + '<div style="border-top:1px solid var(--line-2);padding-top:14px"><b class="small">Vorbereitet für später</b>'
        + '<p class="xs muted" style="margin-top:6px">Kalenderdaten sind vom App-Zustand getrennt modelliert: <code>events</code> beschreibt wiederkehrende Regeln, <code>state.log</code> nur Erledigungen. Ein Google-Calendar-Import kann später zusätzliche Einträge in eine Sammlung <code>externalEvents</code> schreiben, ohne die Regeln zu berühren. Ebenso ist <code>settings</code> der Ort für spätere Smart-Home-Auslöser, etwa den Saugroboter an Homeoffice-Tagen.</p></div>'
        + '<div style="border-top:1px solid var(--line-2);padding-top:14px"><b class="small">Speicherstand</b>'
        + '<p class="xs muted" style="margin-top:6px">'+Object.keys(db.state.log).length+' Tage protokolliert · '+db.chores.length+' Haushaltsaufgaben · '+db.basics.length+' Basics · '+db.missions.length+' Missionen · '+db.state.redemptions.length+' Einlösungen</p></div>'
        + '</div>';
    }
    return '<div class="stack lg" style="padding-top:18px">'
      + '<div><span class="eyebrow">Ohne Quellcode ändern</span><h1 style="margin-top:4px">Admin</h1></div>'
      + tabBar + body + '</div>';
  }

  /* ==========================  RENDER + EVENTS  ========================== */
  const TABS = [["today","Heute","today"],["me","Ich","me"],["jobs","Jobs","jobs"],["house","Haus","house"],["admin","Admin","admin"]];
  function renderNav(){
    el("nav").innerHTML = TABS.map(t=>'<button data-a="tab" data-id="'+t[0]+'" '+(S.tab===t[0]?'aria-current="page"':'')+'>'+Art.icon(t[2])+'<span>'+t[1]+'</span></button>').join("");
  }
  function render(){
    const y = window.scrollY;
    el("mark").innerHTML = Art.mark();
    el("dateB").textContent = T.dayShort(S.date)+", "+T.long(S.date);
    el("dateS").textContent = "Woche "+Engine.weekType(S.date);
    const sy = Sync.state(), dot = el("syncDot");
    if(dot){
      dot.style.display = sy.configured ? "inline-flex" : "none";
      dot.className = "sync-dot s-"+sy.status;
      dot.title = sy.status==="ok" ? "Synchronisiert" : sy.status==="error" ? ("Sync-Problem: "+sy.detail) : "Gleicht ab …";
    }
    renderNav();
    const v = el("view");
    try{
      v.innerHTML = S.tab==="today"? viewToday() : S.tab==="me"? viewMe() : S.tab==="jobs"? viewJobs() : S.tab==="house"? viewHouse() : viewAdmin();
    }catch(err){
      console.error(err);
      v.innerHTML = '<div class="card" style="margin-top:24px"><h2>Diese Ansicht lässt sich gerade nicht aufbauen</h2>'
        + '<p class="small muted" style="margin-top:8px">'+esc(err.message)+'</p>'
        + '<button class="btn ghost" style="margin-top:14px" data-a="tab" data-id="today">Zurück zu Heute</button></div>';
    }
    window.scrollTo(0,y);
  }

  function pop(id){ const n = document.querySelector('[data-id="'+id+'"]'); if(n) { n.classList.add("pop"); setTimeout(()=>n.classList.remove("pop"),420); } }

  function handle(e){
    const node = e.target.closest("[data-a]");
    if(!node) return;
    if(node.classList.contains("modal-bg") && e.target!==node) return;
    const a = node.dataset.a, id = node.dataset.id, k = S.date;
    switch(a){
      case "tab": S.tab=id; render(); window.scrollTo(0,0); break;
      case "setPerson": S.person=id; render(); break;
      case "openPerson": S.person=id; S.tab="me"; render(); window.scrollTo(0,0); break;
      case "setJobKid": S.jobKid=id; render(); break;
      case "setHouseFilter": S.houseFilter = id==="alle"?"all":id; render(); break;
      case "setAdminTab": S.adminTab=id; render(); break;
      case "dateShift": S.date = T.addDays(S.date, +node.dataset.n); Actions.ensureDay(S.date); render(); break;
      case "dateToday": S.date = T.key(new Date()); render(); break;
      case "toggleBasic": Actions.toggleBasic(id,k); pop(id); break;
      case "toggleChore": Actions.toggleChore(id,k,e); pop(id); break;
      case "claimMission": Actions.claimMission(id, S.tab==="jobs"? S.jobKid : S.person); break;
      case "returnMission": e.stopPropagation(); Actions.returnMission(id); break;
      case "completeMission": Actions.completeMission(id,k,e); break;
      case "redeem": Actions.redeem(id, S.jobKid, e); break;
      case "useRedemption": Actions.markRedemptionUsed(id); break;
      case "logMedia": Actions.logMedia(id, +node.dataset.n, k); break;
      case "undoMedia": Actions.undoMedia(id, +node.dataset.n, k); break;
      case "swapEvening": Actions.swapEvening(k); break;
      case "edit": openEdit(node.dataset.coll, id); break;
      case "del": if(confirm("Wirklich löschen?")) Actions.remove(node.dataset.coll, id); break;
      case "saveEdit": {
        const {coll,obj} = readForm();
        if(!obj.title || !String(obj.title).trim()){ toast("Bitte einen Titel eintragen."); break; }
        if(coll==="events" && (!obj.start || !obj.end)){ toast("Termine brauchen Beginn und Ende."); break; }
        if(coll==="events" && T.min(obj.end) <= T.min(obj.start)){ toast("Das Ende muss nach dem Beginn liegen."); break; }
        if(coll==="chores" && (!obj.interval || obj.interval<1)){ toast("Das Intervall muss mindestens 1 Tag sein."); break; }
        if(coll==="chores" && (!obj.pool || !obj.pool.length)){ toast("Bitte mindestens eine Person auswählen."); break; }
        if(coll==="basics" && (!obj.days || !obj.days.length)){ toast("Bitte mindestens einen Wochentag wählen."); break; }
        if(coll==="chores" && !obj.room) obj.room = "Haus";
        if(coll==="chores" && !obj.lastDone) obj.lastDone = T.addDays(S.date, -(obj.interval||1));
        if(coll==="chores" && !obj.effort) obj.effort = 1;
        if((coll==="missions"||coll==="rewards") && !obj.icon) obj.icon = "sparkle";
        Actions.upsert(coll,obj); closeModal(); toast("Gespeichert."); break; }
      case "deleteEdit": { const form=el("editForm"); Actions.remove(form.dataset.coll, form.dataset.id); closeModal(); break; }
      case "closeModal": closeModal(); break;
      case "export": doExport(); break;
      case "importOpen": doImportOpen(); break;
      case "resetAll": if(confirm("Alle Daten löschen und neu starten?")){ Store.reset(); toast("Zurückgesetzt."); } break;
      case "syncOpen": syncModal(); break;
      case "syncOff": if(confirm("Verbindung trennen? Die Daten bleiben auf diesem Gerät, werden aber nicht mehr abgeglichen.")){ Sync.disconnect(); render(); } break;
      case "syncNow": Sync.cycle().then(()=>toast("Abgeglichen.")); break;
      case "syncSnapshot":
        if(confirm("Der Stand dieses Geräts wird zum gültigen Familienstand. Andere Geräte übernehmen ihn beim nächsten Abgleich. Fortfahren?"))
          Sync.publishSnapshot().then(()=>{ toast("Familienstand gesetzt."); render(); })
                                .catch(err=> toast("Fehlgeschlagen: "+err.message));
        break;
      case "syncSave": {
        const next = { url:el("syUrl").value.trim(), key:el("syKey").value.trim(),
                       family:el("syFam").value.trim(), name:el("syName").value.trim()||"Gerät" };
        if(!next.url || !next.key || !next.family){ toast("Bitte URL, Key und Familienname ausfüllen."); break; }
        toast("Verbinde …");
        Sync.connect(next, ()=> Promise.resolve(confirm(
            "Auf dem Server liegt bereits ein Familienstand.\n\nOK = diesen übernehmen (lokale Daten dieses Geräts werden ersetzt).\nAbbrechen = die lokalen Daten dieses Geräts zum Familienstand machen.")))
          .then(()=>{ closeModal(); toast("Verbunden."); render(); })
          .catch(err=> toast("Verbindung fehlgeschlagen: "+err.message));
        break; }
    }
    /* Mehrfachauswahl-Buttons im Formular */
    if(node.dataset.day!=null || node.dataset.val!=null){ node.classList.toggle("soft"); node.classList.toggle("ghost"); }
  }
  function handleChange(e){
    const node = e.target.closest("[data-a]"); if(!node) return;
    const a = node.dataset.a;
    if(a==="setS") Actions.patchSettings({[node.dataset.k]: node.value});
    else if(a==="setShop"){ const s=Object.assign({},Store.get().settings.shopping); s[node.dataset.k]= node.dataset.k==="day"? +node.value : node.value; Actions.patchSettings({shopping:s}); }
    else if(a==="setKey") Actions.patchSettings({hannahHasKey:node.checked});
    else if(a==="setMeta") Actions.patchMeta({[node.dataset.k]: node.value});
    else if(a==="setCoins") Actions.setCoins(node.dataset.id, +node.value);
  }
  function doExport(){
    const blob = new Blob([Store.exportJSON()], {type:"application/json"});
    const u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href=u; a.download="nestwerk-sicherung-"+T.key(new Date())+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1500); toast("Sicherung heruntergeladen.");
  }
  function doImportOpen(){
    modal("Sicherung einspielen",
      '<p class="small muted" style="margin-bottom:12px">Datei auswählen oder JSON einfügen. Die aktuellen Daten werden ersetzt.</p>'
      + '<input type="file" accept="application/json" id="impFile" class="f" style="padding:9px">'
      + '<textarea class="f" id="impText" rows="7" style="margin-top:12px" placeholder="{ ... }"></textarea>',
      '<button class="btn" id="impGo">Einspielen</button><span class="spacer"></span><button class="btn ghost" data-a="closeModal">Abbrechen</button>');
    el("impFile").addEventListener("change", ev=>{
      const f = ev.target.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = ()=>{ el("impText").value = r.result; }; r.readAsText(f);
    });
    el("impGo").addEventListener("click", ()=>{
      try{ Store.importJSON(el("impText").value); closeModal(); toast("Daten eingespielt."); }
      catch(err){ toast("Datei nicht lesbar: "+err.message); }
    });
  }

  function init(){
    Store.load();
    Store.subscribe(render);
    Sync.init();
    Actions.ensureDay(S.date);
    document.addEventListener("click", handle);
    document.addEventListener("change", handleChange);
    document.addEventListener("keydown", e=>{
      if((e.key==="Enter"||e.key===" ") && e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.click(); }
      if(e.key==="Escape") closeModal();
    });
    /* Tageswechsel um Mitternacht abfangen */
    /* Nur die Jetzt-Linie im Tagesband aktualisieren — nie beim Tippen neu rendern */
    setInterval(()=>{
      if(S.tab!=="today") return;
      if(el("modalRoot").innerHTML) return;
      if(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      render();
    }, 60000);
    render();
  }

  return { init, render, toast, coinFly, celebrate, modal, closeModal, S };
})();

document.addEventListener("DOMContentLoaded", UI.init);
</script>
</body>
</html>
